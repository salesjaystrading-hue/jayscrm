<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAYS CRM PRO | Jays Trading and Business Solution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --navy:#0B1424;
    --navy-2:#12203A;
    --navy-3:#1B2E4F;
    --orange:#EB5A28;
    --orange-dark:#C8461A;
    --orange-light:#FDEBE3;
    --accent:#0E9F76;
    --accent-dark:#0B7A5C;
    --accent-light:#E4F6EF;
    --amber:#E8A33D;
    --amber-light:#FCF1DD;
    --red:#D9534F;
    --red-light:#FBEAE9;
    --blue:#3B82C4;
    --blue-light:#E8F1FA;
    --violet:#8B5CF6;
    --violet-light:#F1EBFE;
    --bg:#F1F4F9;
    --card:#FFFFFF;
    --text:#152234;
    --text-mute:#66768C;
    --border:#E4E9F1;
    --radius:12px;
    --shadow: 0 1px 2px rgba(15,35,60,0.06), 0 4px 18px rgba(15,35,60,0.05);
    --shadow-lg: 0 20px 50px rgba(11,20,36,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    font-size:14px;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:14px;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:8px;}
  h1,h2,h3,h4{font-family:'Inter',sans-serif;}

  /* ---------- LOGIN ---------- */
  #loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 15% 15%, #EB5A2822 0%, transparent 40%),
      radial-gradient(circle at 85% 85%, #0E9F7622 0%, transparent 40%),
      linear-gradient(160deg, var(--navy) 0%, #060B14 100%);
    padding:20px;
    position:relative;
    overflow:hidden;
  }
  #loginScreen::before{
    content:'';position:absolute;inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.045) 1px, transparent 1px);
    background-size:26px 26px;
    pointer-events:none;
  }
  .login-wrap{position:relative;z-index:1;width:100%;max-width:400px;}
  .login-logo-box{
    display:flex;align-items:center;justify-content:center;
    margin-bottom:22px;
  }
  .login-logo-box img{max-width:280px;width:100%;height:auto;filter:drop-shadow(0 10px 25px rgba(0,0,0,0.35));}
  .login-card{
    width:100%;
    background:var(--card);
    border-radius:18px;
    padding:34px 32px 30px;
    box-shadow:var(--shadow-lg);
    border:1px solid rgba(255,255,255,0.06);
  }
  .login-card h1{font-size:19px;margin:0 0 3px;font-weight:800;letter-spacing:-0.3px;}
  .login-card p.sub{color:var(--text-mute);margin:0 0 24px;font-size:13px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11.5px;font-weight:700;color:var(--text-mute);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.4px;}
  .field input, .field select, .field textarea{
    width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;
    background:#fbfcfe;outline:none;transition:border-color .15s, box-shadow .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--orange);background:#fff;box-shadow:0 0 0 3px var(--orange-light);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:10px 16px;border-radius:9px;border:none;font-weight:700;font-size:13.5px;
    transition:transform .06s, filter .15s, box-shadow .15s;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:linear-gradient(135deg, var(--orange), var(--orange-dark));color:#fff;box-shadow:0 6px 16px rgba(235,90,40,0.3);}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-block{width:100%;}
  .btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--text);}
  .btn-outline:hover{border-color:var(--orange);color:var(--orange-dark);}
  .btn-ghost{background:transparent;border:none;color:var(--text-mute);}
  .btn-ghost:hover{color:var(--text);}
  .btn-danger{background:var(--red-light);color:var(--red);}
  .btn-danger:hover{background:var(--red);color:#fff;}
  .btn-sm{padding:7px 12px;font-size:12.5px;border-radius:7px;}
  .btn-xs{padding:4px 9px;font-size:11.5px;border-radius:6px;}
  .btn-wa{background:#25D366;color:#fff;}
  .btn-wa:hover{filter:brightness(1.06);}
  .btn-green{background:var(--accent);color:#fff;}
  .btn-green:hover{filter:brightness(1.08);}
  .login-error{background:var(--red-light);color:var(--red);padding:9px 12px;border-radius:9px;font-size:12.5px;margin-bottom:14px;display:none;}
  .demo-note{margin-top:18px;font-size:11.5px;color:var(--text-mute);text-align:center;line-height:1.6;background:#F7F9FB;border:1px dashed var(--border);border-radius:9px;padding:10px;}

  /* ---------- APP SHELL ---------- */
  #appScreen{display:none;height:100vh;}
  .shell{display:flex;height:100vh;overflow:hidden;}
  .sidebar{
    width:236px;flex-shrink:0;background:linear-gradient(180deg, var(--navy) 0%, #0A1220 100%);color:#cfe0ef;
    display:flex;flex-direction:column;padding:16px 12px;
  }
  .side-brand{display:flex;align-items:center;gap:10px;padding:6px 6px 18px;border-bottom:1px solid rgba(255,255,255,0.08);margin-bottom:12px;}
  .side-brand .mark{width:38px;height:38px;border-radius:10px;overflow:hidden;flex-shrink:0;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(235,90,40,0.25);}
  .side-brand .mark img{width:100%;height:100%;object-fit:cover;}
  .side-brand .name{font-weight:800;font-size:13px;color:#fff;line-height:1.3;}
  .side-brand .name span{display:block;font-weight:500;font-size:10px;color:#7d93ab;text-transform:uppercase;letter-spacing:0.5px;}
  .nav{flex:1;overflow-y:auto;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;
    font-size:13px;font-weight:500;color:#a9bdd2;margin-bottom:2px;cursor:pointer;
    transition:background .12s,color .12s;
  }
  .nav-item:hover{background:var(--navy-2);color:#fff;}
  .nav-item.active{background:linear-gradient(135deg, var(--orange), var(--orange-dark));color:#fff;font-weight:700;box-shadow:0 4px 12px rgba(235,90,40,0.3);}
  .nav-item .ic{width:18px;text-align:center;font-size:14px;}
  .nav-item .cnt{margin-left:auto;background:rgba(255,255,255,0.12);padding:1px 7px;border-radius:20px;font-size:10.5px;font-weight:700;}
  .nav-item.active .cnt{background:rgba(255,255,255,0.25);}
  .nav-section-label{font-size:10px;text-transform:uppercase;letter-spacing:0.7px;color:#5f7590;padding:14px 12px 6px;font-weight:700;}
  .side-foot{padding-top:12px;border-top:1px solid var(--navy-3);margin-top:8px;}
  .user-pill{display:flex;align-items:center;gap:9px;padding:8px;border-radius:9px;background:var(--navy-2);}
  .user-pill .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg, var(--orange), var(--orange-dark));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex-shrink:0;}
  .user-pill .info{overflow:hidden;flex:1;}
  .user-pill .info .n{font-size:12.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .user-pill .info .r{font-size:10.5px;color:#8fa4ba;}
  .user-pill .logout{background:none;border:none;color:#8fa4ba;font-size:15px;padding:4px;}
  .user-pill .logout:hover{color:#fff;}

  .main-col{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{
    height:60px;flex-shrink:0;background:#fff;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;padding:0 22px;
  }
  .topbar h2{font-size:16px;margin:0;font-weight:800;letter-spacing:-0.2px;}
  .topbar .sub{font-size:11.5px;color:var(--text-mute);margin-top:1px;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .content{flex:1;overflow-y:auto;padding:22px;}

  /* ---------- CARDS / GRID ---------- */
  .grid{display:grid;gap:16px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:2fr 1fr;}
  .grid-5{grid-template-columns:repeat(5,1fr);}
  @media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;} .grid-3{grid-template-columns:repeat(2,1fr);} .grid-5{grid-template-columns:repeat(2,1fr);}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
  .card-pad{padding:18px 18px;}
  .card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);}
  .card-head h3{margin:0;font-size:14px;font-weight:800;}
  .card-head .hint{font-size:11.5px;color:var(--text-mute);}

  .stat-card{padding:18px;position:relative;overflow:hidden;}
  .stat-card .lbl{font-size:11px;color:var(--text-mute);font-weight:700;text-transform:uppercase;letter-spacing:0.4px;}
  .stat-card .val{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-0.5px;}
  .stat-card .delta{font-size:11.5px;margin-top:6px;color:var(--text-mute);}
  .stat-card .ic{position:absolute;right:14px;top:14px;font-size:22px;opacity:.18;}
  .stat-card .bar{position:absolute;left:0;top:0;bottom:0;width:4px;}
  .bar-green{background:var(--accent);}
  .bar-amber{background:var(--amber);}
  .bar-red{background:var(--red);}
  .bar-blue{background:var(--blue);}
  .bar-orange{background:var(--orange);}
  .bar-violet{background:var(--violet);}

  /* ---------- SEARCHABLE CUSTOMER PICKER ---------- */
  .cust-picker{position:relative;}
  .cust-picker-input{width:100%;}
  .cust-picker-list{display:none;margin-top:6px;max-height:230px;overflow-y:auto;border:1.5px solid var(--border);border-radius:9px;background:#fff;}
  .cust-picker-item{padding:8px 12px;cursor:pointer;font-size:12.5px;border-bottom:1px solid #F1F4F8;display:flex;flex-direction:column;gap:1px;}
  .cust-picker-item:last-child{border-bottom:none;}
  .cust-picker-item:hover{background:#F6F8FB;}
  .cust-picker-item .cpi-name{font-weight:700;color:var(--text);}
  .cust-picker-item .cpi-sub{color:var(--text-mute);font-size:11px;}
  .cust-picker-clear{color:var(--red);font-weight:700;}
  .cust-picker-empty{color:var(--text-mute);cursor:default;}
  .cust-picker-empty:hover{background:none;}
  .row-check{width:16px;height:16px;cursor:pointer;}

  /* ---------- TABLE ---------- */
  .table-wrap{overflow-x:auto;}
  /* Custom screen-fixed horizontal scrollbar for wide tables. Drawn manually
     (not relying on the native OS scrollbar) so it is always visible on every
     browser/OS/trackpad, including Mac/touch "overlay" scrollbars that only
     reveal themselves on hover and are otherwise invisible. */
  .bottom-scrollbar{
    position:fixed;left:236px;right:0;bottom:0;height:18px;
    background:#EDF0F5;border-top:1px solid var(--border);z-index:85;display:none;
    cursor:pointer;
  }
  .bottom-scrollbar-thumb{
    position:absolute;top:3px;height:12px;min-width:40px;border-radius:8px;
    background:#9AA9BC;cursor:grab;transition:background .12s;
  }
  .bottom-scrollbar-thumb:hover{background:#7C8CA3;}
  .bottom-scrollbar.dragging .bottom-scrollbar-thumb{background:var(--orange);cursor:grabbing;}
  @media(max-width:880px){ .bottom-scrollbar{left:0;height:22px;} .bottom-scrollbar-thumb{top:4px;height:14px;} }
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:left;padding:10px 14px;font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;
    color:var(--text-mute);border-bottom:1px solid var(--border);background:#FAFBFD;white-space:nowrap;font-weight:700;
  }
  tbody td{padding:10px 14px;border-bottom:1px solid #F0F3F7;vertical-align:middle;white-space:nowrap;}
  tbody tr:hover{background:#FAFCFE;}
  tbody tr:last-child td{border-bottom:none;}
  .cell-main{font-weight:700;color:var(--text);cursor:pointer;}
  .cell-main:hover{color:var(--orange-dark);text-decoration:underline;}
  .cell-mute{color:var(--text-mute);font-size:12.5px;}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
  .badge-green{background:var(--accent-light);color:var(--accent-dark);}
  .badge-amber{background:var(--amber-light);color:#9A6B12;}
  .badge-red{background:var(--red-light);color:var(--red);}
  .badge-blue{background:var(--blue-light);color:var(--blue);}
  .badge-orange{background:var(--orange-light);color:var(--orange-dark);}
  .badge-violet{background:var(--violet-light);color:#6D3FCB;}
  .badge-gray{background:#EEF1F5;color:#5B6B80;}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

  .toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .toolbar .search{position:relative;flex:1;min-width:180px;max-width:280px;}
  .toolbar .search input{width:100%;padding:8px 12px 8px 30px;border:1.5px solid var(--border);border-radius:9px;background:#fff;}
  .toolbar .search .ic{position:absolute;left:10px;top:9px;color:var(--text-mute);font-size:12px;}
  .toolbar select{padding:8px 10px;border:1.5px solid var(--border);border-radius:9px;background:#fff;color:var(--text-mute);font-size:12.5px;}
  .toolbar-spacer{flex:1;}
  .icon-btn{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--border);background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--text-mute);text-decoration:none;}
  .icon-btn:hover{border-color:var(--orange);color:var(--orange-dark);}

  .empty-state{padding:52px 20px;text-align:center;color:var(--text-mute);}
  .empty-state .ic{font-size:34px;margin-bottom:10px;opacity:.6;}
  .empty-state .t{font-weight:700;color:var(--text);font-size:14px;margin-bottom:4px;}
  .empty-state .d{font-size:12.5px;max-width:340px;margin:0 auto 14px;}

  /* ---------- MODAL ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(10,16,28,0.5);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 30px 70px rgba(0,0,0,0.3);}
  .modal.wide{max-width:820px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:2;}
  .modal-head h3{margin:0;font-size:15.5px;font-weight:800;}
  .modal-close{background:none;border:none;font-size:18px;color:var(--text-mute);padding:4px 8px;border-radius:7px;}
  .modal-close:hover{background:#F1F4F8;}
  .modal-body{padding:20px 22px;}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:#fff;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:560px){.form-row{grid-template-columns:1fr;}}

  .toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,0.25);z-index:200;display:none;align-items:center;gap:8px;}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap;}
  .tab-btn{padding:9px 14px;font-size:13px;font-weight:700;color:var(--text-mute);background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab-btn.active{color:var(--orange-dark);border-color:var(--orange);}
  .tab-btn .cnt{background:#EEF1F5;color:var(--text-mute);padding:1px 7px;border-radius:20px;font-size:10.5px;margin-left:5px;}
  .tab-btn.active .cnt{background:var(--orange-light);color:var(--orange-dark);}

  .drawer-overlay{position:fixed;inset:0;background:rgba(10,16,28,0.45);display:none;z-index:100;}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:92vw;background:#fff;box-shadow:-10px 0 40px rgba(0,0,0,0.2);overflow-y:auto;z-index:101;}
  @media(max-width:900px){.drawer{width:100%;}}

  .chart-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;justify-content:center;}
  .chart-legend .li{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-mute);}
  .chart-legend .sw{width:9px;height:9px;border-radius:2px;}

  .kpi-row{display:flex;gap:8px;flex-wrap:wrap;}
  .quo-line{display:grid;grid-template-columns:2.4fr 0.8fr 0.9fr 0.9fr auto;gap:8px;margin-bottom:8px;align-items:center;}
  @media(max-width:560px){.quo-line{grid-template-columns:1fr;}}

  /* ---------- TIMELINE ---------- */
  .timeline{position:relative;margin-left:6px;padding-left:22px;border-left:2px solid var(--border);}
  .timeline-item{position:relative;padding-bottom:18px;}
  .timeline-item:last-child{padding-bottom:2px;}
  .timeline-item .dotmark{position:absolute;left:-28px;top:1px;width:14px;height:14px;border-radius:50%;background:var(--orange);border:3px solid #fff;box-shadow:0 0 0 2px var(--orange);}
  .timeline-item.done .dotmark{background:var(--accent);box-shadow:0 0 0 2px var(--accent);}
  .timeline-item .ttl{font-weight:700;font-size:12.8px;}
  .timeline-item .meta{font-size:11.3px;color:var(--text-mute);margin-top:1px;}
  .timeline-item .note{font-size:12px;color:var(--text);margin-top:3px;background:#FAFBFD;border:1px solid var(--border);padding:6px 9px;border-radius:8px;}

  .stage-track{display:flex;align-items:center;gap:0;margin:6px 0 18px;overflow-x:auto;padding-bottom:4px;}
  .stage-step{display:flex;flex-direction:column;align-items:center;min-width:92px;position:relative;}
  .stage-step .circ{width:30px;height:30px;border-radius:50%;background:#EEF1F5;color:var(--text-mute);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;border:2px solid var(--border);z-index:1;}
  .stage-step.on .circ{background:linear-gradient(135deg,var(--orange),var(--orange-dark));color:#fff;border-color:var(--orange-dark);}
  .stage-step .lbl{font-size:10.5px;font-weight:700;color:var(--text-mute);margin-top:6px;text-align:center;max-width:90px;}
  .stage-step.on .lbl{color:var(--text);}
  .stage-line{flex:1;height:2px;background:var(--border);min-width:20px;margin-top:-20px;}
  .stage-line.on{background:var(--orange);}

  /* ---------- Follow-up Centre ---------- */
  .fu-pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .fu-pill{padding:9px 16px;border-radius:11px;background:#fff;border:1.5px solid var(--border);cursor:pointer;font-weight:700;font-size:12.5px;color:var(--text-mute);display:flex;align-items:center;gap:7px;}
  .fu-pill .n{background:#EEF1F5;padding:1px 8px;border-radius:20px;font-size:11px;}
  .fu-pill.active{border-color:var(--orange);color:var(--orange-dark);background:var(--orange-light);}
  .fu-pill.active .n{background:var(--orange);color:#fff;}
  .fu-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);}
  .fu-card.overdue{border-left:4px solid var(--red);}
  .fu-card.today{border-left:4px solid var(--amber);}
  .fu-card.done{border-left:4px solid var(--accent);opacity:.8;}
  .fu-card .info{flex:1;min-width:0;}
  .fu-card .nm{font-weight:800;font-size:13.5px;}
  .fu-card .pp{font-size:12px;color:var(--text-mute);margin-top:2px;}
  .fu-card .dt{font-size:11.5px;color:var(--text-mute);margin-top:4px;}
  .fu-actions{display:flex;gap:6px;flex-shrink:0;}
  .fu-actions a, .fu-actions button{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;border:1.5px solid var(--border);background:#fff;text-decoration:none;color:var(--text-mute);}
  .fu-actions .call{color:var(--blue);}
  .fu-actions .wa{color:#25D366;}
  .fu-actions .em{color:var(--violet);}
  .fu-actions .done-btn{color:var(--accent);}
  .fu-actions a:hover, .fu-actions button:hover{border-color:currentColor;}

  /* ---------- Backup ---------- */
  .backup-tile{background:#fff;border:1px solid var(--border);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);}
  .backup-tile .bic{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:4px;}
  .backup-tile h4{margin:0;font-size:14.5px;font-weight:800;}
  .backup-tile p{margin:0;font-size:12.3px;color:var(--text-mute);line-height:1.5;flex:1;}

  .print-only{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute;top:0;left:0;width:100%;padding:24px;}
    .print-only{display:block;}
  }

  @media(max-width:880px){
    .sidebar{position:fixed;left:-250px;top:0;bottom:0;z-index:90;transition:left .2s;}
    .sidebar.open{left:0;}
    .content{padding:14px;}
    .grid-4{grid-template-columns:repeat(2,1fr);}
    .grid-5{grid-template-columns:repeat(2,1fr);}
    .topbar{padding:0 12px;}
  }
  .menu-toggle{display:none;background:none;border:1.5px solid var(--border);border-radius:9px;width:34px;height:34px;font-size:15px;}
  @media(max-width:880px){.menu-toggle{display:inline-flex;align-items:center;justify-content:center;}}

  textarea{resize:vertical;min-height:70px;}
  label.chk{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;}

  /* ---------- Universal table system (sticky actions, pagination, sort) ---------- */
  table th.col-actions, table td.col-actions{
    position:sticky;left:0;z-index:3;background:#fff;
    box-shadow:2px 0 4px rgba(15,35,60,0.06);
    white-space:nowrap;padding:8px 10px !important;
  }
  table thead th.col-actions{z-index:4;background:var(--bg);}
  table tr:hover td.col-actions{background:#FAFBFD;}
  .table-wrap table thead th{position:sticky;top:0;background:var(--bg);z-index:2;cursor:default;}
  .table-wrap{max-height:70vh;}
  th.sortable{cursor:pointer;user-select:none;white-space:nowrap;}
  th.sortable:hover{color:var(--orange);}
  th.sortable .arrow{font-size:10px;opacity:.55;margin-left:3px;}
  th.sortable.active .arrow{opacity:1;color:var(--orange);}
  .row-action-btns{display:flex;gap:4px;align-items:center;}
  .row-action-btns .icon-btn{width:26px;height:26px;font-size:13px;}
  .table-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px;}
  .pager{display:flex;align-items:center;gap:6px;justify-content:flex-end;padding:10px 14px;font-size:12.5px;color:var(--text-mute);flex-wrap:wrap;}
  .pager select{padding:4px 8px;font-size:12.5px;border-radius:7px;}
  .pager .pg-btn{border:1.5px solid var(--border);background:#fff;border-radius:7px;padding:4px 10px;font-size:12.5px;cursor:pointer;}
  .pager .pg-btn:disabled{opacity:.4;cursor:default;}
  .pager .pg-btn.active{background:var(--orange);border-color:var(--orange);color:#fff;}
  .match-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:800;}
  .match-high{background:var(--accent-light);color:var(--accent-dark);}
  .match-medium{background:var(--amber-light);color:#95610F;}
  .match-low{background:var(--border);color:var(--text-mute);}
  .deadline-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:800;white-space:nowrap;}
  .dl-critical{background:var(--red-light);color:var(--red);}
  .dl-soon{background:var(--amber-light);color:#95610F;}
  .dl-ok{background:var(--accent-light);color:var(--accent-dark);}
  .dl-over{background:var(--border);color:var(--text-mute);}
  .kpi-mini{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);transition:transform .12s, box-shadow .12s;}
  .kpi-mini:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
  .doc-progress{background:var(--border);border-radius:6px;height:8px;overflow:hidden;}
  .doc-progress > div{height:100%;background:var(--accent);}
  .bid-stage-flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .bid-stage-flow .stg{padding:5px 11px;border-radius:20px;font-size:11px;font-weight:700;background:var(--border);color:var(--text-mute);white-space:nowrap;}
  .bid-stage-flow .stg.active{background:var(--orange);color:#fff;}
  .bid-stage-flow .stg.done{background:var(--accent-light);color:var(--accent-dark);}
  .bid-stage-flow .arrow-sep{color:var(--text-mute);font-size:11px;}
</style>
</head>

const Paginate = {
  state: {},
  get(module){
    if(!this.state[module]) this.state[module] = {page:1, perPage:25};
    return this.state[module];
  },
  slice(module, list){
    const st = this.get(module);
    const total = list.length;
    const totalPages = Math.max(1, Math.ceil(total/st.perPage));
    if(st.page>totalPages) st.page = totalPages;
    if(st.page<1) st.page = 1;
    const start = (st.page-1)*st.perPage;
    return { pageItems: list.slice(start, start+st.perPage), page: st.page, perPage: st.perPage, total, totalPages, start: total?start+1:0, end: Math.min(start+st.perPage, total) };
  },
  setPage(module, p, rerender){ this.get(module).page = Number(p); rerender(); },
  setPerPage(module, n, rerender){ const st=this.get(module); st.perPage=Number(n); st.page=1; rerender(); },
  controlsHTML(module, info, rerenderCall){
    if(info.total===0) return '';
    const maxBtns = 5;
    let startP = Math.max(1, info.page-2), endP = Math.min(info.totalPages, startP+maxBtns-1);
    startP = Math.max(1, endP-maxBtns+1);
    const pages = []; for(let p=startP;p<=endP;p++) pages.push(p);
    return `<div class="pager">
      <span>Showing ${info.start}&ndash;${info.end} of ${info.total}</span>
      <select onchange="Paginate.setPerPage('${module}', this.value, ()=>${rerenderCall})">
        ${[25,50,100].map(n=>`<option value="${n}" ${n===info.perPage?'selected':''}>${n} / page</option>`).join('')}
      </select>
      <button class="pg-btn" ${info.page<=1?'disabled':''} onclick="Paginate.setPage('${module}', ${info.page-1}, ()=>${rerenderCall})">&lsaquo; Prev</button>
      ${pages.map(p=>`<button class="pg-btn ${p===info.page?'active':''}" onclick="Paginate.setPage('${module}', ${p}, ()=>${rerenderCall})">${p}</button>`).join('')}
      <button class="pg-btn" ${info.page>=info.totalPages?'disabled':''} onclick="Paginate.setPage('${module}', ${info.page+1}, ()=>${rerenderCall})">Next &rsaquo;</button>
    </div>`;
  }
};
const SortState = {};
function toggleSort(module, key, rerenderCall){
  if(!SortState[module]) SortState[module] = {key:null, dir:1};
  const st = SortState[module];
  if(st.key===key) st.dir = -st.dir; else { st.key = key; st.dir = 1; }
  (new Function(rerenderCall))();
}
function sortArrow(module, key){
  const st = SortState[module];
  if(!st || st.key!==key) return '<span class="arrow">&#8645;</span>';
  return `<span class="arrow">${st.dir===1?'&#9650;':'&#9660;'}</span>`;
}
function applySort(module, list, accessor){
  const st = SortState[module];
  if(!st || !st.key) return list;
  const dir = st.dir;
  return list.slice().sort((a,b)=>{
    let av = accessor(a, st.key), bv = accessor(b, st.key);
    if(av===null||av===undefined) av='';
    if(bv===null||bv===undefined) bv='';
    if(typeof av === 'number' && typeof bv === 'number') return (av-bv)*dir;
    return String(av).localeCompare(String(bv))*dir;
  });
}

  async loadUsers(){

     disappeared" complaints: if this collection's most recent load
     from Supabase failed (network hiccup, session not ready yet,
     wrong keys after a redeploy...), this.data[collection] holds a
     blank fallback, NOT what's really in the cloud. Saving it here
     would overwrite the real data with that blank value. So: refuse,
     warn, and leave the cloud row untouched until a fresh, successful
     load confirms it's safe to write again. */
  async save(collection){
    const key = 'jays_' + collection.toLowerCase();
    if(this.loadFailed[key]){
      UI.toast('⚠ Not saved — your data failed to load from the server. Refresh the page and sign in again before editing.');

      return false;
    }
    const ok = await this.saveKey(key, this.data[collection]);
    if(!ok) UI.toast('⚠ Save failed — check your connection and try again.');
    return ok;
  },
};

const Util = {
  uid(prefix, arr){
    let n = arr.length + 1;
    let id;
    do{ id = prefix + String(n).padStart(3,'0'); n++; } while(arr.some(x=>x.id===id));
    return id;
  },
  todayISO(){ return new Date().toISOString().slice(0,10); },
  nowStr(){ return new Date().toLocaleString('en-IN', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); },
  fmtDate(d){
    if(!d) return '<span class="cell-mute">&mdash;</span>';
    const dt = new Date(d+'T00:00:00');
    if(isNaN(dt)) return d;
    return dt.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
  },
  fmtDateTime(iso){
    if(!iso) return '—';
    const dt = new Date(iso);
    if(isNaN(dt)) return iso;
    return dt.toLocaleString('en-IN', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  },
  fmtMoney(n){
    n = Number(n)||0;
    return '&#8377;' + n.toLocaleString('en-IN', {maximumFractionDigits:0});
  },
  escapeHtml(s){
    if(s===null||s===undefined) return '';
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  },
  waLink(phone, msg){
    let digits = (phone||'').toString().replace(/\D/g,'');
    if(digits.length===10) digits = (Store.data.settings.whatsappCC||'91') + digits;
    return 'https://wa.me/'+digits+(msg? ('?text='+encodeURIComponent(msg)) : '');
  },
  mailLink(email, subject, body){
    return 'mailto:'+(email||'')+'?subject='+encodeURIComponent(subject||'')+'&body='+encodeURIComponent(body||'');
  },
  daysUntil(dateStr){
    if(!dateStr) return null;
    const d = new Date(dateStr+'T00:00:00');
    const t = new Date(); t.setHours(0,0,0,0);
    return Math.round((d-t)/86400000);
  },
  csvSafe(v){ return v===undefined||v===null? '' : v; }
};

const CustPicker = {
  html(prefix, selectedId, cbName, placeholder){

    box.style.display = 'block';

    document.getElementById(prefix+'_customerId').value = custId;
    document.getElementById(prefix+'_custSearch').value = c.name+' — '+(c.panchayath||'—')+' — '+(c.phone||'');
    document.getElementById(prefix+'_custList').style.display = 'none';

    document.getElementById(prefix+'_customerId').value = '';
    document.getElementById(prefix+'_custSearch').value = '';
    document.getElementById(prefix+'_custList').style.display = 'none';
    const wrap = document.getElementById(prefix+'_pickerWrap');

    if(cb && typeof window[cb]==='function') window[cb](null);
  },
  closeAll(){
    document.querySelectorAll('.cust-picker-list').forEach(el=>el.style.display='none');
  }
};

/* =====================================================================
   AUTH — fully backed by Supabase Auth (email/password) + Row Level
   Security. The login box still takes a "username"; it's mapped to a
   synthetic email (username@jaystrading.crm) that Supabase Auth uses
   as the account identifier. Auth.session holds the signed-in user's
   public.profiles row (username, name, role, permissions) — never a
   password, which Supabase Auth owns exclusively from here on.
===================================================================== */
const Auth = {
  session: null,
  async login(){
    const uRaw = document.getElementById('loginUser').value.trim();
    const p = document.getElementById('loginPass').value;
    const err = document.getElementById('loginError');
    if(!uRaw || !p){ err.textContent='Enter username and password.'; err.style.display='block'; return; }
    const email = uRaw.includes('@') ? uRaw.toLowerCase() : (uRaw.toLowerCase()+'@jaystrading.crm');
    const { data, error } = await sb.auth.signInWithPassword({ email, password: p });
    if(error || !data.session){
      err.textContent = 'Incorrect username or password.';
      err.style.display='block';
      return;
    }
    const ok = await this.loadProfile(data.session.user.id);
    if(!ok){
      err.textContent = 'Your account has no CRM profile yet. Contact an admin.';
      err.style.display='block';
      await sb.auth.signOut();
      return;
    }
    err.style.display='none';
    await Store.loadAll();
    await Activity.log('Login', this.session.username+' signed in');
    App.boot();
  },
  async loadProfile(userId){
    try{
      const { data, error } = await sb.from('profiles').select('*').eq('id', userId).maybeSingle();
      if(error || !data) return false;
      this.session = data;
      return true;
    }catch(e){ console.error('loadProfile failed', e); return false; }
  },
  async tryRestore(){
    try{
      const { data } = await sb.auth.getSession();
      const session = data && data.session;
      if(!session) return false;
      const ok = await this.loadProfile(session.user.id);
      if(!ok){ await sb.auth.signOut(); return false; }
      await Store.loadAll();
      return true;
    }catch(e){ console.error('tryRestore failed', e); return false; }
  },
  async logout(){
    await Activity.log('Logout', (this.session&&this.session.username)+' signed out');
    await sb.auth.signOut();
    this.session = null;
    document.getElementById('appScreen').style.display='none';
    document.getElementById('loginScreen').style.display='flex';
    document.getElementById('loginUser').value='';
    document.getElementById('loginPass').value='';
  },
  isAdmin(){ return this.session && this.session.role==='Admin'; }
};

function navBadgeCount(id){
  const today = Util.todayISO();
  if(id==='followupcentre'){
    return Store.data.followups.filter(f=>f.status!=='Done').length;
  }
  if(id==='leads'){
    return Store.data.customers.filter(c=>['New Lead','First Contact','Call Not Taken'].includes(c.status)).length;
  }
  if(id==='payments'){
    return Store.data.payments.filter(p=>p.status==='Pending').length;
  }
  if(id==='gemcrac'){
    return Store.data.gemcrac.filter(g=>g.status==='Needs Update').length;
  }
  if(id==='complaints'){
    return Store.data.complaints.filter(c=>c.status!=='Solved').length;
  }
  if(id==='tasks'){
    return Store.data.tasks.filter(t=>t.status && t.status!=='Completed').length;
  }
  if(id==='inventory'){
    return Store.data.products.filter(p=>!p.stock||Number(p.stock)<=0).length;
  }
  if(id==='bidsearch'){
    return Store.data.bids.filter(b=>{ const d=bidDeadlineInfo(b.endDate).days; return d!==null && d>=0 && d<=1 && !BID_TERMINAL_STATUSES.includes(b.status); }).length;
  }
  return 0;
}

function renderNav(){
  const box = document.getElementById('navList');
  let html = '';
  NAV.forEach(sec=>{
    if(sec.adminOnly && !Auth.isAdmin()) return;
    const visibleItems = sec.items.filter(it=>hasMenuAccess(it.id));
    if(!visibleItems.length) return;
    html += `<div class="nav-section-label">${sec.sec}</div>`;
    visibleItems.forEach(it=>{
      const cnt = navBadgeCount(it.id);
      html += `<div class="nav-item ${UI.currentView===it.id?'active':''}" onclick="go('${it.id}')">
        <span class="ic">${it.ic}</span><span>${it.label}</span>${cnt?`<span class="cnt">${cnt}</span>`:''}
      </div>`;
    });
  });
  box.innerHTML = html;
}
function go(view){
  if(!hasMenuAccess(view)){ UI.toast("You don't have access to this menu"); return; }
  UI.currentView = view;
  document.getElementById('sidebar').classList.remove('open');
  const meta = PAGE_META[view] || [view,''];
  document.getElementById('pageTitle').innerHTML = meta[0];
  document.getElementById('pageSub').innerHTML = meta[1];
  renderNav();
  Router.render(view);
}

/* =====================================================================
   BOTTOM SCROLLBAR (screen-fixed horizontal scrollbar mirroring the
   active data table, so you don't need to scroll to the table's own
   bottom edge to scroll it sideways)
===================================================================== */
const BottomScroll = {
  bar: null, thumb: null, table: null, _syncing: false, _dragging: false, _dragStartX: 0, _dragStartScroll: 0,
  init(){
    this.bar = document.getElementById('bottomScrollbar');
    this.thumb = document.getElementById('bottomScrollbarThumb');

    // Click/tap anywhere on the track (but not on the thumb itself) jumps the thumb there.
    this.bar.addEventListener('pointerdown', (e)=>{
      if(!this.table || e.target === this.thumb) return;
      const barRect = this.bar.getBoundingClientRect();
      const thumbW = this.thumb.offsetWidth;
      const targetLeft = Math.min(Math.max(e.clientX - barRect.left - thumbW/2, 0), barRect.width - thumbW);
      const maxScroll = this.table.scrollWidth - this.table.clientWidth;
      const trackRange = barRect.width - thumbW;
      this.table.scrollLeft = trackRange > 0 ? (targetLeft / trackRange) * maxScroll : 0;
    });

    // Dragging the thumb itself.
    this.thumb.addEventListener('pointerdown', (e)=>{
      if(!this.table) return;
      this._dragging = true;
      this.bar.classList.add('dragging');
      this._dragStartX = e.clientX;
      this._dragStartScroll = this.table.scrollLeft;
      this.thumb.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    this.thumb.addEventListener('pointermove', (e)=>{
      if(!this._dragging || !this.table) return;
      const barRect = this.bar.getBoundingClientRect();
      const thumbW = this.thumb.offsetWidth;
      const trackRange = barRect.width - thumbW;
      const maxScroll = this.table.scrollWidth - this.table.clientWidth;
      const dx = e.clientX - this._dragStartX;
      const scrollDelta = trackRange > 0 ? (dx / trackRange) * maxScroll : 0;
      this.table.scrollLeft = Math.min(Math.max(this._dragStartScroll + scrollDelta, 0), maxScroll);
    });
    const endDrag = (e)=>{
      if(!this._dragging) return;
      this._dragging = false;
      this.bar.classList.remove('dragging');
      try{ this.thumb.releasePointerCapture(e.pointerId); }catch(err){}
    };
    this.thumb.addEventListener('pointerup', endDrag);
    this.thumb.addEventListener('pointercancel', endDrag);

    window.addEventListener('resize', ()=>this.refresh());
    const observer = new MutationObserver(()=>this.refresh());
    observer.observe(document.getElementById('content'), {childList:true, subtree:true});
  },
  refresh(){
    clearTimeout(this._t);
    this._t = setTimeout(()=>this._doRefresh(), 60);
  },
  _doRefresh(){
    if(this.table) this.table.removeEventListener('scroll', this._onTableScroll);
    this.table = null;
    const wraps = document.querySelectorAll('#content .table-wrap');
    let widest = null;
    wraps.forEach(w=>{ if(w.scrollWidth > w.clientWidth + 4){ if(!widest || w.scrollWidth > widest.scrollWidth) widest = w; } });
    if(!widest){ this.bar.style.display='none'; return; }
    this.table = widest;
    this.bar.style.display = 'block';
    this._onTableScroll = ()=>{ this._positionThumb(); };
    this.table.addEventListener('scroll', this._onTableScroll);
    this._positionThumb();
  },
  _positionThumb(){
    if(!this.table) return;
    const barW = this.bar.getBoundingClientRect().width;
    const ratio = this.table.clientWidth / this.table.scrollWidth;
    const thumbW = Math.max(barW * ratio, 40);
    const maxScroll = this.table.scrollWidth - this.table.clientWidth;
    const trackRange = barW - thumbW;
    const left = maxScroll > 0 ? (this.table.scrollLeft / maxScroll) * trackRange : 0;
    this.thumb.style.width = thumbW + 'px';
    this.thumb.style.left = left + 'px';
  }
};

/* =====================================================================
   SMALL CHART HELPERS (pure SVG, no deps)
===================================================================== */
const Chart = {
  colors: ['#EB5A28','#0E9F76','#3B82C4','#E8A33D','#8B5CF6','#14B8A6','#F472B6','#64748B'],
  donut(data, size){
    size = size||150;
    const total = data.reduce((s,d)=>s+d.value,0) || 1;
    const r = size/2 - 14, cx=size/2, cy=size/2, circ = 2*Math.PI*r;
    let offset = 0, segs='';
    data.forEach((d,i)=>{
      const frac = d.value/total;
      const dash = frac*circ;
      segs += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${this.colors[i%this.colors.length]}" stroke-width="18"
        stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
      offset += dash;
    });
    let legend = '<div class="chart-legend">' + data.map((d,i)=>`<div class="li"><span class="sw" style="background:${this.colors[i%this.colors.length]}"></span>${Util.escapeHtml(d.label)} (${d.value})</div>`).join('') + '</div>';
    return `<div style="display:flex;flex-direction:column;align-items:center;">
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#EEF1F5" stroke-width="18"/>
        ${segs}
        <text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="20" font-weight="800" fill="#152234">${total}</text>
        <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="9" fill="#66768C">TOTAL</text>
      </svg>${legend}</div>`;
  },
  bars(data, height){
    height = height||150;
    const max = Math.max(...data.map(d=>d.value), 1);
    const barW = 100/data.length;
    let bars = data.map((d,i)=>{
      const h = (d.value/max)*100;
      return `<div style="display:flex;flex-direction:column;align-items:center;flex:1;min-width:0;">
        <div style="font-size:10.5px;font-weight:700;color:var(--text-mute);margin-bottom:4px;">${d.value}</div>
        <div style="width:60%;height:${Math.max(h,3)}px;background:${this.colors[i%this.colors.length]};border-radius:4px 4px 0 0;"></div>
        <div style="font-size:10px;color:var(--text-mute);margin-top:6px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;">${Util.escapeHtml(d.label)}</div>
      </div>`;
    }).join('');
    return `<div style="display:flex;align-items:flex-end;height:${height}px;gap:8px;padding:0 4px;">${bars}</div>`;
  }
};

function tableFromAgg(map, title, field){
  const rows = Object.keys(map).sort((a,b)=>map[b]-map[a]);
  return `<div class="card">
    <div class="card-head"><h3>${title}</h3><button class="icon-btn" title="Export" onclick="Reports.exportAgg('${field}')">&#128228;</button></div>
    <div class="table-wrap"><table><thead><tr><th>${title.replace('Customers by ','')}</th><th>Count</th></tr></thead><tbody>
    ${rows.length? rows.map(k=>`<tr><td class="cell-main">${Util.escapeHtml(k)}</td><td>${map[k]}</td></tr>`).join('') : `<tr><td colspan="2" class="cell-mute">No data</td></tr>`}
    </tbody></table></div>
  </div>`;
}

const STATUS_COLOR = {
  'New Lead':'blue','First Contact':'violet','WhatsApp Sent':'green','Quotation Sent':'amber',
  'Follow-up Scheduled':'amber','Call Not Taken':'gray','Not Interested':'red',
  'Payment Pending':'red','Payment Received':'green','Converted Customer':'green','Closed Lost':'gray'

function statusBadge(status){
  status = status || 'New Lead';
  const cls = STATUS_COLOR[status] || 'gray';
  return `<span class="badge badge-${cls}"><span class="dot"></span>${Util.escapeHtml(status)}</span>`;
}

  setFilter(mode){ this.filterMode = mode; Paginate.get('customers').page=1; this.render(); },
  downloadSampleTemplate(){
    try{
      const sample = [
        {'Name':'Rajesh Kumar','Phone':'9847012345','Email':'','District':'Malappuram','Area / Panchayath':'Pandikkad Gramapanchayath','Assigned To':'NAJIYA','Status':'New Lead','Notes':''}
      ];
      const ws = XLSX.utils.json_to_sheet(sample);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Customers');
      XLSX.writeFile(wb, 'jays-crm-customers-sample-template.xlsx');
      UI.toast('Sample template downloaded');
    }catch(e){ console.error(e); UI.toast('Could not generate template'); }
  },
  async importExcel(file){
    if(!file) return;
    try{
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws);
      if(!rows.length){ UI.toast('No rows found in file'); return; }
      let count = 0;
      rows.forEach(r=>{
        const name = String(r['Name']||r.Name||r.name||'').trim();
        const phone = String(r['Phone']||r.Phone||r.phone||'').trim();
        if(!name || !phone) return;
        let status = String(r['Status']||r.status||'New Lead').trim();
        if(!DROPDOWNS.status.includes(status)) status = 'New Lead';
        let assignedTo = String(r['Assigned To']||r.AssignedTo||r.assignedTo||'').trim().toUpperCase();
        if(!DROPDOWNS.assignedTo.includes(assignedTo)) assignedTo = '';
        Store.data.customers.unshift({
          id: Util.uid('C', Store.data.customers),
          name, phone,
          email: String(r['Email']||r.email||'').trim(),
          district: String(r['District']||r.district||'').trim(),
          panchayath: String(r['Area / Panchayath']||r['Panchayath']||r.Panchayath||r.panchayath||'').trim(),
          assignedTo,
          status,
          createdDate: Util.todayISO(),
          lastContact: Util.todayISO(),
          notes: String(r['Notes']||r.notes||'').trim(),
          timeline: []
        });
        count++;
      });
      if(!count){ UI.toast('No valid rows found — Name and Phone are required'); return; }
      await Store.save('customers');
      await Activity.log('Excel import', count+' lead(s)/customer(s) imported from '+file.name);
      UI.toast(count+' record(s) imported');
      const inp = document.getElementById('custImportFile'); if(inp) inp.value = '';
      Router.render('customers');
    }catch(e){ console.error(e); UI.toast('Import failed — check the file format'); }
  },
  openForm(id){
    const rec = id ? Store.data.customers.find(x=>x.id===id) : null;
    const v = rec || {name:'',phone:'',email:'',district:'',panchayath:'',assignedTo:'',status:'New Lead', lastContact: Util.todayISO(), notes:''};
    UI.openModal(rec? 'Edit Lead / Customer' : 'Add Lead / Customer', `
      <div class="form-row">

      </div>
      <div class="form-row">

  },
  async save(id){
    const name = document.getElementById('f_name').value.trim();
    const phone = document.getElementById('f_phone').value.trim();
    if(!name || !phone){ UI.toast('Name and phone are required'); return; }
    const prev = id ? Store.data.customers.find(x=>x.id===id) : null;
    const newStatus = document.getElementById('f_status').value;
    const rec = {
      id: id || Util.uid('C', Store.data.customers),
      name, phone,
      email: document.getElementById('f_email').value.trim(),
      district: document.getElementById('f_district').value.trim(),
      panchayath: document.getElementById('f_panchayath').value.trim(),
      assignedTo: document.getElementById('f_assignedTo').value,
      status: newStatus,
      lastContact: document.getElementById('f_lastContact').value,
      notes: document.getElementById('f_notes').value.trim(),
      createdDate: (prev && prev.createdDate) || Util.todayISO(),
      timeline: (prev && prev.timeline) || []
    };
    if(id){
      const idx = Store.data.customers.findIndex(x=>x.id===id);
      Store.data.customers[idx] = rec;
      if(prev && prev.status!==newStatus){
        rec.timeline.push({id:'T'+Date.now(), date:Util.todayISO(), stage:'Status Change', note:prev.status+' &rarr; '+newStatus, by:(Auth.session&&Auth.session.name)||'System'});
      }
    } else {
      rec.timeline.push({id:'T'+Date.now(), date:Util.todayISO(), stage:'First Contact', note:'Lead created', by:(Auth.session&&Auth.session.name)||'System'});
      Store.data.customers.unshift(rec);
    }
    await Store.save('customers');
    await Activity.log(id?'Updated lead/customer':'Added lead/customer', name+' ('+phone+')');
    UI.closeModal();
    UI.toast('Saved');
    Router.render(UI.currentView);
  },
  async remove(id){
    if(!confirm('Delete this record? This cannot be undone.')) return;
    const rec = Store.data.customers.find(x=>x.id===id);
    Store.data.customers = Store.data.customers.filter(x=>x.id!==id);
    await Store.save('customers');
    await Activity.log('Deleted lead/customer', rec?rec.name:id);
    UI.toast('Deleted');
    Router.render(UI.currentView);
  },
  async logTimeline(id, stage, note, opts){
    const x = Store.data.customers.find(c=>c.id===id);
    if(!x) return;
    if(!x.timeline) x.timeline = [];
    x.timeline.push({id:'T'+Date.now(), date:Util.todayISO(), stage, note:note||'', by:(Auth.session&&Auth.session.name)||'System'});
    x.lastContact = Util.todayISO();
    await Store.save('customers');
    if(!(opts&&opts.silent)) UI.toast(stage+' logged');
  },

const Followups = {
  centreTab: 'today',
  render(){
    const today = Util.todayISO();
    const tomorrow = new Date(Date.now()+86400000).toISOString().slice(0,10);
    const list = Store.data.followups.slice();

    const groups = {
      today: list.filter(f=>f.status!=='Done' && f.date===today),
      tomorrow: list.filter(f=>f.status!=='Done' && f.date===tomorrow),
      overdue: list.filter(f=>f.status!=='Done' && f.date && f.date<today),
      upcoming: list.filter(f=>f.status!=='Done' && f.date>tomorrow),
      completed: list.filter(f=>f.status==='Done')
    };
    Object.keys(groups).forEach(k=>groups[k].sort((a,b)=>(a.date||'').localeCompare(b.date||'')));

    const tabDefs = [
      {id:'today', label:"Today's Follow-ups", ic:'&#9728;'},
      {id:'tomorrow', label:'Tomorrow', ic:'&#127749;'},
      {id:'overdue', label:'Overdue', ic:'&#9888;'},
      {id:'upcoming', label:'Upcoming', ic:'&#128197;'},
      {id:'completed', label:'Completed', ic:'&#9989;'}
    ];
    const active = groups[this.centreTab] || [];

    document.getElementById('content').innerHTML = `
      <div class="fu-pill-row">
        ${tabDefs.map(t=>`<div class="fu-pill ${this.centreTab===t.id?'active':''}" onclick="Followups.setCentreTab('${t.id}')">${t.ic} ${t.label} <span class="n">${groups[t.id].length}</span></div>`).join('')}
        <div class="toolbar-spacer"></div>
        <button class="btn btn-primary btn-sm" onclick="Followups.openForm(null,null)">&#65291; Schedule Follow-up</button>
      </div>

      <div id="fuList">
        ${active.length ? active.map(f=>this.cardHtml(f, today)).join('') : `<div class="empty-state"><div class="ic">&#9200;</div><div class="t">Nothing here</div><div class="d">No follow-ups in this list right now.</div></div>`}
      </div>
    `;
  },
  cardHtml(f, today){
    const overdue = f.status!=='Done' && f.date && f.date<today;
    const isToday = f.date===today;
    const cls = f.status==='Done' ? 'done' : (overdue?'overdue':(isToday?'today':''));
    const cust = Store.data.customers.find(c=>c.id===f.customerId);
    const email = cust ? cust.email : '';
    return `<div class="fu-card ${cls}">
      <div class="info">
        <div class="nm">${Util.escapeHtml(f.customerName)} ${overdue?'<span class="badge badge-red" style="margin-left:6px;">Overdue</span>':''}${isToday&&f.status!=='Done'?'<span class="badge badge-amber" style="margin-left:6px;">Today</span>':''}${f.status==='Done'?'<span class="badge badge-green" style="margin-left:6px;">Done</span>':''}</div>
        <div class="pp">${Util.escapeHtml(f.purpose||'Follow-up call')}</div>
        <div class="dt">&#128197; ${Util.fmtDate(f.date)} &middot; <span class="mono">${Util.escapeHtml(f.phone||'')}</span></div>
      </div>
      <div class="fu-actions">
        <a class="call" title="Call" href="tel:${Util.escapeHtml(f.phone||'')}">&#128222;</a>
        <button class="wa" title="WhatsApp" onclick="Followups.quickWhatsApp('${f.id}')">&#128172;</button>
        <a class="em" title="Email" href="${Util.mailLink(email,'Follow-up from Jays Trading','Hi '+f.customerName+', following up regarding: '+(f.purpose||''))}">&#9993;</a>
        ${f.status!=='Done' ? `<button class="done-btn" title="Mark done" onclick="Followups.markDone('${f.id}')">&#10003;</button>` : ''}
        <button title="Edit" onclick="Followups.openForm('${f.id}',null)">&#9998;</button>
        <button title="Delete" onclick="Followups.remove('${f.id}')">&#128465;</button>
      </div>
    </div>`;
  },
  setCentreTab(t){ this.centreTab = t; this.render(); },
  async quickWhatsApp(id){
    const f = Store.data.followups.find(x=>x.id===id);
    if(!f) return;
    window.open(Util.waLink(f.phone, 'Hi '+f.customerName+', this is Jays Trading and Business Solution, following up regarding: '+(f.purpose||'your enquiry')+'.'), '_blank');
    if(f.customerId) await Customers.logTimeline(f.customerId, 'Follow-up', 'WhatsApp follow-up sent: '+(f.purpose||''), {silent:true});
  },
  async markDone(id){
    const f = Store.data.followups.find(x=>x.id===id);
    if(!f) return;
    f.status='Done';
    await Store.save('followups');
    if(f.customerId) await Customers.logTimeline(f.customerId, 'Follow-up', 'Follow-up completed: '+(f.purpose||''), {silent:true});
    await Activity.log('Follow-up completed', f.customerName);
    UI.toast('Marked as done');
    Router.render(UI.currentView);
  },
  openForm(id, customerId){
    const rec = id ? Store.data.followups.find(x=>x.id===id) : null;
    const cust = customerId ? Store.data.customers.find(c=>c.id===customerId) : (rec&&rec.customerId? Store.data.customers.find(c=>c.id===rec.customerId): null);
    const v = rec || {customerId:customerId||'', customerName:cust?cust.name:'', phone:cust?cust.phone:'', date:Util.todayISO(), purpose:'', status:'Pending', notes:''};
    const custOptions = Store.data.customers.map(c=>`<option value="${c.id}" ${c.id===v.customerId?'selected':''}>${Util.escapeHtml(c.name)} — ${Util.escapeHtml(c.phone)}</option>`).join('');
    UI.openModal(rec?'Edit Follow-up':'Schedule Follow-up', `
      <div class="field"><label>Customer *</label><select id="f_cust" onchange="Followups.autofill()"><option value="">Select customer...</option>${custOptions}</select></div>
      <div class="form-row">
        <div class="field"><label>Date *</label><input type="date" id="f_date" value="${v.date}"></div>
        <div class="field"><label>Status</label><select id="f_status"><option ${v.status==='Pending'?'selected':''}>Pending</option><option ${v.status==='Done'?'selected':''}>Done</option></select></div>
      </div>
      <div class="field"><label>Purpose</label><input id="f_purpose" placeholder="e.g. Price discussion, demo, payment reminder" value="${Util.escapeHtml(v.purpose)}"></div>
      <div class="field"><label>Notes</label><textarea id="f_notes">${Util.escapeHtml(v.notes)}</textarea></div>
    `, `
      <button class="btn btn-outline" onclick="UI.closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="Followups.save('${id||''}')">Save</button>
    `);
    setTimeout(()=>{ const sel=document.getElementById('f_cust'); if(sel) sel.value = v.customerId||''; }, 0);
  },
  autofill(){
    const id = document.getElementById('f_cust').value;
    const c = Store.data.customers.find(x=>x.id===id);
  },
  async save(id){
    const custId = document.getElementById('f_cust').value;
    const cust = Store.data.customers.find(c=>c.id===custId);
    if(!cust){ UI.toast('Please select a customer'); return; }
    const date = document.getElementById('f_date').value;
    if(!date){ UI.toast('Date is required'); return; }
    const wasPending = id ? (Store.data.followups.find(x=>x.id===id)||{}).status!=='Done' : true;
    const rec = {
      id: id || Util.uid('F', Store.data.followups),
      customerId: cust.id, customerName: cust.name, phone: cust.phone,
      date, purpose: document.getElementById('f_purpose').value.trim(),
      status: document.getElementById('f_status').value,
      notes: document.getElementById('f_notes').value.trim()
    };
    if(id){ const idx = Store.data.followups.findIndex(x=>x.id===id); Store.data.followups[idx]=rec; }
    else Store.data.followups.unshift(rec);
    await Store.save('followups');
    await Customers.logTimeline(cust.id, 'Follow-up', 'Scheduled for '+Util.fmtDate(date).replace(/<[^>]+>/g,'')+(rec.purpose?': '+rec.purpose:''), {silent:true});
    await Activity.log(id?'Updated follow-up':'Scheduled follow-up', cust.name+' on '+date);
    UI.closeModal(); UI.toast('Saved');
    Router.render(UI.currentView);
  },
  async remove(id){
    if(!confirm('Delete this follow-up?')) return;
    Store.data.followups = Store.data.followups.filter(x=>x.id!==id);
    await Store.save('followups');
    UI.toast('Deleted');
    Router.render(UI.currentView);
  }
};

          ${Object.keys(catCounts).sort().map(c=>`<option value="${c}" ${c===cat?'selected':''}>${c} (${catCounts[c]})</option>`).join('')}
        </select>
        <div class="toolbar-spacer"></div>
        <button class="btn btn-outline btn-sm" onclick="go('backup')">&#128228; Import Excel</button>
        <button class="btn btn-primary btn-sm" onclick="Products.openForm(null)">&#65291; Add Product</button>
      </div>
      <div class="card"><div class="table-wrap">
      ${list.length ? `<table><thead><tr><th class="col-actions">Actions</th><th>Code</th><th>Category</th><th>Product Name</th><th>Unit</th><th>Price</th><th>Stock</th></tr></thead><tbody>
        ${Paginate.slice('products', list).pageItems.map(p=>`<tr>
          <td class="col-actions"><div class="row-action-btns">
            <button class="icon-btn" title="Edit" onclick="Products.openForm('${p.id}')">&#9998;</button>
            <button class="icon-btn" title="Delete" onclick="Products.remove('${p.id}')">&#128465;</button>
          </div></td>
          <td class="mono cell-mute">${String(p.code).padStart(2,'0')}</td>
          <td><span class="badge badge-blue">${Util.escapeHtml(p.category)}</span></td>
          <td class="cell-main">${Util.escapeHtml(p.name)}</td>
          <td class="cell-mute">${Util.escapeHtml(p.unit)}</td>
          <td>${p.price? Util.fmtMoney(p.price) : '<span class="cell-mute">—</span>'}</td>
          <td class="cell-mute">${p.stock||0}</td>
        </tr>`).join('')}
        </tbody></table>
        ${Paginate.controlsHTML('products', Paginate.slice('products', list), "Products.render()")}` : `<div class="empty-state"><div class="ic">&#128230;</div><div class="t">No products found</div><div class="d">Try clearing filters, or add a new product.</div></div>`}
      </div></div>
    `;
  },
  openForm(id){
    const rec = id ? Store.data.products.find(p=>p.id===id) : null;
    const v = rec || {code: Store.data.products.length+1, category:'', name:'', unit:'Nos', price:0, stock:0, description:''};
    UI.openModal(rec?'Edit Product':'Add Product', `
      <div class="form-row">
        <div class="field"><label>Product Code</label><input id="f_code" type="number" value="${v.code}"></div>
        <div class="field"><label>Category *</label><input id="f_category" list="dl_cat" value="${Util.escapeHtml(v.category)}"></div>
      </div>
      <div class="field"><label>Product Name *</label><input id="f_name" value="${Util.escapeHtml(v.name)}"></div>
      <div class="form-row">
        <div class="field"><label>Unit</label><input id="f_unit" value="${Util.escapeHtml(v.unit)}" placeholder="Nos, Set, Pair..."></div>
        <div class="field"><label>Price (&#8377;)</label><input id="f_price" type="number" value="${v.price}"></div>
      </div>
      <div class="field"><label>Stock Quantity</label><input id="f_stock" type="number" value="${v.stock}"></div>
      <div class="field"><label>Description</label><textarea id="f_description">${Util.escapeHtml(v.description)}</textarea></div>
      <datalist id="dl_cat">${DROPDOWNS.productCategories.map(c=>`<option value="${c}">`).join('')}</datalist>
    `, `
      <button class="btn btn-outline" onclick="UI.closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="Products.save('${id||''}')">Save</button>
    `);
  },
  async save(id){
    const name = document.getElementById('f_name').value.trim();
    const category = document.getElementById('f_category').value.trim();
    if(!name || !category){ UI.toast('Category and Product Name are required'); return; }
    const rec = {
      id: id || Util.uid('P', Store.data.products),
      code: Number(document.getElementById('f_code').value)||0,
      category, name,
      unit: document.getElementById('f_unit').value.trim()||'Nos',
      price: Number(document.getElementById('f_price').value)||0,
      stock: Number(document.getElementById('f_stock').value)||0,
      description: document.getElementById('f_description').value.trim()
    };
    if(id){ const idx = Store.data.products.findIndex(p=>p.id===id); Store.data.products[idx]=rec; }
    else Store.data.products.unshift(rec);
    await Store.save('products');
    await Activity.log(id?'Updated product':'Added product', name);
    UI.closeModal(); UI.toast('Saved');
    Router.render(UI.currentView);
  },
  async remove(id){
    if(!confirm('Delete this product?')) return;
    Store.data.products = Store.data.products.filter(p=>p.id!==id);
    await Store.save('products');
    UI.toast('Deleted');
    Router.render(UI.currentView);
  }
};

const Quotations = {
  draftItems: [],
  render(){
    const list = Store.data.quotations.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    const s = {total:list.length, draft:0, sent:0, accepted:0, rejected:0};
    list.forEach(q=>{ if(q.status==='Draft')s.draft++; else if(q.status==='Sent')s.sent++; else if(q.status==='Accepted')s.accepted++; else if(q.status==='Rejected')s.rejected++; });
    document.getElementById('content').innerHTML = `
      ${dashboardCardsHTML('Quotations Dashboard', [
        {label:'Total Quotations', value:s.total},
        {label:'Draft', value:s.draft, color:'var(--text-mute,#6b7280)'},
        {label:'Sent', value:s.sent, color:'var(--amber,#d97706)'},
        {label:'Accepted', value:s.accepted, color:'var(--green,#16a34a)'},
        {label:'Rejected', value:s.rejected, color:'var(--red,#dc2626)'}
      ])}
      <div class="toolbar"><div class="toolbar-spacer"></div>
        <button class="btn btn-primary btn-sm" onclick="Quotations.openForm(null)">&#65291; New Quotation</button>
      </div>
      <div class="card"><div class="table-wrap">
      ${list.length ? `<table><thead><tr><th class="col-actions">Actions</th><th>Quote #</th><th>Date</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead><tbody>
        ${Paginate.slice('quotations', list).pageItems.map(q=>`<tr>
          <td class="col-actions"><div class="row-action-btns">
            <button class="icon-btn" title="Print" onclick="Quotations.print('${q.id}')">&#128424;</button>
            <a class="icon-btn" style="color:#25D366;text-decoration:none;" title="WhatsApp" href="${Util.waLink(q.phone, Quotations.waSummary(q))}" target="_blank">&#128172;</a>
            <button class="icon-btn" onclick="Quotations.openForm('${q.id}')">&#9998;</button>
            <button class="icon-btn" onclick="Quotations.remove('${q.id}')">&#128465;</button>
          </div></td>
          <td class="mono cell-main">${q.id}</td>
          <td class="cell-mute">${Util.fmtDate(q.date)}</td>
          <td class="cell-main" onclick="Customers.openDetail('${q.customerId}')">${Util.escapeHtml(q.customerName)}</td>
          <td class="mono">${Util.fmtMoney(q.total)}</td>
          <td>${statusBadge(q.status)}</td>
        </tr>`).join('')}
      </tbody></table>
      ${Paginate.controlsHTML('quotations', Paginate.slice('quotations', list), "Quotations.render()")}` : `<div class="empty-state"><div class="ic">&#128196;</div><div class="t">No quotations yet</div><div class="d">Create a quotation for a customer, print it, or send it straight to WhatsApp.</div>
      <button class="btn btn-primary btn-sm" onclick="Quotations.openForm(null)">&#65291; New Quotation</button></div>`}
      </div></div>
    `;
  },
  waSummary(q){
    let lines = [`Quotation ${q.id} from Jays Trading and Business Solution`, `Date: ${q.date}`, ''];
    q.items.forEach(it=> lines.push(`${it.name} x${it.qty} = ${Util.fmtMoney(it.qty*it.rate).replace('&#8377;','Rs.')}`));
    lines.push('', `Total: ${Util.fmtMoney(q.total).replace('&#8377;','Rs.')}`);
    return lines.join('\n');
  },
  openForm(id, presetCustomerId){
    const rec = id ? Store.data.quotations.find(x=>x.id===id) : null;
    this.draftItems = rec ? JSON.parse(JSON.stringify(rec.items)) : [{name:'',qty:1,rate:0}];
    const custOptions = Store.data.customers.map(c=>`<option value="${c.id}" ${(rec&&rec.customerId===c.id)||(!rec&&presetCustomerId===c.id)?'selected':''}>${Util.escapeHtml(c.name)} — ${Util.escapeHtml(c.phone)}</option>`).join('');
    const gst = rec ? rec.gst : (Store.data.settings.gstPercent||0);
    UI.openModal(rec?'Edit Quotation':'New Quotation', `
      <div class="form-row">
        <div class="field"><label>Customer *</label><select id="q_cust"><option value="">Select customer...</option>${custOptions}</select></div>
        <div class="field"><label>Date</label><input type="date" id="q_date" value="${rec?rec.date:Util.todayISO()}"></div>
      </div>
      <div class="field"><label>Status</label><select id="q_status">${['Draft','Sent','Accepted','Rejected'].map(s=>`<option ${rec&&rec.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
      <h4 style="font-size:12px;text-transform:uppercase;color:var(--text-mute);margin:16px 0 8px;">Line Items</h4>
      <datalist id="dl_products">${Store.data.products.map(p=>`<option value="${Util.escapeHtml(p.name)}">`).join('')}</datalist>
      <div id="q_items"></div>
      <button class="btn btn-outline btn-sm" onclick="Quotations.addLine()">&#65291; Add Line</button>
      <div class="form-row" style="margin-top:16px;">
        <div class="field"><label>GST / Tax %</label><input type="number" id="q_gst" value="${gst}"></div>
        <div class="field"><label>Total (auto)</label><input id="q_totalDisplay" disabled></div>
      </div>
    `, `
      <button class="btn btn-outline" onclick="UI.closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="Quotations.save('${id||''}')">Save Quotation</button>
    `, true);
    this.renderLines();
    document.getElementById('q_gst').addEventListener('input', ()=>Quotations.renderLines());
  },
  addLine(){ this.draftItems.push({name:'',qty:1,rate:0}); this.renderLines(); },
  removeLine(i){ this.draftItems.splice(i,1); this.renderLines(); },
  updateLine(i, field, val){
    if(field==='name'){
      const prod = Store.data.products.find(p=>p.name===val);
      if(prod && prod.price) this.draftItems[i].rate = prod.price;
    }
    this.draftItems[i][field] = (field==='qty'||field==='rate') ? Number(val)||0 : val;
    this.renderLines(true);
  },
  renderLines(skipInputs){
    const box = document.getElementById('q_items');
    if(!box) return;
    box.innerHTML = this.draftItems.map((it,i)=>`
      <div class="quo-line">
        <input list="dl_products" placeholder="Item / product name" value="${Util.escapeHtml(it.name)}" onchange="Quotations.updateLine(${i},'name',this.value)">
        <input type="number" placeholder="Qty" value="${it.qty}" onchange="Quotations.updateLine(${i},'qty',this.value)">
        <input type="number" placeholder="Rate" value="${it.rate}" onchange="Quotations.updateLine(${i},'rate',this.value)">
        <div class="mono cell-mute" style="text-align:right;padding-right:4px;">${Util.fmtMoney(it.qty*it.rate)}</div>
        <button class="icon-btn" onclick="Quotations.removeLine(${i})">&times;</button>
      </div>
    `).join('');
    const subtotal = this.draftItems.reduce((s,it)=>s+(it.qty*it.rate),0);
    const gst = Number(document.getElementById('q_gst')?.value||0);
    const total = subtotal * (1+gst/100);
    const disp = document.getElementById('q_totalDisplay');
    if(disp) disp.value = 'Rs. ' + total.toLocaleString('en-IN',{maximumFractionDigits:0}) + (gst? ` (incl. ${gst}% tax)` : '');
  },
  async save(id){
    const custId = document.getElementById('q_cust').value;
    const cust = Store.data.customers.find(c=>c.id===custId);
    if(!cust){ UI.toast('Please select a customer'); return; }
    const items = this.draftItems.filter(it=>it.name.trim());
    if(!items.length){ UI.toast('Add at least one line item'); return; }
    const gst = Number(document.getElementById('q_gst').value||0);
    const subtotal = items.reduce((s,it)=>s+(it.qty*it.rate),0);
    const total = subtotal*(1+gst/100);
    const rec = {
      id: id || (Store.data.settings.quoPrefix||'Q-') + String(Store.data.settings.quoNext||1).padStart(4,'0'),
      customerId: custId, customerName: cust.name, phone: cust.phone,
      date: document.getElementById('q_date').value,
      status: document.getElementById('q_status').value,
      items, gst, subtotal, total
    };
    if(id){ const i=Store.data.quotations.findIndex(x=>x.id===id); Store.data.quotations[i]=rec; }
    else { Store.data.quotations.unshift(rec); Store.data.settings.quoNext = (Store.data.settings.quoNext||1)+1; await Store.save('settings'); }
    await Store.save('quotations');
    await Customers.logTimeline(custId, 'Quotation Sent', rec.id+' — '+Util.fmtMoney(total).replace('&#8377;','Rs.'), {silent:true});
    await Activity.log(id?'Updated quotation':'Created quotation', rec.id+' for '+cust.name);
    UI.closeModal(); UI.toast('Quotation saved'); Router.render('quotations');
  },
  async remove(id){
    if(!confirm('Delete this quotation?')) return;
    Store.data.quotations = Store.data.quotations.filter(x=>x.id!==id);
    await Store.save('quotations'); UI.toast('Deleted'); Router.render('quotations');
  },

/* =====================================================================
   PAYMENT PENDING FOLLOWUP
===================================================================== */
/* Called by CustPicker when a customer is selected in the Payments form.
   Fills only the Contact Name / Phone fields — the Party Name field
   (which may be an office/institution, not the contact's own name) is
   left exactly as typed or imported. */
function paymentsCustSelected(c){
  const contactEl = document.getElementById('p_contact');
  const phoneEl = document.getElementById('p_phone');
  if(contactEl) contactEl.value = c ? c.name : '';
  if(phoneEl) phoneEl.value = c ? c.phone : '';
}
const Payments = {
  render(){
    const searchEl = document.getElementById('paySearch');
    const searchHadFocus = document.activeElement === searchEl;
    const caretPos = searchHadFocus ? searchEl.selectionStart : null;

    const q = (document.getElementById('paySearch')?document.getElementById('paySearch').value:'').toLowerCase();
    const fStatus = document.getElementById('payStatusFilter')?document.getElementById('payStatusFilter').value:'';
    const fCompany = document.getElementById('payCompanyFilter')?document.getElementById('payCompanyFilter').value:'';
    const fParty = document.getElementById('payPartyFilter')?document.getElementById('payPartyFilter').value:'';
    const fOverdue = document.getElementById('payOverdueFilter')?document.getElementById('payOverdueFilter').checked:false;

    let list = Store.data.payments.slice().sort((a,b)=>(a.followupDate||'').localeCompare(b.followupDate||''));

    if(q) list = list.filter(p=>(p.party||'').toLowerCase().includes(q) || (p.invoiceNumber||'').toLowerCase().includes(q) || (p.id||'').toLowerCase().includes(q) || (p.contact||'').toLowerCase().includes(q) || (p.phone||'').includes(q));
    if(fStatus) list = list.filter(p=>p.status===fStatus);
    if(fCompany) list = list.filter(p=>p.companyName===fCompany);
    if(fParty) list = list.filter(p=>p.party===fParty);
    if(fOverdue) list = list.filter(p=>p.status!=='Paid' && p.followupDate && p.followupDate < Util.todayISO());

    const partyNames = [...new Set(Store.data.payments.map(p=>p.party).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
    const partyPendingTotal = fParty ? list.reduce((s,p)=>s+Math.max((Number(p.amount)||0)-(Number(p.amountPaid)||0),0),0) : null;

    const totalPending = list.reduce((s,p)=>s+Math.max((Number(p.amount)||0)-(Number(p.amountPaid)||0),0),0);
    const totalPaid = list.reduce((s,p)=>s+(Number(p.amountPaid)||0),0);
    document.getElementById('content').innerHTML = `
      <div class="toolbar">
        <span class="badge badge-amber" style="font-size:12px;padding:6px 12px;">Bill Pending: ${Util.fmtMoney(totalPending)}</span>
        <span class="badge badge-green" style="font-size:12px;padding:6px 12px;">Amount Paid: ${Util.fmtMoney(totalPaid)}</span>
        <div class="toolbar-spacer"></div>
        <input type="file" id="payImportFile" accept=".xlsx,.xls,.csv" style="display:none;" onchange="Payments.importExcel(this.files[0])">
        <button class="btn btn-outline btn-sm" onclick="Payments.downloadSampleTemplate()">&#128190; Sample Template</button>
        <button class="btn btn-outline btn-sm" onclick="document.getElementById('payImportFile').click()">&#128229; Import from Excel</button>
        <button class="btn btn-outline btn-sm" style="color:var(--red);" onclick="Payments.deleteAll()">&#128465; Delete All</button>
        <button class="btn btn-primary btn-sm" onclick="Payments.openForm(null)">&#65291; Add Invoice</button>
      </div>
      <div class="toolbar">
        <div class="search"><span class="ic">&#128269;</span><input id="paySearch" placeholder="Search party, invoice #, contact, phone..." oninput="Payments.render()" value="${Util.escapeHtml(q)}"></div>
        <select id="payStatusFilter" onchange="Payments.render()">
          <option value="">All Statuses</option>
          <option value="Pending" ${fStatus==='Pending'?'selected':''}>Unpaid</option>
          <option value="Paid" ${fStatus==='Paid'?'selected':''}>Paid</option>
        </select>
        <select id="payCompanyFilter" onchange="Payments.render()">
          <option value="">All Companies</option>
          ${DROPDOWNS.companyName.map(c=>`<option value="${c}" ${c===fCompany?'selected':''}>${c}</option>`).join('')}
        </select>
        <select id="payPartyFilter" onchange="Payments.render()">
          <option value="">All Parties</option>
          ${partyNames.map(p=>`<option value="${Util.escapeHtml(p)}" ${p===fParty?'selected':''}>${Util.escapeHtml(p)}</option>`).join('')}
        </select>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-mute);white-space:nowrap;">
          <input type="checkbox" id="payOverdueFilter" onchange="Payments.render()" ${fOverdue?'checked':''}> Overdue only
        </label>
        ${fParty ? `<span class="badge badge-amber" style="font-size:12px;padding:6px 12px;">${Util.escapeHtml(fParty)} pending: ${Util.fmtMoney(partyPendingTotal)}</span>` : ''}
        ${(q||fStatus||fCompany||fParty||fOverdue) ? `<button class="btn btn-outline btn-sm" onclick="Payments.clearFilters()">Clear</button>` : ''}
      </div>
      <div class="card"><div class="table-wrap">
      ${list.length ? `<table><thead><tr><th class="col-actions">Actions</th><th>Party Name</th><th>Company Name</th><th>Product</th><th>Invoice Number</th><th>Invoice Date</th><th>Invoice Amount</th><th>Due Amount</th><th>Payment Status</th><th>Contact Name</th><th>Area / Panchayath</th><th>Phone</th><th>Follow-up Date</th><th>Response</th></tr></thead><tbody>
        ${Paginate.slice('payments', list).pageItems.map(p=>{
          const overdue = p.status!=='Paid' && p.followupDate && p.followupDate < Util.todayISO();
          const paidAmt = Number(p.amountPaid)||0;
          const pendingAmt = p.dueAmount!==undefined ? Math.max(Number(p.dueAmount)||0,0) : Math.max((Number(p.amount)||0)-paidAmt,0);
          return `<tr>
          <td class="col-actions"><div class="row-action-btns">
            <a class="icon-btn" style="color:#25D366;text-decoration:none;" title="WhatsApp reminder" href="${Util.waLink(p.phone,'Hi '+p.contact+', this is a reminder that invoice '+(p.invoiceNumber||p.id)+' for '+Util.fmtMoney(pendingAmt).replace('&#8377;','Rs.')+' is pending. Kindly clear at the earliest. - Jays Trading and Business Solution')}" target="_blank">&#128172;</a>
            <button class="icon-btn" onclick="Payments.markPaid('${p.id}')" title="Mark paid">&#10003;</button>
            <button class="icon-btn" onclick="Payments.openForm('${p.id}')">&#9998;</button>
            <button class="icon-btn" onclick="Payments.remove('${p.id}')">&#128465;</button>
          </div></td>
          <td class="cell-main" style="cursor:pointer;" onclick="Payments.filterByParty('${Util.escapeHtml(p.party).replace(/'/g,"\\'")}')" title="View all pending for this party">${Util.escapeHtml(p.party)}</td>
          <td>${p.companyName? `<span class="badge badge-blue">${Util.escapeHtml(p.companyName)}</span>` : '—'}</td>
          <td class="cell-mute">${Util.escapeHtml(p.product||'—')}</td>
          <td class="mono cell-mute">${Util.escapeHtml(p.invoiceNumber||p.id)}</td>
          <td class="cell-mute">${Util.fmtDate(p.invoiceDate)}</td>
          <td class="mono">${Util.fmtMoney(p.amount)}</td>
          <td class="mono" style="color:${pendingAmt>0?'var(--red)':'var(--text-mute)'};">${Util.fmtMoney(pendingAmt)}</td>
          <td>${statusBadge(p.status)}</td>
          <td class="cell-mute">${Util.escapeHtml(p.contact||'—')}</td>
          <td class="cell-mute">${custArea(p.customerId)}</td>
          <td class="mono cell-mute">${Util.escapeHtml(p.phone||'')}</td>
          <td>${overdue?'<span class="badge badge-red">Overdue</span> ':''}${Util.fmtDate(p.followupDate)}</td>
          <td class="cell-mute">${Util.escapeHtml(p.response||'—')}</td>
        </tr>`;}).join('')}
      </tbody></table>
      ${Paginate.controlsHTML('payments', Paginate.slice('payments', list), "Payments.render()")}` : `<div class="empty-state"><div class="ic">&#128179;</div><div class="t">${(q||fStatus||fCompany||fParty||fOverdue)?'No matching invoices':'No pending payments'}</div><div class="d">${(q||fStatus||fCompany||fParty||fOverdue)?'Try clearing filters or adjusting your search.':'Log an invoice to start tracking payment follow-ups, or import a batch from Excel.'}</div>
      <button class="btn btn-primary btn-sm" onclick="Payments.openForm(null)">&#65291; Add Invoice</button></div>`}
      </div></div>
    `;
    if(searchHadFocus){
      const el = document.getElementById('paySearch');
      if(el){ el.focus(); el.setSelectionRange(caretPos, caretPos); }
    }
  },
  filterByParty(party){
    const sel = document.getElementById('payPartyFilter');
    const stat = document.getElementById('payStatusFilter');
    if(sel) sel.value = party;
    if(stat) stat.value = 'Pending';
    this.render();
  },
  clearFilters(){
    ['paySearch'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
    const st=document.getElementById('payStatusFilter'); if(st) st.value='';
    const co=document.getElementById('payCompanyFilter'); if(co) co.value='';
    const pt=document.getElementById('payPartyFilter'); if(pt) pt.value='';
    const ov=document.getElementById('payOverdueFilter'); if(ov) ov.checked=false;
    this.render();
  },
  openForm(id, presetCustomerId){
    const rec = id ? Store.data.payments.find(x=>x.id===id) : null;

  updatePendingPreview(){
