function oppNorm(v){ return String(v==null?'':v).toLowerCase().replace(/\s+/g,' ').trim(); }
function oppMoney(v){ const n = Number(String(v==null?'':v).replace(/[,\u20B9\s]/g,'')); return isNaN(n)?0:n; }
/* Finds a value on a row by trying several likely header names, first
   as an exact match, then case/punctuation-insensitively against the
   row's ACTUAL column names. Real-world exports rarely use our exact
   expected headers (e.g. a file might say "Project ID" or "Local Body
   Name" instead of "Project No"/"LB Name") - without this, every row
   in such a file would read as blank on both fields. */
function oppFindField(r, patterns){
  for(const pat of patterns){
    if(r[pat] !== undefined && String(r[pat]).trim()) return String(r[pat]).trim();
  }
  const normPatterns = patterns.map(p=>p.toLowerCase().replace(/[^a-z0-9]/g,''));
  for(const k of Object.keys(r)){
    const nk = k.toLowerCase().replace(/[^a-z0-9]/g,'');
    if(normPatterns.some(np=>nk===np || nk.includes(np)) && String(r[k]).trim()) return String(r[k]).trim();
  }
  return '';
}
const OPP_PROJECT_NO_ALIASES = ['Project No','Project No.','ProjectNo','Project ID','ProjectID','Sl No','SlNo','S.No','Sl.No','Serial No','Scheme No','Scheme ID'];
const OPP_LB_NAME_ALIASES = ['LB Name','LB','Local Body','Local Body Name','LocalBody','Panchayat','Panchayath','Panchayat Name','Municipality','Grama Panchayat','Local Self Government'];
/* Writes the detected identifying fields back onto the row under our
   canonical keys ('Project No', 'LB Name') so every other part of the
   UI - table columns, filters, CSV export, scoring - keeps working
   unchanged regardless of what the source file actually called them. */
function oppNormalizeRow(r){
  const out = Object.assign({}, r);
  if(!String(out['Project No']||'').trim()){
    const v = oppFindField(r, OPP_PROJECT_NO_ALIASES);
    if(v) out['Project No'] = v;
  }
  if(!String(out['LB Name']||'').trim()){
    const v = oppFindField(r, OPP_LB_NAME_ALIASES);
    if(v) out['LB Name'] = v;
  }
  return out;
}
/* CRITICAL: this key must never collapse many distinct rows onto one
   value, or an import silently merges/overwrites thousands of records
   into a single one (exactly the failure this fallback chain exists to
   prevent). Falls back through Project No/LB Name -> project name +
   district + fund value -> a hash of the whole row, so two genuinely
   different rows are never treated as the same record just because
   their identifying columns happen to both be blank. */
function oppKeyOf(r){
  const projectNo = String(r['Project No']||'').trim();
  const lbName = String(r['LB Name']||'').trim();
  if(projectNo || lbName) return oppNorm(projectNo+'|'+lbName);
  const name = String(r['Project Name Eng']||r['Project Name Mal']||'').trim();
  const district = String(r['District']||'').trim();
  const fund = String(r['FundTotal']||'').trim();
  if(name) return oppNorm(name+'|'+district+'|'+fund);
  return oppNorm(JSON.stringify(r)).slice(0,120);
}
/* Smart Opportunity Score 2.0 - a weighted blend instead of raw keyword
   counting, so the number actually reflects how promising a project is,
   not just how many trigger words happen to appear in its text:
     Product/keyword match   30%   Sector                15%
     Sub-sector              10%   Procurement wording    10%
     District preference      5%   Estimated fund value   10%
     Deadline proximity      10%   Historical relevance   10%
   Computed at import time (same as before) and re-runnable on demand
   via "Recalculate All Scores" in the Import tab, since two factors
   (district preference, historical relevance) depend on state that
   can change after a row was first imported. */
/* Fields never included in the matching text - metadata, computed
   scoring results, and any raw/original-row JSON blob some sources
   attach (e.g. a "raw_data" column holding the full row as a string).
   Without this exclusion, a blob field's own JSON KEY NAMES (not their
   values) can accidentally match a keyword - e.g. a tree-plantation
   project got classified as Disaster Management purely because a blank
   "Disaster Management" key existed inside its raw_data dump. */
const OPP_NON_CONTENT_FIELDS = new Set(['id','score','type','hits','scoreBreakdown','opportunity_score','opportunity_type',
  'matched_keywords','raw_data','updated_at','created_at','source_status']);
function oppClassify(r){
  const text = Object.entries(r).filter(([k])=>!OPP_NON_CONTENT_FIELDS.has(k)).map(([,v])=>oppNorm(v)).join(' ');
  const groups = (Store.data.oppKeywordGroups && Store.data.oppKeywordGroups.length) ? Store.data.oppKeywordGroups : OPP_DEFAULT_KEYWORD_GROUPS;

  const matched = [];               // [{word, weight, tier, category}]
  const categoryWeights = {};       // category -> summed weight, to pick the dominant type
  groups.forEach(g=>{
    (g.words||[]).forEach(w=>{
      const wn = oppNorm(w);
      if(wn && text.includes(wn)){
        matched.push({word:w, weight:g.weight, tier:g.tier, category:g.category});
        categoryWeights[g.category] = (categoryWeights[g.category]||0) + g.weight;
      }
    });
  });
  // Your own added keywords (Products tab) count too, at Product-Synonym weight.
  (Store.data.oppProducts||[]).forEach(p=>{
    String(p.keywords||'').split(',').forEach(k=>{
      const wn = oppNorm(k);
      if(wn && text.includes(wn)){
        matched.push({word:k.trim(), weight:18, tier:'Your Product Keywords', category:'PRODUCT'});
        categoryWeights.PRODUCT = (categoryWeights.PRODUCT||0) + 18;
      }
    });
  });

  // CRITICAL: if nothing actually matched, the project has no demonstrated
  // relevance at all - fund value, a near deadline or "has a district" are
  // NOT substitutes for that, so none of them get to contribute. This is
  // what stops an unrelated project (e.g. road construction) from scoring
  // well just because it's large and closing soon.
  if(!matched.length){
    return { score:0, type:'OTHER', hits:[],
      scoreBreakdown:{product:0, sector:0, subSector:0, procurement:0, location:0, fund:0, deadline:0, history:0} };
  }

  const dominant = Object.entries(categoryWeights).sort((a,b)=>b[1]-a[1])[0];
  const type = (dominant && dominant[0]!=='PRODUCT') ? dominant[0] : (dominant ? 'EQUIPMENT' : 'OTHER');
  const isWasteText = t => t.includes('waste') || t.includes('\u0d2e\u0d3e\u0d32\u0d3f\u0d28\u0d4d\u0d2f');

  // 1) Product / keyword match - 30% cap. Summed matched weight, so one
  //    exact-product hit (25) plus a supporting word (10) clearly outweighs
  //    five generic "equipment"/"supply" mentions (10 each capped low).
  const rawWeightSum = matched.reduce((s,m)=>s+m.weight,0);
  const productScore = Math.min(30, rawWeightSum * 0.5);

  // 2) Sector - 15% (only credited when it's actually a waste-type sector; no more "any text present" credit)
  const sector = oppNorm(r['Sector']);
  const sectorScore = isWasteText(sector) ? 15 : 0;

  // 3) Sub-sector - 10%
  const subSector = oppNorm(r['Sub Sector']);
  const subSectorScore = isWasteText(subSector) ? 10 : 0;

  // 4) Procurement wording - 10% (from matched Procurement Intent keywords specifically)
  const procurementScore = Math.min(10, (categoryWeights.PURCHASE||0) * 0.3);

  // 5) District preference - 5% (only a real match already exists, per the gate above)
  const preferredDistricts = String(Store.data.settings.preferredOppDistricts||'').split(',').map(d=>oppNorm(d)).filter(Boolean);
  const district = oppNorm(r['District']);
  const locationScore = district ? (preferredDistricts.includes(district) ? 5 : 1) : 0;

  // 6) Estimated fund value - 10% (log-scaled so one huge project can't dominate the score alone)
  const fund = oppMoney(r['FundTotal']);
  const fundScore = fund>0 ? Math.min(10, Math.log10(fund+1)*1.3) : 0;

  // 7) Deadline proximity - 10% (an actionable, not-yet-closed date scores higher than one far off or already past)
  let deadlineScore = 0;
  const closing = r['Closing Date'] || r['Project Date'];
  if(closing){
    const days = Math.floor((new Date(closing) - new Date())/86400000);
    if(days>=0 && days<=30) deadlineScore = 10;
    else if(days>30 && days<=90) deadlineScore = 6;
    else if(days>90) deadlineScore = 3;
  }

  // 8) Historical relevance - 10% (has this local body previously produced a Won opportunity?)
  const lb = oppNorm(r['LB Name']);
  const historyScore = (lb && Object.entries(Store.data.oppTracking||{}).some(([k,tr])=>tr.status==='Won' && k.split('|')[1]===lb)) ? 10 : 0;

  const score = Math.round(Math.min(100,
    productScore + sectorScore + subSectorScore + procurementScore + locationScore + fundScore + deadlineScore + historyScore));

  return {
    score, type, hits: [...new Set(matched.map(m=>m.word))].slice(0,15),
    scoreBreakdown: {
      product: Math.round(productScore), sector: sectorScore, subSector: subSectorScore,
      procurement: Math.round(procurementScore), location: locationScore,
      fund: Math.round(fundScore*10)/10, deadline: deadlineScore, history: historyScore
    }
  };
}
function oppParseTSV(txt){
  const lines = String(txt||'').replace(/\r/g,'').split('\n').filter(x=>x.trim());
  if(lines.length < 2) return [];
  const headers = lines[0].split('\t').map(x=>x.trim());
  return lines.slice(1).map(line=>{
    const a = line.split('\t'); const r = {};
    headers.forEach((h,i)=>r[h] = a[i]==null ? '' : a[i]);
    return r;
  }).filter(r=>Object.values(r).some(v=>String(v).trim()));
}
const OppFinder = {
  tab: 'dashboard',
  filtered: [],
  filters: { q:'', type:'ALL', district:'', localbody:'', minscore:0, status:'', from:'', to:'' },

  setTab(t){ this.tab = t; this.render(); },

  /* ---------------- import: paste TSV or upload an Excel file ---------------- */
  async importIncoming(incoming, source){
    const msg = document.getElementById('oppMsg');
    if(!incoming.length){ if(msg) msg.textContent = 'No rows detected.'; return false; }
    const old = new Map(Store.data.oppProjects.map(r=>[oppKeyOf(r), r]));
    let added = 0, updated = 0, dupes = 0;
    incoming.forEach(r=>{
      const k = oppKeyOf(r);
      if(old.has(k)){ dupes++; old.set(k, Object.assign({}, old.get(k), r)); updated++; }
      else { old.set(k, r); added++; }
    });
    Store.data.oppProjects = [...old.values()];
    Store.data.oppImportHistory.unshift({date:new Date().toISOString(), source:source||'Excel Import',
      records:incoming.length, newCount:added, updated, duplicates:dupes});
    Store.data.oppImportHistory = Store.data.oppImportHistory.slice(0,30);
    const ok1 = await Store.save('oppProjects');
    const ok2 = await Store.save('oppImportHistory');
    if(ok1 && ok2) await Activity.log('Project opportunity data imported', incoming.length+' row(s), '+added+' new, '+updated+' updated');
    if(msg) msg.textContent = `Imported ${incoming.length} rows \u2022 ${added} new \u2022 ${updated} updated \u2022 ${dupes} duplicate keys handled.`;
    this.render();
    return true;
  },
  /* Preview-before-save: nothing touches the database until the user
     explicitly clicks "Import & Save Projects" on the summary shown
     here. this.pendingImport / this.pendingSource hold the parsed rows
     in memory between preview and save. */
  pendingImport: null,
  pendingSource: '',
  previewImport(){
    const ta = document.getElementById('oppPaste');
    const raw = oppParseTSV(ta.value);
    this.showPreview(raw, 'Pasted TSV');
  },
  showPreview(rawIn, source){
    const box = document.getElementById('oppPreviewBox');
    const msg = document.getElementById('oppMsg');
    if(!rawIn.length){ if(msg) msg.textContent = 'No rows detected.'; if(box) box.innerHTML=''; return; }
    // Normalize FIRST: detect Project No / LB Name under whatever header
    // names the source file actually used, before anything computes a key.
    const raw = rawIn.map(oppNormalizeRow);
    // Invalid: no usable identifier at all (would collide on the same blank key as every other invalid row).
    const invalid = raw.filter(r=>!String(r['Project No']||'').trim() && !String(r['LB Name']||'').trim());
    const valid = raw.filter(r=>!invalid.includes(r));
    const incoming = valid.map(r=>Object.assign({}, r, oppClassify(r)));
    const existingKeys = new Set(Store.data.oppProjects.map(r=>oppKeyOf(r)));
    const newCount = incoming.filter(r=>!existingKeys.has(oppKeyOf(r))).length;
    const updateCount = incoming.length - newCount;

    // Collision guard: if a large fraction of THIS batch's rows share a
    // key with each other, they would silently overwrite one another
    // during save - the exact failure mode that caused "11,931 updated"
    // out of a single real import. Surface it loudly instead of saving
    // it quietly.
    const batchKeys = incoming.map(r=>oppKeyOf(r));
    const uniqueBatchKeys = new Set(batchKeys).size;
    const collisionRatio = incoming.length>10 ? 1 - (uniqueBatchKeys/incoming.length) : 0;
    const severeCollision = collisionRatio > 0.5;
    this.pendingImport = incoming;
    this.pendingSource = source;
    this.pendingSevereCollision = severeCollision;

    const headerSample = Object.keys(rawIn[0]||{}).slice(0,10);
    if(box) box.innerHTML =
      '<div class="card card-pad" style="margin-top:12px;background:var(--bg-soft,#faf9f7);">' +
        '<h4 style="margin:0 0 10px;">Import Preview</h4>' +
        '<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center;">' +
          '<div><div style="font-size:19px;font-weight:700;">'+raw.length+'</div><div class="hint">Total Rows</div></div>' +
          '<div><div style="font-size:19px;font-weight:700;color:var(--green,#16a34a);">'+newCount+'</div><div class="hint">New</div></div>' +
          '<div><div style="font-size:19px;font-weight:700;color:var(--blue,#2563eb);">'+updateCount+'</div><div class="hint">Updates</div></div>' +
          '<div><div style="font-size:19px;font-weight:700;">'+uniqueBatchKeys+'</div><div class="hint">Unique Records Detected</div></div>' +
          '<div><div style="font-size:19px;font-weight:700;'+(invalid.length?'color:var(--red,#dc2626);':'')+'">'+invalid.length+'</div><div class="hint">Invalid (no ID)</div></div>' +
        '</div>' +
        (invalid.length ? '<div class="hint" style="margin-top:8px;">Invalid rows have neither a Project No nor an LB Name, so they can\'t be safely matched against existing records \u2014 they will be skipped.</div>' : '') +
        (severeCollision ? '<div class="card card-pad" style="margin-top:10px;border-left:4px solid var(--red,#dc2626);">' +
          '<b style="color:var(--red,#dc2626);">&#9888; '+incoming.length+' rows only produced '+uniqueBatchKeys+' unique record(s).</b>' +
          '<div class="hint" style="margin-top:4px;">This usually means your file\'s Project No / Local Body columns use different header names than expected, so rows are being treated as the same record. Detected columns in your file: <b>'+headerSample.map(h=>Util.escapeHtml(h)).join(', ')+'</b>. Check these match an actual project/local-body identifier before saving \u2014 otherwise most of your rows will overwrite each other.</div>' +
        '</div>' : '') +
        '<div class="toolbar" style="margin-top:12px;">' +
          '<button class="btn '+(severeCollision?'btn-outline':'btn-primary')+' btn-sm" onclick="OppFinder.confirmImportSave()">&#128190; '+(severeCollision?'Save Anyway (Not Recommended)':'Import &amp; Save Projects')+'</button>' +
          '<button class="btn btn-outline btn-sm" onclick="OppFinder.cancelPreview()">Cancel</button>' +
        '</div>' +
      '</div>';
  },
  cancelPreview(){
    this.pendingImport = null;
    this.pendingSevereCollision = false;
    const box = document.getElementById('oppPreviewBox'); if(box) box.innerHTML='';
  },
  async confirmImportSave(){
    if(!this.pendingImport || !this.pendingImport.length){ UI.toast('Nothing to save \u2014 preview an import first'); return; }
    if(this.pendingSevereCollision && !confirm('Most of these rows share the same detected Project No / Local Body, which usually means they will overwrite each other and you\'ll end up with far fewer saved records than you expect. Save anyway?')) return;
    const box = document.getElementById('oppPreviewBox');
    if(box) box.innerHTML = '<div class="hint" style="margin-top:12px;">Saving to database\u2026</div>';
    const ok = await this.importIncoming(this.pendingImport, this.pendingSource);
    if(ok){
      const ta = document.getElementById('oppPaste'); if(ta) ta.value='';
      this.pendingImport = null;
      this.pendingSevereCollision = false;
    }

  async handleExcelFile(input){
    const f = input.files && input.files[0];
    const statusEl = document.getElementById('oppFileStatus');
    if(!f) return;
    if(statusEl) statusEl.textContent = 'Reading ' + f.name + '\u2026';
    try{
      const buf = await f.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array'});
      const sheetName = wb.SheetNames[0];
      const raw = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {defval:'', raw:false});
      if(!raw.length){ if(statusEl) statusEl.textContent = 'No rows found in ' + f.name + ' (sheet: ' + sheetName + ').'; input.value=''; return; }
      this.showPreview(raw, 'Excel: ' + f.name);
      if(statusEl) statusEl.textContent = '\u2713 Parsed ' + raw.length + ' rows from ' + f.name + ' \u2014 review the preview below, then Import & Save.';
    }catch(e){
      console.error(e);
      if(statusEl) statusEl.textContent = 'Could not read file: ' + (e.message||e);
      UI.toast('Could not read that Excel file');
    }
    input.value = '';
  },

  /* ---------------- filtering ---------------- */
  readFilters(){
    const g = id => { const el = document.getElementById(id); return el ? el.value : ''; };
    this.filters = {
      q: oppNorm(g('oppSearch')), type: g('oppType')||'ALL', district: g('oppDistrict'),
      localbody: g('oppLocalBody'), minscore: Number(g('oppMinScore')||0),
      status: g('oppStatus'), from: g('oppFrom'), to: g('oppTo')
    };
  },
  applyFilters(){
    this.readFilters();
    const f = this.filters;
    this.filtered = Store.data.oppProjects.filter(r=>{
      const blob = oppNorm(Object.entries(r).filter(([k])=>!['score','type','hits'].includes(k)).map(([,v])=>v).join(' '));
      const tr = Store.data.oppTracking[oppKeyOf(r)] || {};
      const st = tr.status || 'New';
      const dateVal = r['Project Date'] || r['Date'] || r['Created Date'] || r['Closing Date'] || '';
      return r.score >= f.minscore && (f.type==='ALL' || r.type===f.type) &&
        (!f.district || r['District']===f.district) && (!f.localbody || r['LB Name']===f.localbody) &&
        (!f.q || blob.includes(f.q)) && (!f.status || st===f.status) &&
        (!f.from || String(dateVal).slice(0,10) >= f.from) && (!f.to || String(dateVal).slice(0,10) <= f.to);
    }).sort((a,b)=>b.score-a.score);
  },

    this.filters = { q:'', type:'ALL', district:'', localbody:'', minscore:0, status:'', from:'', to:'' };

  quickDate(v){
    const now = new Date(); let from = new Date(now), to = new Date(now);
    if(v==='week') from.setDate(now.getDate()-now.getDay());
    else if(v==='month') from.setDate(1);
    else if(v==='30') from.setDate(now.getDate()-29);
    else if(!v){ document.getElementById('oppFrom').value=''; document.getElementById('oppTo').value=''; this.render(); return; }
    document.getElementById('oppFrom').value = from.toISOString().slice(0,10);
    document.getElementById('oppTo').value = to.toISOString().slice(0,10);
    this.render();
  },

      '<button class="btn btn-outline" onclick="UI.closeModal()">Close</button>' +

  /* Creates a real record in the existing Customer Master (not a
     parallel lead list) - project name, district, local body, score
     and category get carried into the lead's first timeline entry so
     the sales team has context without leaving the CRM. */
  async convertToLead(key){
    const r = Store.data.oppProjects.find(x=>oppKeyOf(x)===key);
    if(!r) return;
    const name = r['LB Name'] || r['Project Name Eng'] || 'Project Opportunity Lead';
    const by = (Auth.session && (Auth.session.name||Auth.session.username)) || 'System';
    const rec = {
      id: Util.uid('C', Store.data.customers), name, phone:'', email:'',
      district: r['District']||'', panchayath: r['LB Name']||'',
      assignedTo: by, status:'New Lead', lastContact: Util.todayISO(), createdDate: Util.todayISO(),
      timeline:[{id:'T'+Date.now(), date:Util.todayISO(), stage:'First Contact',
        note:'Converted from Project Opportunity: '+(r['Project Name Eng']||r['Project Name Mal']||'')+' ('+r.score+'% match, '+OPP_CATEGORY_NAMES[r.type]+')',
        by}]
    };
    Store.data.customers.unshift(rec);
    const ok = await Store.save('customers');
    if(ok) await Activity.log('Lead created from Project Opportunity', name);
    UI.closeModal();
    UI.toast('Lead created \u2014 opening Customers');
    go('customers');
    if(Customers.openDetail) Customers.openDetail(rec.id);
  },

  /* ---------------- keyword-matching product list (distinct from Product Master) ---------------- */
  async addProduct(){
    const name = document.getElementById('oppProdName').value.trim();
    const keywords = document.getElementById('oppProdKeywords').value.trim();
    if(!name || !keywords){ UI.toast('Enter both a name and keywords'); return; }
    Store.data.oppProducts.push({name, keywords});
    const ok = await Store.save('oppProducts');
    if(ok) await Activity.log('Project-matching product added', name);
    this.render();
  },
  async removeProductAt(i){
    const p = Store.data.oppProducts[i]; if(!p) return;
    Store.data.oppProducts.splice(i,1);
    const ok = await Store.save('oppProducts');
    if(ok) await Activity.log('Project-matching product removed', p.name);
    this.render();
  },
  async addKeywordGroup(){
    const tier = document.getElementById('oppKwTier').value.trim();
    const weight = Math.max(1, Math.min(25, Number(document.getElementById('oppKwWeight').value)||0));
    const category = document.getElementById('oppKwCategory').value.trim().toUpperCase();
    const words = document.getElementById('oppKwWords').value.split(',').map(w=>w.trim()).filter(Boolean);
    if(!tier || !category || !words.length){ UI.toast('Enter a tier, category and at least one word'); return; }
    Store.data.oppKeywordGroups.push({tier, weight, category, words});
    const ok = await Store.save('oppKeywordGroups');
    if(ok) await Activity.log('Opportunity keyword group added', tier+' ('+words.length+' word(s))');
    this.render();
  },
  async removeKeywordGroup(i){
    const g = Store.data.oppKeywordGroups[i]; if(!g) return;
    if(!confirm('Delete the "'+g.tier+'" group with '+g.words.length+' word(s)? This affects future scoring immediately.')) return;
    Store.data.oppKeywordGroups.splice(i,1);
    const ok = await Store.save('oppKeywordGroups');
    if(ok) await Activity.log('Opportunity keyword group removed', g.tier);
    this.render();
  },

  /* ---------------- export ---------------- */
  exportCSV(onlySaved){
    const list = onlySaved ? Store.data.oppProjects.filter(r=>Store.data.oppTracking[oppKeyOf(r)]) :
      (this.filtered.length ? this.filtered : Store.data.oppProjects);
    if(!list.length){ UI.toast('Nothing to export'); return; }
    const cols = ['score','type',...OPP_TEMPLATE_COLUMNS,'hits'];
    const out = [cols.join(',')];
    list.forEach(r=>out.push(cols.map(c=>'"'+String(c==='hits'?r.hits.join('; '):(r[c]==null?'':r[c])).replace(/"/g,'""')+'"').join(',')));
    const blob = new Blob([out.join('\n')], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'JAYS_Project_Opportunities.csv'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  },

      '<div><b>'+unmatchedCount+' project(s) matched no keyword at all</b><div class="hint">These scored 0% and are worth a quick manual scan \u2014 you may spot a new product term to add to the keyword library.</div></div>' +

      rows = Store.data.payments.map(p=>({'Party Name':p.party, 'Company Name':p.companyName||'', 'Product':p.product||'', 'Invoice Number':p.invoiceNumber||p.id, 'Invoice Date':p.invoiceDate, 'Taxable Value':p.taxableValue||0, 'CGST':p.cgst||0, 'SGST':p.sgst||0, 'IGST':p.igst||0, 'Round Off':p.roundOff||0, 'Invoice Amount':p.amount, 'Due Amount':p.dueAmount!==undefined?p.dueAmount:Math.max((Number(p.amount)||0)-(Number(p.amountPaid)||0),0), 'Payment Status':p.status==='Paid'?'Paid':'Unpaid', Contact:p.contact, Phone:p.phone, FollowupDate:p.followupDate, Response:p.response}));
    } else if(view==='followupcentre'){
      rows = Store.data.followups.map(f=>({ID:f.id, Date:f.date, Customer:f.customerName, Phone:f.phone, Purpose:f.purpose, Status:f.status, Notes:f.notes}));
    } else if(view==='tasks'){
      rows = Store.data.tasks.map(t=>({ID:t.id, Date:t.date, 'To Do':t.todo, AssignedTo:t.assignedTo, Customer:t.customerName, 'Area/Panchayath':custArea(t.customerId), Phone:t.phone, 'Task Entry':t.taskEntry, Remarks:t.remarks, Status:t.status}));
    } else if(view==='notes'){
      rows = Store.data.notes.map(n=>({ID:n.id, Date:n.date, Note:n.text, Remark:n.remark}));
    } else if(view==='gemcrac'){
      rows = Store.data.gemcrac.map(g=>({'Party/Panchayath':g.party, 'Company Name':g.companyName||'', 'GEM Order Number':g.gemcNumber, 'Product Name':g.productName||'', 'Buying Mode':g.buyingMode||'', 'Order Date':g.orderDate, 'Order Value':g.amount||0, 'Quantity':g.qty||0, 'Status':g.status, Contact:g.contact||'', Phone:g.phone||'', Remark:g.remark||''}));
    } else if(view==='orders'){
      rows = Store.data.orders.map(o=>({ID:o.id, 'Order Date':o.orderDate, 'GEM Order Number':o.gemcNumber||'', 'Order From':o.orderFrom||'', 'Product Name':o.productName||'', 'Party Name':o.party, 'Party Phone':o.phone||'', 'Assigned To':o.assignedTo||'', 'Status':o.status}));
    } else if(view==='complaints'){
      rows = Store.data.complaints.map(c=>({ID:c.id, 'Complaint Date':c.complaintDate, 'Complaint From':c.complaintFrom, 'Product Name':c.productName||'', 'Complaint Note':c.note||'', 'Assigned To':c.assignedTo||'', 'Status':c.status, 'Updated Date':c.updatedDate}));
    } else if(view==='attendance'){
      const list = Auth.isAdmin() ? Store.data.attendance : Store.data.attendance.filter(a=>a.userId===Auth.session.id);
      rows = list.map(a=>({Date:a.date, Employee:a.name||a.username, Location:a.location||'', Status:a.status, 'Login Time':a.loginTime?Util.fmtDateTime(a.loginTime):'', 'Logout Time':a.logoutTime?Util.fmtDateTime(a.logoutTime):'', Notes:a.notes||''}));
    } else {
      rows = Store.data.customers.map(x=>({ID:x.id, Name:x.name, Phone:x.phone, Status:x.status}));
    }
    if(!rows.length){ UI.toast('Nothing to export in this view'); return; }
    this.download(rows, view||'export');
  },
  download(rows, filename){
    try{
      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Data');
      XLSX.writeFile(wb, filename+'.xlsx');
      UI.toast('Exported '+filename+'.xlsx');
    }catch(e){ UI.toast('Export failed'); console.error(e); }
  }
};

    try{
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws);
      if(!rows.length){ UI.toast('No rows found in file'); return; }
      let count = 0;
      if(target==='customers'){
        rows.forEach(r=>{
          const name = r.Name||r.name; const phone = r.Phone||r.phone;
          if(!name || !phone) return;
          Store.data.customers.unshift({
            id: Util.uid('C', Store.data.customers), name: String(name), phone: String(phone),
            email: r.Email||r.email||'', district: r.District||r.district||'', panchayath: r.Area||r.panchayath||'',
            assignedTo: r.AssignedTo||r.assignedTo||'', status: r.Status||r.status||'New Lead',
            lastContact: Util.todayISO(), createdDate: Util.todayISO(),
            timeline:[{id:'T'+Date.now()+count, date:Util.todayISO(), stage:'First Contact', note:'Imported from Excel', by:(Auth.session&&Auth.session.name)||'System'}]
          });
          count++;
        });
        await Store.save('customers');
      } else if(target==='bids'){
        rows.forEach(r=>{
          const title = r.Title||r.title||r['Bid Title']; if(!title) return;
          Store.data.bids.unshift({
            id: Util.uid('BID', Store.data.bids),
            bidNumber: r['Bid No']||r.BidNumber||r['Bid Number']||r.bidNumber||'',
            title: String(title), category: r.Category||r.category||'',
            organisation: r.Department||r.Organisation||r.organisation||'',
            endDate: r['Closing Date']||r.EndDate||r['End Date']||'',
            estimatedValue: Number(r['Bid Value']||r.Value||r.estimatedValue)||0,
            status: 'New', decision:'', description:'', checklist: DEFAULT_BID_CHECKLIST.map(t=>({text:t, done:false})),
            activity:[{ts:new Date().toISOString(), text:'Imported from Excel', by:(Auth.session&&Auth.session.name)||'System'}]
          });
          count++;
        });
        await Store.save('bids');
      } else {
        rows.forEach(r=>{
          const name = r.Name||r.name; if(!name) return;
          Store.data.products.unshift({
            id: Util.uid('P', Store.data.products), code: Number(r.Code||r.code)||(Store.data.products.length+1),
            category: r.Category||r.category||'Uncategorized', name: String(name), unit: r.Unit||r.unit||'Nos',
            price: Number(r.Price||r.price)||0, stock: Number(r.Stock||r.stock)||0, description: r.Description||''
          });
          count++;
        });
        await Store.save('products');
      }
      await Activity.log('Excel import', count+' row(s) imported into '+target+' from '+file.name);
      UI.toast(count+' row(s) imported');
      Router.render('backup');
    }catch(e){ console.error(e); UI.toast('Import failed — check the file format'); }
  },
  renderLog(){
    const list = Store.data.activityLog;
    document.getElementById('backupBody').innerHTML = `
      <div class="toolbar">
        <div class="toolbar-spacer"></div>
        ${Auth.isAdmin()? `<button class="btn btn-outline btn-sm" onclick="Backup.clearLog()">&#128465; Clear Log</button>`:''}
      </div>
      <div class="card"><div class="table-wrap">
      ${list.length? `<table><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Details</th></tr></thead><tbody>
        ${list.map(a=>`<tr>
          <td class="cell-mute">${Util.fmtDateTime(a.ts)}</td>
          <td class="cell-main">${Util.escapeHtml(a.user)}</td>
          <td>${Util.escapeHtml(a.action)}</td>
          <td class="cell-mute">${Util.escapeHtml(a.details||'')}</td>
        </tr>`).join('')}
      </tbody></table>` : `<div class="empty-state"><div class="ic">&#128220;</div><div class="t">No activity recorded yet</div></div>`}
      </div></div>
    `;
  },
  async clearLog(){
    if(!confirm('Clear the entire activity log?')) return;
    Store.data.activityLog = [];
    await Store.save('activityLog');
    UI.toast('Activity log cleared');
    Router.render('backup');
  }
};

const TEAM_USER_FN_URL = SUPABASE_URL + '/functions/v1/manage-team-user';
async function callTeamUserFn(payload){
  const { data } = await sb.auth.getSession();
  const token = data && data.session && data.session.access_token;
  if(!token){ UI.toast('Your session expired — please log in again.'); return {error:'Not authenticated'}; }
  try{
    const res = await fetch(TEAM_USER_FN_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer '+token, 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify(payload)
    });
    const out = await res.json();
    if(!res.ok || out.error) return { error: (out && out.error) || ('Request failed ('+res.status+')') };
    return out;
  }catch(e){ console.error('manage-team-user call failed', e); return { error: 'Network error contacting the server' }; }
}
const UsersMgmt = {

    document.getElementById('content').innerHTML = `

        <button class="btn btn-primary btn-sm" onclick="UsersMgmt.openForm(null)">&#65291; Add User</button>
      </div>
      <p class="cell-mute" style="margin:0 0 10px;font-size:12.5px;">Team accounts are secured by Supabase Auth — sign-in is via email/password with Row Level Security, not the app's own password list.</p>
      <div class="card"><div class="table-wrap">
      <table><thead><tr><th>Username</th><th>Name</th><th>Role</th><th>Menu Access</th><th></th></tr></thead><tbody>
      ${list.map(u=>`<tr>
        <td class="mono cell-main">${Util.escapeHtml(u.username)}</td>
        <td>${Util.escapeHtml(u.name||'—')}</td>

        <td class="cell-mute">${u.role==='Admin' ? 'All menus' : (u.permissions ? (u.permissions.length ? u.permissions.length+' of '+assignableMenus().length : 'None') : 'All menus')}</td>
        <td style="display:flex;gap:5px;">

    `;

  openForm(id){
    const rec = id ? Store.data.users.find(u=>u.id===id) : null;
    const v = rec || {id:'',username:'',role:'Sales',name:'',permissions:null};
    const menus = assignableMenus();
    const checkedIds = v.permissions ? v.permissions : menus.map(m=>m.id);
    UI.openModal(rec?'Edit User':'Add User', `
      <div class="field"><label>Username *</label><input id="u_username" value="${Util.escapeHtml(v.username)}" ${rec?'disabled':''}></div>
      <div class="field"><label>Full Name</label><input id="u_name" value="${Util.escapeHtml(v.name||'')}"></div>
      <div class="field"><label>${rec?'New Password (leave blank to keep current)':'Password *'}</label><input id="u_password" type="password" placeholder="${rec?'Leave blank to keep current password':''}"></div>
      <div class="field"><label>Role</label><select id="u_role" onchange="UsersMgmt.toggleRoleUI()"><option ${v.role==='Sales'?'selected':''}>Sales</option><option ${v.role==='Admin'?'selected':''}>Admin</option></select></div>
      <div class="field" id="u_permsWrap" style="display:${v.role==='Admin'?'none':'block'};">
        <label>Menu Access</label>
        <div style="display:flex;gap:6px;margin-bottom:6px;">
          <button type="button" class="btn btn-outline btn-sm" onclick="UsersMgmt.setAllPerms(true)">Select all</button>
          <button type="button" class="btn btn-outline btn-sm" onclick="UsersMgmt.setAllPerms(false)">Clear all</button>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;max-height:220px;overflow:auto;border:1px solid var(--border,#e5e7eb);border-radius:8px;padding:10px;">
          ${menus.map(m=>`<label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;"><input type="checkbox" class="u_perm" value="${m.id}" ${checkedIds.includes(m.id)?'checked':''}> ${m.label.replace(/&amp;/g,'&')}</label>`).join('')}
        </div>
        <div class="hint" style="margin-top:6px;">Admins always have access to every menu.</div>
      </div>
    `, `<button class="btn btn-outline" onclick="UI.closeModal()">Cancel</button><button class="btn btn-primary" onclick="UsersMgmt.save('${id||''}')">Save</button>`);
  },
  toggleRoleUI(){
    const role = document.getElementById('u_role').value;
    const wrap = document.getElementById('u_permsWrap');
    if(wrap) wrap.style.display = role==='Admin' ? 'none' : 'block';
  },
  setAllPerms(state){
    document.querySelectorAll('.u_perm').forEach(cb=>{ cb.checked = state; });
  },
  async save(id){
    const username = document.getElementById('u_username').value.trim();
    const password = document.getElementById('u_password').value;
    if(!username){ UI.toast('Username is required'); return; }
    if(!id && !password){ UI.toast('Password is required for a new user'); return; }
    if(!id && Store.data.users.some(u=>u.username.toLowerCase()===username.toLowerCase())){ UI.toast('Username already exists'); return; }
    const role = document.getElementById('u_role').value;
    const permissions = role==='Admin' ? null : Array.from(document.querySelectorAll('.u_perm:checked')).map(cb=>cb.value);
    const name = document.getElementById('u_name').value.trim();

    const payload = id
      ? { action:'update', id, password: password||undefined, name, role, permissions }
      : { action:'create', username, password, name, role, permissions };
    const out = await callTeamUserFn(payload);
    if(out.error){ UI.toast(out.error); return; }

    await Store.loadUsers();
    await Activity.log(id?'Updated user':'Added user', username);
    UI.closeModal(); UI.toast('Saved'); Router.render('users');
    if(id && Auth.session && Auth.session.id===id){ await Auth.loadProfile(id); renderNav(); }
  },
  async remove(id, username){
    if(!confirm('Remove '+username+'? This deletes their login entirely.')) return;
    const out = await callTeamUserFn({ action:'delete', id });
    if(out.error){ UI.toast(out.error); return; }
    await Store.loadUsers();
    await Activity.log('Removed user', username);
    UI.toast('Removed'); Router.render('users');
  }
};
Views.users = ()=>UsersMgmt.render();

const SettingsView = {
  async deleteAllProjectRecords(){

  async save(){
    Store.data.settings.companyName = document.getElementById('s_companyName').value.trim();

    Store.data.settings.companyEmail = document.getElementById('s_companyEmail').value.trim();

    await Store.save('settings');
    await Activity.log('Settings updated', 'Company details changed');
    UI.toast('Settings saved');
  },
  _downscale(file, max, quality){
    return new Promise((resolve, reject)=>{
      const r = new FileReader();
      r.onload = ()=>{
        const img = new Image();
        img.onload = ()=>{
          let w = img.width, h = img.height;
          if(w>max||h>max){ const sc = Math.min(max/w, max/h); w=Math.round(w*sc); h=Math.round(h*sc); }
          const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
          const ctx = cv.getContext('2d');
          // Fill white FIRST: a transparent PNG drawn straight onto an
          // untouched canvas renders its transparent areas as BLACK once
          // flattened to JPEG (no alpha channel), not white/transparent -
          // this is what actually keeps a transparent-background logo
          // looking correct instead of gaining a black box around it.
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img,0,0,w,h);
          resolve(cv.toDataURL('image/jpeg', quality));
        };
        img.onerror = ()=>reject(new Error('Not a readable image'));
        img.src = r.result;
      };
      r.onerror = ()=>reject(new Error('Could not read that file'));
      r.readAsDataURL(file);
    });
  },
  async onLogoFile(input){
    const f = input.files && input.files[0]; if(!f) return;
    if(!/^image\/(jpe?g|png|webp)$/i.test(f.type)){ UI.toast('Use a JPG, PNG or WEBP image'); input.value=''; return; }
    try{
      const url = await this._downscale(f, 300, 0.85);
