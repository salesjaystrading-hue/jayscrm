const Quotations = {
  draftItems: [],
  render(){
    const list = Store.data.quotations.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    const s = {total:list.length, draft:0, sent:0, accepted:0, rejected:0};
    list.forEach(q=>{ if(q.status==='Draft')s.draft++; else if(q.status==='Sent')s.sent++; else if(q.status==='Accepted')s.accepted++; else if(q.status==='Rejected')s.rejected++; });
    document.getElementById('content').innerHTML = `
      ${dashboardCardsHTML('Quotations Dashboard', [
        {label:'Total Quotations', value:s.total},
        {label:'Draft', value:s.draft, color:'var(--text-mute,#6b7280)'},
        {label:'Sent', value:s.sent, color:'var(--amber,#d97706)'},
        {label:'Accepted', value:s.accepted, color:'var(--green,#16a34a)'},
        {label:'Rejected', value:s.rejected, color:'var(--red,#dc2626)'}
      ])}
      <div class="toolbar"><div class="toolbar-spacer"></div>
        <button class="btn btn-primary btn-sm" onclick="Quotations.openForm(null)">&#65291; New Quotation</button>
      </div>
      <div class="card"><div class="table-wrap">
      ${list.length ? `<table><thead><tr><th class="col-actions">Actions</th><th>Quote #</th><th>Date</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead><tbody>
        ${Paginate.slice('quotations', list).pageItems.map(q=>`<tr>
          <td class="col-actions"><div class="row-action-btns">
            <button class="icon-btn" title="Print" onclick="Quotations.print('${q.id}')">&#128424;</button>
            <a class="icon-btn" style="color:#25D366;text-decoration:none;" title="WhatsApp" href="${Util.waLink(q.phone, Quotations.waSummary(q))}" target="_blank">&#128172;</a>
            <button class="icon-btn" title="Edit" onclick="Quotations.openForm('${q.id}')">&#9998;</button>
            <button class="icon-btn" title="Duplicate" onclick="Quotations.duplicate('${q.id}')">&#128203;</button>
            <button class="icon-btn" title="Delete" onclick="Quotations.remove('${q.id}')">&#128465;</button>
          </div></td>
          <td class="mono cell-main">${q.id}</td>
          <td class="cell-mute">${Util.fmtDate(q.date)}</td>
          <td class="cell-main" onclick="Customers.openDetail('${q.customerId}')">${Util.escapeHtml(q.customerName)}</td>
          <td class="mono">${Util.fmtMoney(q.total)}</td>
          <td>${statusBadge(q.status)}</td>
        </tr>`).join('')}
      </tbody></table>
      ${Paginate.controlsHTML('quotations', Paginate.slice('quotations', list), "Quotations.render()")}` : `<div class="empty-state"><div class="ic">&#128196;</div><div class="t">No quotations yet</div><div class="d">Create a quotation for a customer, print it, or send it straight to WhatsApp.</div>
      <button class="btn btn-primary btn-sm" onclick="Quotations.openForm(null)">&#65291; New Quotation</button></div>`}
      </div></div>
    `;
  },
  waSummary(q){
    let lines = [`Quotation ${q.id} from Jays Trading and Business Solution`, `Date: ${q.date}`, ''];
    q.items.forEach(it=> lines.push(`${it.name} x${it.qty} = ${Util.fmtMoney(it.qty*it.rate).replace('&#8377;','Rs.')}`));
    lines.push('', `Total: ${Util.fmtMoney(q.total).replace('&#8377;','Rs.')}`);
    return lines.join('\n');
  },
  openForm(id, presetCustomerId){
    const rec = id ? Store.data.quotations.find(x=>x.id===id) : null;
    this.draftItems = rec ? JSON.parse(JSON.stringify(rec.items)) : [{name:'',qty:1,rate:0}];
    const custOptions = Store.data.customers.map(c=>`<option value="${c.id}" ${(rec&&rec.customerId===c.id)||(!rec&&presetCustomerId===c.id)?'selected':''}>${Util.escapeHtml(c.name)} — ${Util.escapeHtml(c.phone)}</option>`).join('');
    const gst = rec ? rec.gst : (Store.data.settings.gstPercent||0);
    UI.openModal(rec?'Edit Quotation':'New Quotation', `
      <div class="form-row">
        <div class="field"><label>Customer *</label><select id="q_cust"><option value="">Select customer...</option>${custOptions}</select></div>
        <div class="field"><label>Date</label><input type="date" id="q_date" value="${rec?rec.date:Util.todayISO()}"></div>
      </div>
      <div class="field"><label>Status</label><select id="q_status">${['Draft','Sent','Accepted','Rejected'].map(s=>`<option ${rec&&rec.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
      <h4 style="font-size:12px;text-transform:uppercase;color:var(--text-mute);margin:16px 0 8px;">Line Items</h4>
      <datalist id="dl_products">${Store.data.products.map(p=>`<option value="${Util.escapeHtml(p.name)}">`).join('')}</datalist>
      <div id="q_items"></div>
      <button class="btn btn-outline btn-sm" onclick="Quotations.addLine()">&#65291; Add Line</button>
      <div class="form-row" style="margin-top:16px;">
        <div class="field"><label>GST / Tax %</label><input type="number" id="q_gst" value="${gst}"></div>
        <div class="field"><label>Total (auto)</label><input id="q_totalDisplay" disabled></div>
      </div>
    `, `
      <button class="btn btn-outline" onclick="UI.closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="Quotations.save('${id||''}')">Save Quotation</button>
    `, true);
    this.renderLines();
    document.getElementById('q_gst').addEventListener('input', ()=>Quotations.renderLines());
  },
  addLine(){ this.draftItems.push({name:'',qty:1,rate:0}); this.renderLines(); },
  removeLine(i){ this.draftItems.splice(i,1); this.renderLines(); },
  updateLine(i, field, val){
    if(field==='name'){
      const prod = Store.data.products.find(p=>p.name===val);
      if(prod && prod.price) this.draftItems[i].rate = prod.price;
    }
    this.draftItems[i][field] = (field==='qty'||field==='rate') ? Number(val)||0 : val;
    this.renderLines(true);
  },
  renderLines(skipInputs){
    const box = document.getElementById('q_items');
    if(!box) return;
    box.innerHTML = this.draftItems.map((it,i)=>`
      <div class="quo-line">
        <input list="dl_products" placeholder="Item / product name" value="${Util.escapeHtml(it.name)}" onchange="Quotations.updateLine(${i},'name',this.value)">
        <input type="number" placeholder="Qty" value="${it.qty}" onchange="Quotations.updateLine(${i},'qty',this.value)">
        <input type="number" placeholder="Rate" value="${it.rate}" onchange="Quotations.updateLine(${i},'rate',this.value)">
        <div class="mono cell-mute" style="text-align:right;padding-right:4px;">${Util.fmtMoney(it.qty*it.rate)}</div>
        <button class="icon-btn" onclick="Quotations.removeLine(${i})">&times;</button>
      </div>
    `).join('');
    const subtotal = this.draftItems.reduce((s,it)=>s+(it.qty*it.rate),0);
    const gst = Number(document.getElementById('q_gst')?.value||0);
    const total = subtotal * (1+gst/100);
    const disp = document.getElementById('q_totalDisplay');
    if(disp) disp.value = 'Rs. ' + total.toLocaleString('en-IN',{maximumFractionDigits:0}) + (gst? ` (incl. ${gst}% tax)` : '');
  },
  async save(id){
    const custId = document.getElementById('q_cust').value;
    const cust = Store.data.customers.find(c=>c.id===custId);
    if(!cust){ UI.toast('Please select a customer'); return; }
    const items = this.draftItems.filter(it=>it.name.trim());
    if(!items.length){ UI.toast('Add at least one line item'); return; }
    const gst = Number(document.getElementById('q_gst').value||0);
    const subtotal = items.reduce((s,it)=>s+(it.qty*it.rate),0);
    const total = subtotal*(1+gst/100);
    const rec = {
      id: id || (Store.data.settings.quoPrefix||'Q-') + String(Store.data.settings.quoNext||1).padStart(4,'0'),
      customerId: custId, customerName: cust.name, phone: cust.phone,
      date: document.getElementById('q_date').value,
      status: document.getElementById('q_status').value,
      items, gst, subtotal, total
    };
    if(id){ const i=Store.data.quotations.findIndex(x=>x.id===id); Store.data.quotations[i]=rec; }
    else { Store.data.quotations.unshift(rec); Store.data.settings.quoNext = (Store.data.settings.quoNext||1)+1; await Store.save('settings'); }
    await Store.save('quotations');
    await Customers.logTimeline(custId, 'Quotation Sent', rec.id+' — '+Util.fmtMoney(total).replace('&#8377;','Rs.'), {silent:true});
    await Activity.log(id?'Updated quotation':'Created quotation', rec.id+' for '+cust.name);
    UI.closeModal(); UI.toast('Quotation saved'); Router.render('quotations');
  },
  async remove(id){
    if(!confirm('Delete this quotation?')) return;
    Store.data.quotations = Store.data.quotations.filter(x=>x.id!==id);
    await Store.save('quotations'); UI.toast('Deleted'); Router.render('quotations');
  },
  async duplicate(id){
    const src = Store.data.quotations.find(x=>x.id===id);
    if(!src) return;
    const copy = JSON.parse(JSON.stringify(src));
    copy.id = (Store.data.settings.quoPrefix||'Q-') + String(Store.data.settings.quoNext||1).padStart(4,'0');
    copy.date = Util.todayISO();
    copy.status = 'Draft';
    Store.data.quotations.unshift(copy);
    Store.data.settings.quoNext = (Store.data.settings.quoNext||1) + 1;
    const ok1 = await Store.save('quotations');
    const ok2 = await Store.save('settings');
    if(ok1 && ok2) await Activity.log('Quotation duplicated', src.id+' \u2192 '+copy.id);
    UI.toast('Duplicated as '+copy.id);
    Router.render('quotations');
  },
  print(id){
    const q = Store.data.quotations.find(x=>x.id===id);
    const s = Store.data.settings;
    const rowsHtml = q.items.map(it=>`<tr><td style="padding:8px;border-bottom:1px solid #eee;">${Util.escapeHtml(it.name)}</td><td style="padding:8px;border-bottom:1px solid #eee;text-align:center;">${it.qty}</td><td style="padding:8px;border-bottom:1px solid #eee;text-align:right;">${Util.fmtMoney(it.rate)}</td><td style="padding:8px;border-bottom:1px solid #eee;text-align:right;">${Util.fmtMoney(it.qty*it.rate)}</td></tr>`).join('');
    document.getElementById('printArea').innerHTML = `

/* =====================================================================
   PAYMENT PENDING FOLLOWUP
===================================================================== */
/* Called by CustPicker when a customer is selected in the Payments form.
   Fills only the Contact Name / Phone fields — the Party Name field
   (which may be an office/institution, not the contact's own name) is
   left exactly as typed or imported. */
function paymentsCustSelected(c){
  const contactEl = document.getElementById('p_contact');
  const phoneEl = document.getElementById('p_phone');
  if(contactEl) contactEl.value = c ? c.name : '';
  if(phoneEl) phoneEl.value = c ? c.phone : '';
}
const Payments = {
  render(){
    const searchEl = document.getElementById('paySearch');
    const searchHadFocus = document.activeElement === searchEl;
    const caretPos = searchHadFocus ? searchEl.selectionStart : null;

    const q = (document.getElementById('paySearch')?document.getElementById('paySearch').value:'').toLowerCase();
    const fStatus = document.getElementById('payStatusFilter')?document.getElementById('payStatusFilter').value:'';
    const fCompany = document.getElementById('payCompanyFilter')?document.getElementById('payCompanyFilter').value:'';
    const fParty = document.getElementById('payPartyFilter')?document.getElementById('payPartyFilter').value:'';
    const fOverdue = document.getElementById('payOverdueFilter')?document.getElementById('payOverdueFilter').checked:false;

    let list = Store.data.payments.slice().sort((a,b)=>(a.followupDate||'').localeCompare(b.followupDate||''));

    if(q) list = list.filter(p=>(p.party||'').toLowerCase().includes(q) || (p.invoiceNumber||'').toLowerCase().includes(q) || (p.id||'').toLowerCase().includes(q) || (p.contact||'').toLowerCase().includes(q) || (p.phone||'').includes(q));
    if(fStatus) list = list.filter(p=>p.status===fStatus);
    if(fCompany) list = list.filter(p=>p.companyName===fCompany);
    if(fParty) list = list.filter(p=>p.party===fParty);
    if(fOverdue) list = list.filter(p=>p.status!=='Paid' && p.followupDate && p.followupDate < Util.todayISO());

    const partyNames = [...new Set(Store.data.payments.map(p=>p.party).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
    const partyPendingTotal = fParty ? list.reduce((s,p)=>s+Math.max((Number(p.amount)||0)-(Number(p.amountPaid)||0),0),0) : null;

    const totalPending = list.reduce((s,p)=>s+Math.max((Number(p.amount)||0)-(Number(p.amountPaid)||0),0),0);
    const totalPaid = list.reduce((s,p)=>s+(Number(p.amountPaid)||0),0);
    document.getElementById('content').innerHTML = `
      <div class="toolbar">
        <span class="badge badge-amber" style="font-size:12px;padding:6px 12px;">Bill Pending: ${Util.fmtMoney(totalPending)}</span>
        <span class="badge badge-green" style="font-size:12px;padding:6px 12px;">Amount Paid: ${Util.fmtMoney(totalPaid)}</span>
        <div class="toolbar-spacer"></div>
        <input type="file" id="payImportFile" accept=".xlsx,.xls,.csv" style="display:none;" onchange="Payments.importExcel(this.files[0])">
        <button class="btn btn-outline btn-sm" onclick="Payments.downloadSampleTemplate()">&#128190; Sample Template</button>
        <button class="btn btn-outline btn-sm" onclick="document.getElementById('payImportFile').click()">&#128229; Import from Excel</button>
        <button class="btn btn-outline btn-sm" style="color:var(--red);" onclick="Payments.deleteAll()">&#128465; Delete All</button>
        <button class="btn btn-primary btn-sm" onclick="Payments.openForm(null)">&#65291; Add Invoice</button>
      </div>
      <div class="toolbar">
        <div class="search"><span class="ic">&#128269;</span><input id="paySearch" placeholder="Search party, invoice #, contact, phone..." oninput="Payments.render()" value="${Util.escapeHtml(q)}"></div>
        <select id="payStatusFilter" onchange="Payments.render()">
          <option value="">All Statuses</option>
          <option value="Pending" ${fStatus==='Pending'?'selected':''}>Unpaid</option>
          <option value="Paid" ${fStatus==='Paid'?'selected':''}>Paid</option>
        </select>
        <select id="payCompanyFilter" onchange="Payments.render()">
          <option value="">All Companies</option>
          ${DROPDOWNS.companyName.map(c=>`<option value="${c}" ${c===fCompany?'selected':''}>${c}</option>`).join('')}
        </select>
        <select id="payPartyFilter" onchange="Payments.render()">
          <option value="">All Parties</option>
          ${partyNames.map(p=>`<option value="${Util.escapeHtml(p)}" ${p===fParty?'selected':''}>${Util.escapeHtml(p)}</option>`).join('')}
        </select>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-mute);white-space:nowrap;">
          <input type="checkbox" id="payOverdueFilter" onchange="Payments.render()" ${fOverdue?'checked':''}> Overdue only
        </label>
        ${fParty ? `<span class="badge badge-amber" style="font-size:12px;padding:6px 12px;">${Util.escapeHtml(fParty)} pending: ${Util.fmtMoney(partyPendingTotal)}</span>` : ''}
        ${(q||fStatus||fCompany||fParty||fOverdue) ? `<button class="btn btn-outline btn-sm" onclick="Payments.clearFilters()">Clear</button>` : ''}
      </div>
      <div class="card"><div class="table-wrap">
      ${list.length ? `<table><thead><tr><th class="col-actions">Actions</th><th>Party Name</th><th>Company Name</th><th>Product</th><th>Invoice Number</th><th>Invoice Date</th><th>Invoice Amount</th><th>Due Amount</th><th>Payment Status</th><th>Contact Name</th><th>Area / Panchayath</th><th>Phone</th><th>Follow-up Date</th><th>Response</th></tr></thead><tbody>
        ${Paginate.slice('payments', list).pageItems.map(p=>{
          const overdue = p.status!=='Paid' && p.followupDate && p.followupDate < Util.todayISO();
          const paidAmt = Number(p.amountPaid)||0;
          const pendingAmt = p.dueAmount!==undefined ? Math.max(Number(p.dueAmount)||0,0) : Math.max((Number(p.amount)||0)-paidAmt,0);
          return `<tr>
          <td class="col-actions"><div class="row-action-btns">
            <a class="icon-btn" style="color:#25D366;text-decoration:none;" title="WhatsApp reminder" href="${Util.waLink(p.phone,'Hi '+p.contact+', this is a reminder that invoice '+(p.invoiceNumber||p.id)+' for '+Util.fmtMoney(pendingAmt).replace('&#8377;','Rs.')+' is pending. Kindly clear at the earliest. - Jays Trading and Business Solution')}" target="_blank">&#128172;</a>
            <button class="icon-btn" onclick="Payments.markPaid('${p.id}')" title="Mark paid">&#10003;</button>
            <button class="icon-btn" onclick="Payments.openForm('${p.id}')">&#9998;</button>
            <button class="icon-btn" onclick="Payments.remove('${p.id}')">&#128465;</button>
          </div></td>
          <td class="cell-main" style="cursor:pointer;" onclick="Payments.filterByParty('${Util.escapeHtml(p.party).replace(/'/g,"\\'")}')" title="View all pending for this party">${Util.escapeHtml(p.party)}</td>
          <td>${p.companyName? `<span class="badge badge-blue">${Util.escapeHtml(p.companyName)}</span>` : '—'}</td>
          <td class="cell-mute">${Util.escapeHtml(p.product||'—')}</td>
          <td class="mono cell-mute">${Util.escapeHtml(p.invoiceNumber||p.id)}</td>
          <td class="cell-mute">${Util.fmtDate(p.invoiceDate)}</td>
          <td class="mono">${Util.fmtMoney(p.amount)}</td>
          <td class="mono" style="color:${pendingAmt>0?'var(--red)':'var(--text-mute)'};">${Util.fmtMoney(pendingAmt)}</td>
          <td>${statusBadge(p.status)}</td>
          <td class="cell-mute">${Util.escapeHtml(p.contact||'—')}</td>
          <td class="cell-mute">${custArea(p.customerId)}</td>
          <td class="mono cell-mute">${Util.escapeHtml(p.phone||'')}</td>
          <td>${overdue?'<span class="badge badge-red">Overdue</span> ':''}${Util.fmtDate(p.followupDate)}</td>
          <td class="cell-mute">${Util.escapeHtml(p.response||'—')}</td>
        </tr>`;}).join('')}
      </tbody></table>
      ${Paginate.controlsHTML('payments', Paginate.slice('payments', list), "Payments.render()")}` : `<div class="empty-state"><div class="ic">&#128179;</div><div class="t">${(q||fStatus||fCompany||fParty||fOverdue)?'No matching invoices':'No pending payments'}</div><div class="d">${(q||fStatus||fCompany||fParty||fOverdue)?'Try clearing filters or adjusting your search.':'Log an invoice to start tracking payment follow-ups, or import a batch from Excel.'}</div>
      <button class="btn btn-primary btn-sm" onclick="Payments.openForm(null)">&#65291; Add Invoice</button></div>`}
      </div></div>
    `;
    if(searchHadFocus){
      const el = document.getElementById('paySearch');
      if(el){ el.focus(); el.setSelectionRange(caretPos, caretPos); }
    }
  },
  filterByParty(party){
    const sel = document.getElementById('payPartyFilter');
    const stat = document.getElementById('payStatusFilter');
    if(sel) sel.value = party;
    if(stat) stat.value = 'Pending';
    this.render();
  },
  clearFilters(){
    ['paySearch'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
    const st=document.getElementById('payStatusFilter'); if(st) st.value='';
    const co=document.getElementById('payCompanyFilter'); if(co) co.value='';
    const pt=document.getElementById('payPartyFilter'); if(pt) pt.value='';
    const ov=document.getElementById('payOverdueFilter'); if(ov) ov.checked=false;
    this.render();
  },
  openForm(id, presetCustomerId){
    const rec = id ? Store.data.payments.find(x=>x.id===id) : null;

  updatePendingPreview(){

  async save(id){
    const party = document.getElementById('p_party').value.trim();
    const amount = document.getElementById('p_amount').value;
    if(!party || amount===''){ UI.toast('Party name and amount are required'); return; }
    const custId = document.getElementById('p_customerId').value;
    let status = document.getElementById('p_status').value;
    const amountPaid = Number(document.getElementById('p_amountPaid').value)||0;
    if(amountPaid >= Number(amount) && Number(amount)>0) status = 'Paid';
    const rec = {
      id: id || (Store.data.settings.payPrefix||'INV-')+String(Store.data.settings.payNext||1).padStart(4,'0'),
      customerId: custId,
      companyName: document.getElementById('p_companyName').value,
      product: document.getElementById('p_product').value,
      invoiceNumber: document.getElementById('p_invoiceNumber').value.trim(),
      invoiceDate: document.getElementById('p_invoiceDate').value,
      party,
      taxableValue: Number(document.getElementById('p_taxableValue').value)||0,
      cgst: Number(document.getElementById('p_cgst').value)||0,
      sgst: Number(document.getElementById('p_sgst').value)||0,
      igst: Number(document.getElementById('p_igst').value)||0,
      roundOff: Number(document.getElementById('p_roundOff').value)||0,
      amount: Number(amount), amountPaid,
      dueAmount: Math.max(Number(amount)-amountPaid,0),

      phone: document.getElementById('p_phone').value.trim(),
      followupDate: document.getElementById('p_followupDate').value,
      response: document.getElementById('p_response').value.trim(),
      status
    };
    if(id){ const i=Store.data.payments.findIndex(x=>x.id===id); Store.data.payments[i]=rec; }
    else { Store.data.payments.unshift(rec); Store.data.settings.payNext=(Store.data.settings.payNext||1)+1; await Store.save('settings'); }
    await Store.save('payments');
    if(custId) await Customers.logTimeline(custId, 'Payment Status', rec.id+' — '+status+' ('+Util.fmtMoney(rec.amount).replace('&#8377;','Rs.')+')', {silent:true});

  async markPaid(id){
    const p = Store.data.payments.find(x=>x.id===id); p.status='Paid'; p.amountPaid = Number(p.amount)||0;
    await Store.save('payments');
    if(p.customerId) await Customers.logTimeline(p.customerId, 'Payment Status', p.id+' marked Paid', {silent:true});

  downloadSampleTemplate(){

        {'Party Name':'ABC Enterprises','Company Name':'LLP','Product':'','Invoice Number':'INV104','Invoice Date':'01-04-2026','Taxable Value':21186.44,'CGST':1906.78,'SGST':1906.78,'IGST':0,'Round Off':0,'Invoice Amount':25000,'Due Amount':0,'Payment Status':'Paid'}
      ];
      const ws = XLSX.utils.json_to_sheet(sample);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Payments');
      XLSX.writeFile(wb, 'jays-crm-payments-sample-template.xlsx');
      UI.toast('Sample template downloaded');
    }catch(e){ console.error(e); UI.toast('Could not generate template'); }
  },
  _num(v){
    if(v===undefined||v===null||v==='') return 0;
    if(typeof v==='number') return v;
    return Number(String(v).replace(/[₹,\s]/g,''))||0;
  },
  _date(v){
    if(!v) return '';
    if(v instanceof Date) return v.toISOString().slice(0,10);
    const s = String(v).trim();
    if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
    const m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
    if(m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
    return s;
  },
  async importExcel(file){
    if(!file) return;
    try{
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws);
      if(!rows.length){ UI.toast('No rows found in file'); return; }
      let count = 0;
      rows.forEach(r=>{
        const party = r['Party Name']||r.Party||r.party; if(!party) return;
        const invoiceNumber = String(r['Invoice Number']||r.InvoiceNumber||r.invoiceNumber||'').trim();
        const taxableValue = this._num(r['Taxable Value']||r.TaxableValue);
        const cgst = this._num(r.CGST||r.cgst);
        const sgst = this._num(r.SGST||r.sgst);
        const igst = this._num(r.IGST||r.igst);
        const roundOff = this._num(r['Round Off']||r.RoundOff);
        const amount = this._num(r['Invoice Amount']||r.Amount||r.amount);
        const dueAmount = this._num(r['Due Amount']||r.DueAmount||r.dueAmount);
        const amountPaid = Math.max(amount-dueAmount,0);
        let statusRaw = String(r['Payment Status']||r.Status||r.status||'Pending').trim().toLowerCase();
        let status = statusRaw==='paid' ? 'Paid' : 'Pending';
        if(dueAmount<=0 && amount>0) status='Paid';
        let companyName = String(r['Company Name']||r.CompanyName||r.companyName||r.Company||'').trim().toUpperCase();
        if(!DROPDOWNS.companyName.includes(companyName)){
          const match = DROPDOWNS.companyName.find(c=>companyName.includes(c) || c.includes(companyName));
          companyName = match || DROPDOWNS.companyName[0];
        }
        Store.data.payments.unshift({
          id: (Store.data.settings.payPrefix||'INV-')+String(Store.data.settings.payNext||1).padStart(4,'0'),
          customerId: '',
          companyName,
          product: String(r['Product']||r.Product||r.product||'').trim(),
          invoiceNumber,
          invoiceDate: this._date(r['Invoice Date']||r.InvoiceDate||r.invoiceDate)||Util.todayISO(),
          party: String(party),
          taxableValue, cgst, sgst, igst, roundOff,
          amount, amountPaid, dueAmount,
          contact: r.Contact||r.contact||'',
          phone: String(r.Phone||r.phone||''),
          followupDate: r.FollowupDate||r.followupDate||r['Follow-up Date']||'',
          response: r.Response||r.response||'',
          status
        });
        Store.data.settings.payNext=(Store.data.settings.payNext||1)+1;
        count++;
      });
      await Store.save('payments');
      await Store.save('settings');
      await Activity.log('Excel import', count+' invoice(s) imported from '+file.name);
      UI.toast(count+' invoice(s) imported');
      document.getElementById('payImportFile').value = '';
      Router.render('payments');
    }catch(e){ console.error(e); UI.toast('Import failed — check the file format'); }
  }
};

  _date(v){
    if(!v) return '';
    if(v instanceof Date) return v.toISOString().slice(0,10);
    const s = String(v).trim();
    if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
    const m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
    if(m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
    return s;
  },
  async importExcel(file){
    if(!file) return;
    try{
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array', cellDates:true});
      let count = 0;
      wb.SheetNames.forEach(sheetName=>{
        const ws = wb.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(ws);
        const sheetCompanyDefault = /llp/i.test(sheetName) ? 'LLP' : 'JAYS';
        rows.forEach(r=>{
          const gemcNumber = String(r['Order ID']||r.OrderID||r['GEM Number']||'').trim();
          const party = String(r['PANCHAYATH NAME']||r['Buyer Organization']||r.Party||'').trim();
          if(!gemcNumber && !party) return;
          let companyName = String(r['COMPANY NAME']||r.CompanyName||'').trim().toUpperCase();
          if(!DROPDOWNS.companyName.includes(companyName)) companyName = sheetCompanyDefault;
          const needUpdateRaw = String(r['NEED TO UPDATE']||'').trim().toLowerCase();
          const status = needUpdateRaw==='yes' ? 'Needs Update' : 'Updated';
          Store.data.gemcrac.unshift({
            id: Util.uid('GC', Store.data.gemcrac),
            customerId: '',
            companyName,
            party,
            gemcNumber,
            buyingMode: String(r['Buying Mode']||'DIRECT').trim().toUpperCase(),
            productName: String(r['Product Name']||'').trim(),
            orderDate: this._date(r['Order Date']),
            amount: Number(r['Order Value(Rs.)']||r['Order Value']||0)||0,
            qty: Number(r['Product Quantity']||0)||0,
            status,
            contact: '', phone: '', contactedDate: '',
            remark: String(r['REMARK']||'').trim()
          });
          count++;
        });
      });
      if(!count){ UI.toast('No rows found in file'); return; }
      await Store.save('gemcrac');
      await Activity.log('Excel import', count+' GEM CRAC row(s) imported from '+file.name);
      UI.toast(count+' row(s) imported');
      const inp = document.getElementById('gcImportFile'); if(inp) inp.value = '';
      Router.render('gemcrac');
    }catch(e){ console.error(e); UI.toast('Import failed — check the file format'); }
  },

  copyMessage(){

/* =====================================================================
   OUTSTANDING  (finance rollup of unpaid balances, by party)
===================================================================== */
const Outstanding = {
  render(){
    const pays = Store.data.payments;
    const today = Util.todayISO();
    const byParty = {};
    const aging = {b0_30:0, b31_60:0, b61_90:0, b90plus:0};
    pays.forEach(p=>{
      const due = Math.max((Number(p.amount)||0)-(Number(p.amountPaid)||0), 0);
      if(due<=0) return;
      const key = p.party || '—';
      if(!byParty[key]) byParty[key] = {party:key, due:0, overdue:0, invoices:0, phone:p.phone||p.contact||'',
        b0_30:0, b31_60:0, b61_90:0, b90plus:0};
      byParty[key].due += due;
      byParty[key].invoices += 1;
      if(p.followupDate && p.followupDate < today) byParty[key].overdue += due;
      if(p.followupDate){
        const days = Math.floor((new Date(today) - new Date(p.followupDate))/86400000);
        if(days>=0 && days<=30){ byParty[key].b0_30+=due; aging.b0_30+=due; }
        else if(days>30 && days<=60){ byParty[key].b31_60+=due; aging.b31_60+=due; }
        else if(days>60 && days<=90){ byParty[key].b61_90+=due; aging.b61_90+=due; }
        else if(days>90){ byParty[key].b90plus+=due; aging.b90plus+=due; }
      }
    });
    const rows = Object.values(byParty).sort((a,b)=>b.due-a.due);
    const totalOutstanding = rows.reduce((s,r)=>s+r.due,0);
    const totalOverdue = rows.reduce((s,r)=>s+r.overdue,0);

    document.getElementById('content').innerHTML = `
      ${dashboardCardsHTML('Outstanding Overview', [
        {label:'Total Outstanding', value:Util.fmtMoney(totalOutstanding), color:'var(--amber,#d97706)'},
        {label:'Overdue', value:Util.fmtMoney(totalOverdue), color:'var(--red,#dc2626)'},
        {label:'Parties with Dues', value:rows.length}
      ])}
      ${dashboardCardsHTML('Ageing (based on payment due date)', [
        {label:'0-30 Days', value:Util.fmtMoney(aging.b0_30), color:'var(--blue,#2563eb)'},
        {label:'31-60 Days', value:Util.fmtMoney(aging.b31_60), color:'var(--amber,#d97706)'},
        {label:'61-90 Days', value:Util.fmtMoney(aging.b61_90), color:'var(--orange,#ea580c)'},
        {label:'90+ Days', value:Util.fmtMoney(aging.b90plus), color:'var(--red,#dc2626)'}
      ])}
      <div class="card"><div class="table-wrap">
      ${rows.length ? `<table><thead><tr><th>Party</th><th>Phone</th><th>Open Invoices</th><th>Amount Due</th><th>0-30d</th><th>31-60d</th><th>61-90d</th><th>90+d</th><th></th></tr></thead><tbody>
        ${rows.map(r=>`<tr>
          <td class="cell-main">${Util.escapeHtml(r.party)}</td>
          <td class="cell-mute">${Util.escapeHtml(r.phone)}</td>
          <td class="cell-mute">${r.invoices}</td>
          <td class="mono">${Util.fmtMoney(r.due)}</td>
          <td class="mono cell-mute">${r.b0_30>0?Util.fmtMoney(r.b0_30):'—'}</td>
          <td class="mono" style="${r.b31_60>0?'color:var(--amber,#d97706);':''}">${r.b31_60>0?Util.fmtMoney(r.b31_60):'—'}</td>
          <td class="mono" style="${r.b61_90>0?'color:var(--orange,#ea580c);':''}">${r.b61_90>0?Util.fmtMoney(r.b61_90):'—'}</td>
          <td class="mono" style="${r.b90plus>0?'color:var(--red,#dc2626);font-weight:700;':''}">${r.b90plus>0?Util.fmtMoney(r.b90plus):'—'}</td>
          <td>${r.phone? `<a class="icon-btn" style="color:#25D366;text-decoration:none;" href="${Util.waLink(r.phone,'')}" target="_blank">&#128172;</a>`:''}</td>
        </tr>`).join('')}
      </tbody></table>` : `<div class="empty-state"><div class="ic">&#128176;</div><div class="t">No outstanding balances</div><div class="d">Everything is settled — nice work.</div></div>`}
      </div></div>

  }
};

/* =====================================================================
   GEM BID SEARCH & PARTICIPATION MANAGEMENT
   A workspace for finding, evaluating and tracking government
   procurement (GeM) bid opportunities through to Won/Lost. Bid data is
   entered manually or imported (no scraping/auth-bypass of GeM); each
   record supports a document checklist, notes/timeline, linked tasks,
   and — once Won — converting straight into an Order.
===================================================================== */
function bidMatch(bid){
  const text = ((bid.title||'')+' '+(bid.description||'')+' '+(bid.category||'')+' '+(bid.boqTitle||'')).toLowerCase();
  const excluded = (Store.data.settings.excludedBidKeywords||'').split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
  if(excluded.some(x=>x && text.includes(x))) return {score:0, matched:[]};
  const prodCats = [...new Set(Store.data.products.map(p=>p.category))].filter(Boolean).map(c=>c.toLowerCase());
  const prefKeywords = (Store.data.settings.preferredBidKeywords||'').split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
  const terms = [...new Set([...prodCats, ...prefKeywords])];
  if(!terms.length || !text.trim()) return {score:0, matched:[]};
  const matched = terms.filter(t=>t && text.includes(t));
  const score = Math.min(100, Math.round((matched.length / Math.min(terms.length,6)) * 100));
  return {score, matched};
}
function matchBadgeHTML(score){
  const cls = score>=80?'match-high':score>=50?'match-medium':'match-low';
  const label = score>=80?'High':score>=50?'Medium':'Low';
  return `<span class="match-badge ${cls}">${score}% ${label}</span>`;
}
function bidDeadlineInfo(endDate){
  if(!endDate) return {label:'No date', cls:'dl-ok', days:null};
  const diffDays = Math.ceil((new Date(endDate) - new Date(Util.todayISO())) / 86400000);
  if(diffDays < 0) return {label:'Closed', cls:'dl-over', days:diffDays};
  if(diffDays === 0) return {label:'Closes Today', cls:'dl-critical', days:diffDays};
  if(diffDays === 1) return {label:'Closes Tomorrow', cls:'dl-critical', days:diffDays};
  if(diffDays <= 3) return {label:`Closes in ${diffDays}d`, cls:'dl-soon', days:diffDays};
  return {label:`Closes in ${diffDays}d`, cls:'dl-ok', days:diffDays};
}
function bidDeadlineBadgeHTML(endDate){
  const d = bidDeadlineInfo(endDate);
  return `<span class="deadline-badge ${d.cls}">${d.label}</span>`;
}
function bidStatusColor(status){
  if(status==='Won') return 'var(--green,#16a34a)';
  if(status==='Lost'||status==='Cancelled') return 'var(--red,#dc2626)';
  if(['Submitted','Technical Evaluation','Financial Evaluation'].includes(status)) return 'var(--blue,#2563eb)';
  if(status==='Not Participating') return 'var(--text-mute,#6b7280)';
  return 'var(--amber,#d97706)';
}

  async save(id){
    const title = document.getElementById('b_title').value.trim();
    if(!title){ UI.toast('Bid Title is required'); return; }
    const g = (elId)=>document.getElementById(elId).value;
    const rec = id ? {...Store.data.bids.find(x=>x.id===id)} : {
      id: (Store.data.settings.bidPrefix||'BID-')+String(Store.data.settings.bidNext||1).padStart(4,'0'),
      checklist: DEFAULT_BID_CHECKLIST.map(name=>({name, done:false})),
      timeline: [], createdDate: Util.todayISO()
    };
    Object.assign(rec, {
      bidNumber:g('b_bidNumber').trim(), raNumber:g('b_raNumber').trim(), title, bidType:g('b_bidType'),
      category:g('b_category').trim(), boqTitle:g('b_boqTitle').trim(), description:g('b_description').trim(),
      ministry:g('b_ministry').trim(), department:g('b_department').trim(), organisation:g('b_organisation').trim(),
      buyerName:g('b_buyerName').trim(), consignee:g('b_consignee').trim(), state:g('b_state'), district:g('b_district').trim(), location:g('b_location').trim(),
      estimatedValue:Number(g('b_estimatedValue'))||0, emdAmount:Number(g('b_emdAmount'))||0, tenderFee:Number(g('b_tenderFee'))||0,
      securityDeposit:Number(g('b_securityDeposit'))||0, expectedMargin:Number(g('b_expectedMargin'))||0, ourQuote:Number(g('b_ourQuote'))||0,
      publishedDate:g('b_publishedDate'), startDate:g('b_startDate'), endDate:g('b_endDate'), openingDate:g('b_openingDate'),
      status:g('b_status'), assignedTo:g('b_assignedTo'), sourceUrl:g('b_sourceUrl').trim()
    });
    const isNew = !id;
    if(id){ const i=Store.data.bids.findIndex(x=>x.id===id); Store.data.bids[i]=rec; }
    else{
      rec.timeline.push({date:new Date().toISOString(), text:'Bid created', by:(Auth.session&&Auth.session.name)||'System'});
      Store.data.bids.unshift(rec);
      Store.data.settings.bidNext = (Store.data.settings.bidNext||1)+1;
      await Store.save('settings');
    }
    await Store.save('bids');
    await Activity.log(isNew?'Bid saved':'Bid updated', rec.bidNumber||rec.title);
    UI.closeModal(); UI.toast('Saved'); Router.render('bidsearch');
  },
  async remove(id){
    if(!confirm('Delete this bid record?')) return;
    const b = Store.data.bids.find(x=>x.id===id);

    await Store.save('bids');

/* =====================================================================
   RATE / OFFER PDF GENERATOR  (namespace: RatePDF)
   Customer -> Items -> Optional GST -> Terms -> Preview -> PDF.

   Collections (shared key/value store, so they inherit the existing RLS,
   backup/restore and overwrite-protection):
     Store.data.rateTemplates (jays_ratetemplates) - reusable item templates
     Store.data.rateDocs      (jays_ratedocs)      - saved documents + revisions
     Store.data.rateTerms     (jays_rateterms)     - Terms & Conditions library

   GST RULE: gstEnabled defaults to FALSE. When false, no GST column is
   rendered in the UI or the PDF and no GST figure is computed or stored.
   TEMPLATE RULE: applying a template COPIES it into the draft item. The
   stored template is only written by an explicit "Update Template".
===================================================================== */
const RATE_DOC_TYPES = ['Rate Offer','Commercial Offer','Budgetary Quotation','Product Proposal','Government Offer','Price Estimate'];
/* Extended lifecycle, added alongside (never replacing) the original
   four statuses - existing Draft/Generated/Final/Cancelled records are
   untouched and remain perfectly valid; documents can now also move
   through the fuller sales-tracking states below. */
const RATE_DOC_STATUSES = ['Draft','Generated','Sent','Viewed','Negotiation','Accepted','Rejected','Expired','Final','Cancelled'];
const RATE_THEMES = ['Corporate','Modern','Government Procurement','Minimal','Premium'];
const RATE_THEME_COLORS = {
  'Corporate':[194,65,12], 'Modern':[37,99,235], 'Government Procurement':[22,101,52],
  'Minimal':[55,65,81], 'Premium':[91,33,182]
};
const DEFAULT_RATE_TERMS = [
  {title:'Price Validity', body:'Prices are valid for 15 days from the date of this offer.'},
  {title:'Delivery Period', body:'Delivery within 2-3 weeks from the date of confirmed order.'},
  {title:'Payment Terms', body:'100% payment against delivery unless otherwise agreed in writing.'},
  {title:'Warranty', body:'Standard manufacturer warranty applies to all supplied items.'},
  {title:'Taxes', body:'Taxes extra as applicable unless explicitly included above.'}
];

const RatePDF = {
  draft: null,

  /* ---------------- draft model ---------------- */
  blankItem(){
    return {
      uid: 'I' + Date.now() + Math.floor(Math.random()*1000),
      templateId:'', itemName:'', brand:'', model:'', category:'',
      specs:'', qty:1, unit:'Nos', rate:'', discount:'',
      gstRate:'', imageUrl:'', imageSize:0
    };
  },
  blankDraft(){
    const s = Store.data.settings || {};
    const days = Number(s.defaultValidityDays)||15;
    const validTo = new Date(Date.now() + days*86400000).toISOString().slice(0,10);
    return {
      id:'', revision:0, parentId:'', status:'Draft',
      docType:'Rate Offer', theme:'Corporate',
      docNumber:'', docDate: Util.todayISO(), validUntil: validTo,
      reference:'', customerRef:'', subject:'',
      salesperson: (Auth.session && (Auth.session.name||Auth.session.username)) || '',
      customerId:'', customerName:'', contactPerson:'', phone:'', email:'',
      address:'', district:'', gstin:'',
      items:[ this.blankItem() ],
      // GST is OFF unless the user turns it on.
      gstEnabled: !!(s.defaultGstEnabled),
      gstMode:'exclusive', gstScope:'intra', gstRate: Number(s.defaultGstRate)||18,
      termIds:[], extraNotes:'',
      // Structured "Additional Information" - dynamic on the PDF: a field
      // only ever appears there when the user has actually filled it in.
      paymentTerms:'', deliveryTerms:'', warranty:'', gstNote:'',
      createdBy:(Auth.session && (Auth.session.name||Auth.session.username)) || 'System',
      createdAt:'', updatedAt:''
    };
  },

  /* ---------------- money maths ----------------
     Every figure here is derived. When gstEnabled is false the function
     returns zeroed tax fields and callers simply never render them. */
  num(v){ const n = Number(v); return isFinite(n) ? n : 0; },
  itemBase(it){ return Math.max(this.num(it.qty)*this.num(it.rate) - this.num(it.discount), 0); },
  itemGstRate(it){
    const d = this.draft;
    if(!d.gstEnabled) return 0;
    return it.gstRate === '' || it.gstRate === null || it.gstRate === undefined
      ? this.num(d.gstRate) : this.num(it.gstRate);
  },
  totals(){
    const d = this.draft;
    let gross = 0, discount = 0, taxable = 0, tax = 0;
    d.items.forEach(it=>{
      gross    += this.num(it.qty) * this.num(it.rate);
      discount += this.num(it.discount);
      const base = this.itemBase(it);
      if(!d.gstEnabled){ taxable += base; return; }
      const r = this.itemGstRate(it);
      if(d.gstMode === 'inclusive'){
        const net = base / (1 + r/100);
        taxable += net; tax += base - net;
      } else {
        taxable += base; tax += base * r/100;
      }
    });
    const t = {
      gross, discount, taxable, tax,
      cgst: 0, sgst: 0, igst: 0,
      grand: d.gstEnabled ? taxable + tax : taxable
    };
    if(d.gstEnabled){
      if(d.gstScope === 'inter') t.igst = tax;
      else { t.cgst = tax/2; t.sgst = tax/2; }
    }
    return t;
  },
  money(n){ return Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2, maximumFractionDigits:2}); },
  rupee(n){ return '\u20B9' + this.money(n); },
  fmtBytes(n){
    n = Number(n)||0;
    if(!n) return '';
    return n >= 1024*1024 ? (n/1024/1024).toFixed(2)+' MB' : Math.round(n/1024)+' KB';
  },

  /* Indian-system amount in words (lakh / crore). */
  words(amount){
    const ones = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve',
      'Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
    const tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
    const two = n => n < 20 ? ones[n] : (tens[Math.floor(n/10)] + (n%10 ? ' ' + ones[n%10] : ''));
    const three = n => (n >= 100 ? ones[Math.floor(n/100)] + ' Hundred' + (n%100 ? ' ' + two(n%100) : '') : two(n));
    let n = Math.floor(Math.abs(Number(amount)||0));
    const paise = Math.round((Math.abs(Number(amount)||0) - n) * 100);
    if(n === 0 && !paise) return 'Zero Rupees Only';
    let out = '';
    const crore = Math.floor(n/10000000); n %= 10000000;
    const lakh  = Math.floor(n/100000);   n %= 100000;
    const thou  = Math.floor(n/1000);     n %= 1000;
    if(crore) out += three(crore) + ' Crore ';
    if(lakh)  out += three(lakh)  + ' Lakh ';
    if(thou)  out += three(thou)  + ' Thousand ';
    if(n)     out += three(n);
    out = out.trim() + ' Rupees';
    if(paise) out += ' and ' + two(paise) + ' Paise';
    return out.replace(/\s+/g,' ') + ' Only';
  },

  /* ---------------- field updates (targeted re-render keeps focus) ---------------- */
  upd(field, val){ this.draft[field] = val; this.refreshTotals(); },
  updItem(uid, field, val){
    const it = this.draft.items.find(x=>x.uid===uid);

    this.refreshTotals();

  addItem(){ this.draft.items.push(this.blankItem()); this.render(); },
  removeItem(uid){
    if(this.draft.items.length <= 1){ UI.toast('A document needs at least one item'); return; }
    this.draft.items = this.draft.items.filter(x=>x.uid!==uid);
    this.render();
  },
  moveItem(uid, dir){
    const i = this.draft.items.findIndex(x=>x.uid===uid);
    const j = i + dir;
    if(i<0 || j<0 || j>=this.draft.items.length) return;
    const a = this.draft.items;
    [a[i], a[j]] = [a[j], a[i]];
    this.render();
  },
  toggleGst(on){
    this.draft.gstEnabled = !!on;          // OFF => nothing GST is computed or shown
    this.render();

  refreshTotals(){
    const box = document.getElementById('rpTotals');

  },
  totalsHTML(){
    const d = this.draft, t = this.totals();
    const row = (label, val, strong)=>
      '<div style="display:flex;justify-content:space-between;padding:3px 0;' + (strong?'font-weight:700;border-top:1.5px solid var(--border);margin-top:4px;padding-top:6px;':'') + '">' +
      '<span>' + Util.escapeHtml(label) + '</span><span class="mono">' + this.rupee(val) + '</span></div>';
    let h = row('Subtotal', t.gross);
    if(t.discount > 0) h += row('Discount', -t.discount);
    if(d.gstEnabled){
      h += row('Taxable Amount', t.taxable);
      if(d.gstScope === 'inter') h += row('IGST', t.igst);
      else { h += row('CGST', t.cgst); h += row('SGST', t.sgst); }
    }
    h += row('Grand Total', t.grand, true);
    h += '<div class="hint" style="margin-top:8px;font-style:italic;">' + Util.escapeHtml(this.words(t.grand)) + '</div>';
    return h;
  },
