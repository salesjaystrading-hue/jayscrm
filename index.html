<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAYS CRM PRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#0B1E33;
    --navy-2:#122B47;
    --navy-3:#1B3A5C;
    --accent:#0E9F76;
    --accent-dark:#0B7A5C;
    --accent-light:#E4F6EF;
    --amber:#E8A33D;
    --amber-light:#FCF1DD;
    --red:#D9534F;
    --red-light:#FBEAE9;
    --blue:#3B82C4;
    --blue-light:#E8F1FA;
    --bg:#F3F6F9;
    --card:#FFFFFF;
    --text:#152234;
    --text-mute:#66768C;
    --border:#E3E9F0;
    --radius:10px;
    --shadow: 0 1px 2px rgba(15,35,60,0.06), 0 1px 12px rgba(15,35,60,0.04);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    font-size:14px;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:14px;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:8px;}

  /* ---------- LOGIN ---------- */
  #loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at 20% 20%, #14345690 0%, transparent 45%), linear-gradient(160deg, var(--navy) 0%, #0A1626 100%);
    padding:20px;
  }
  .login-card{
    width:100%;max-width:380px;
    background:var(--card);
    border-radius:16px;
    padding:36px 32px 32px;
    box-shadow:0 30px 60px rgba(0,0,0,0.35);
  }
  .brand-mark{
    width:52px;height:52px;border-radius:14px;
    background:linear-gradient(135deg, var(--accent), var(--accent-dark));
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:20px;letter-spacing:-0.5px;
    margin-bottom:16px;
    box-shadow:0 8px 20px rgba(14,159,118,0.35);
  }
  .login-card h1{font-size:19px;margin:0 0 2px;font-weight:800;letter-spacing:-0.3px;}
  .login-card p.sub{color:var(--text-mute);margin:0 0 24px;font-size:13px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--text-mute);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.4px;}
  .field input, .field select, .field textarea{
    width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;
    background:#fbfcfe;outline:none;transition:border-color .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent);background:#fff;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:10px 16px;border-radius:8px;border:none;font-weight:600;font-size:13.5px;
    transition:transform .06s, filter .15s;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-block{width:100%;}
  .btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--text);}
  .btn-outline:hover{border-color:var(--accent);color:var(--accent-dark);}
  .btn-danger{background:var(--red-light);color:var(--red);}
  .btn-danger:hover{background:var(--red);color:#fff;}
  .btn-sm{padding:6px 10px;font-size:12.5px;border-radius:6px;}
  .btn-wa{background:#25D366;color:#fff;}
  .btn-wa:hover{filter:brightness(1.06);}
  .login-error{background:var(--red-light);color:var(--red);padding:9px 12px;border-radius:8px;font-size:12.5px;margin-bottom:14px;display:none;}
  .demo-note{margin-top:18px;font-size:11.5px;color:var(--text-mute);text-align:center;line-height:1.6;background:#F7F9FB;border:1px dashed var(--border);border-radius:8px;padding:10px;}

  /* ---------- APP SHELL ---------- */
  #appScreen{display:none;height:100vh;}
  .shell{display:flex;height:100vh;overflow:hidden;}
  .sidebar{
    width:230px;flex-shrink:0;background:var(--navy);color:#cfe0ef;
    display:flex;flex-direction:column;padding:18px 12px;
  }
  .side-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 20px;}
  .side-brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px;flex-shrink:0;}
  .side-brand .name{font-weight:800;font-size:13.5px;color:#fff;line-height:1.25;}
  .side-brand .name span{display:block;font-weight:500;font-size:10.5px;color:#7d93ab;text-transform:uppercase;letter-spacing:0.5px;}
  .nav{flex:1;overflow-y:auto;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;
    font-size:13px;font-weight:500;color:#a9bdd2;margin-bottom:2px;cursor:pointer;
    transition:background .12s,color .12s;
  }
  .nav-item:hover{background:var(--navy-2);color:#fff;}
  .nav-item.active{background:var(--accent);color:#fff;font-weight:600;}
  .nav-item .ic{width:18px;text-align:center;font-size:14px;}
  .nav-section-label{font-size:10px;text-transform:uppercase;letter-spacing:0.7px;color:#5f7590;padding:14px 12px 6px;font-weight:700;}
  .side-foot{padding-top:12px;border-top:1px solid var(--navy-3);margin-top:8px;}
  .user-pill{display:flex;align-items:center;gap:9px;padding:8px;border-radius:8px;background:var(--navy-2);}
  .user-pill .av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex-shrink:0;}
  .user-pill .info{overflow:hidden;flex:1;}
  .user-pill .info .n{font-size:12.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .user-pill .info .r{font-size:10.5px;color:#8fa4ba;}
  .user-pill .logout{background:none;border:none;color:#8fa4ba;font-size:15px;padding:4px;}
  .user-pill .logout:hover{color:#fff;}

  .main-col{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{
    height:58px;flex-shrink:0;background:#fff;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;padding:0 22px;
  }
  .topbar h2{font-size:16px;margin:0;font-weight:700;letter-spacing:-0.2px;}
  .topbar .sub{font-size:11.5px;color:var(--text-mute);margin-top:1px;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .content{flex:1;overflow-y:auto;padding:22px;}

  /* ---------- CARDS / GRID ---------- */
  .grid{display:grid;gap:16px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-2{grid-template-columns:2fr 1fr;}
  @media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
  .card-pad{padding:18px 18px;}
  .card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);}
  .card-head h3{margin:0;font-size:14px;font-weight:700;}
  .card-head .hint{font-size:11.5px;color:var(--text-mute);}

  .stat-card{padding:18px;position:relative;overflow:hidden;}
  .stat-card .lbl{font-size:11.5px;color:var(--text-mute);font-weight:600;text-transform:uppercase;letter-spacing:0.4px;}
  .stat-card .val{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-0.5px;}
  .stat-card .delta{font-size:11.5px;margin-top:6px;color:var(--text-mute);}
  .stat-card .bar{position:absolute;left:0;top:0;bottom:0;width:4px;}
  .bar-green{background:var(--accent);}
  .bar-amber{background:var(--amber);}
  .bar-red{background:var(--red);}
  .bar-blue{background:var(--blue);}

  /* ---------- TABLE ---------- */
  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:left;padding:10px 14px;font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;
    color:var(--text-mute);border-bottom:1px solid var(--border);background:#FAFBFD;white-space:nowrap;font-weight:700;
  }
  tbody td{padding:10px 14px;border-bottom:1px solid #F0F3F7;vertical-align:middle;white-space:nowrap;}
  tbody tr:hover{background:#FAFCFE;}
  tbody tr:last-child td{border-bottom:none;}
  .cell-main{font-weight:600;color:var(--text);}
  .cell-mute{color:var(--text-mute);font-size:12.5px;}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
  .badge-green{background:var(--accent-light);color:var(--accent-dark);}
  .badge-amber{background:var(--amber-light);color:#9A6B12;}
  .badge-red{background:var(--red-light);color:var(--red);}
  .badge-blue{background:var(--blue-light);color:var(--blue);}
  .badge-gray{background:#EEF1F5;color:#5B6B80;}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

  .toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .toolbar .search{position:relative;flex:1;min-width:180px;max-width:280px;}
  .toolbar .search input{width:100%;padding:8px 12px 8px 30px;border:1.5px solid var(--border);border-radius:8px;background:#fff;}
  .toolbar .search .ic{position:absolute;left:10px;top:9px;color:var(--text-mute);font-size:12px;}
  .toolbar select{padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;background:#fff;color:var(--text-mute);font-size:12.5px;}
  .toolbar-spacer{flex:1;}
  .icon-btn{width:30px;height:30px;border-radius:7px;border:1.5px solid var(--border);background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--text-mute);}
  .icon-btn:hover{border-color:var(--accent);color:var(--accent-dark);}

  .empty-state{padding:52px 20px;text-align:center;color:var(--text-mute);}
  .empty-state .ic{font-size:34px;margin-bottom:10px;opacity:.6;}
  .empty-state .t{font-weight:700;color:var(--text);font-size:14px;margin-bottom:4px;}
  .empty-state .d{font-size:12.5px;max-width:340px;margin:0 auto 14px;}

  /* ---------- MODAL ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(10,20,35,0.45);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 30px 70px rgba(0,0,0,0.3);}
  .modal.wide{max-width:760px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:2;}
  .modal-head h3{margin:0;font-size:15.5px;font-weight:700;}
  .modal-close{background:none;border:none;font-size:18px;color:var(--text-mute);padding:4px 8px;border-radius:6px;}
  .modal-close:hover{background:#F1F4F8;}
  .modal-body{padding:20px 22px;}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:#fff;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:560px){.form-row{grid-template-columns:1fr;}}

  .toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,0.25);z-index:200;display:none;align-items:center;gap:8px;}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;}
  .tab-btn{padding:9px 14px;font-size:13px;font-weight:600;color:var(--text-mute);background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab-btn.active{color:var(--accent-dark);border-color:var(--accent);}

  .drawer-overlay{position:fixed;inset:0;background:rgba(10,20,35,0.4);display:none;z-index:100;}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;background:#fff;box-shadow:-10px 0 40px rgba(0,0,0,0.2);overflow-y:auto;z-index:101;}
  @media(max-width:900px){.drawer{width:100%;}}

  .chart-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;}
  .chart-legend .li{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-mute);}
  .chart-legend .sw{width:9px;height:9px;border-radius:2px;}

  .kpi-row{display:flex;gap:8px;flex-wrap:wrap;}
  .quo-line{display:grid;grid-template-columns:2.4fr 0.8fr 0.9fr 0.9fr auto;gap:8px;margin-bottom:8px;align-items:center;}
  @media(max-width:560px){.quo-line{grid-template-columns:1fr;}}

  .print-only{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute;top:0;left:0;width:100%;padding:24px;}
    .print-only{display:block;}
  }

  @media(max-width:880px){
    .sidebar{position:fixed;left:-240px;top:0;bottom:0;z-index:90;transition:left .2s;}
    .sidebar.open{left:0;}
    .content{padding:14px;}
    .grid-4{grid-template-columns:repeat(2,1fr);}
    .topbar{padding:0 12px;}
  }
  .menu-toggle{display:none;background:none;border:1.5px solid var(--border);border-radius:8px;width:34px;height:34px;font-size:15px;}
  @media(max-width:880px){.menu-toggle{display:inline-flex;align-items:center;justify-content:center;}}

  textarea{resize:vertical;min-height:70px;}
  label.chk{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="loginScreen">
  <div class="login-card">
    <div class="brand-mark">JT</div>
    <h1>JAYS CRM PRO</h1>
    <p class="sub">Jays Trading and Business Solution</p>
    <div class="login-error" id="loginError">Incorrect username or password.</div>
    <div class="field">
      <label>Username</label>
      <input id="loginUser" type="text" placeholder="e.g. admin" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-primary btn-block" onclick="Auth.login()">Sign in</button>
    <div class="demo-note">Demo logins &mdash; Admin: <b>admin / admin123</b><br>Sales: <b>sales1 / Najiya</b></div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="appScreen">
  <div class="shell">
    <div class="sidebar" id="sidebar">
      <div class="side-brand">
        <div class="mark">JT</div>
        <div class="name">JAYS CRM PRO<span>Trading &amp; Business Solution</span></div>
      </div>
      <div class="nav" id="navList"></div>
      <div class="side-foot">
        <div class="user-pill">
          <div class="av" id="userAvatar">A</div>
          <div class="info">
            <div class="n" id="userName">Admin</div>
            <div class="r" id="userRole">Admin</div>
          </div>
          <button class="logout" title="Sign out" onclick="Auth.logout()">&#9211;</button>
        </div>
      </div>
    </div>

    <div class="main-col">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:10px;">
          <button class="menu-toggle" onclick="UI.toggleSidebar()">&#9776;</button>
          <div>
            <h2 id="pageTitle">Dashboard</h2>
            <div class="sub" id="pageSub">Overview of your business</div>
          </div>
        </div>
        <div class="topbar-right">
          <button class="btn btn-outline btn-sm" onclick="UI.exportCurrentView()">&#128228; Export Excel</button>
        </div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>
</div>

<!-- ===================== MODAL / DRAWER / TOAST ===================== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox">
    <div class="modal-head">
      <h3 id="modalTitle">Title</h3>
      <button class="modal-close" onclick="UI.closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div class="drawer-overlay" id="drawerOverlay" onclick="UI.closeDrawer(event)">
  <div class="drawer" id="drawerBox" onclick="event.stopPropagation()"></div>
</div>

<div class="toast" id="toast"></div>
<div id="printArea" class="print-only"></div>

const Util = {
  uid(prefix, arr){
    let n = arr.length + 1;
    let id;
    do{ id = prefix + String(n).padStart(3,'0'); n++; } while(arr.some(x=>x.id===id));
    return id;
  },
  todayISO(){ return new Date().toISOString().slice(0,10); },
  fmtDate(d){
    if(!d) return '<span class="cell-mute">&mdash;</span>';
    const dt = new Date(d+'T00:00:00');
    if(isNaN(dt)) return d;
    return dt.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
  },
  fmtMoney(n){
    n = Number(n)||0;
    return '&#8377;' + n.toLocaleString('en-IN', {maximumFractionDigits:0});
  },
  escapeHtml(s){
    if(s===null||s===undefined) return '';
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  },
  waLink(phone, msg){
    let digits = (phone||'').toString().replace(/\D/g,'');
    if(digits.length===10) digits = (Store.data.settings.whatsappCC||'91') + digits;
    return 'https://wa.me/'+digits+(msg? ('?text='+encodeURIComponent(msg)) : '');
  },
  daysUntil(dateStr){
    if(!dateStr) return null;
    const d = new Date(dateStr+'T00:00:00');
    const t = new Date(); t.setHours(0,0,0,0);
    return Math.round((d-t)/86400000);
  },
  csvSafe(v){ return v===undefined||v===null? '' : v; }
};

        const match = Store.data.users.find(x=>x.username===uname);
        if(match){ this.session = match; return true; }

    return false;

/* =====================================================================
   SMALL CHART HELPERS (pure SVG, no deps)
===================================================================== */
const Chart = {
  colors: ['#0E9F76','#3B82C4','#E8A33D','#D9534F','#8B5CF6','#14B8A6','#F472B6','#64748B'],
  donut(data, size){
    size = size||150;
    const total = data.reduce((s,d)=>s+d.value,0) || 1;
    const r = size/2 - 14, cx=size/2, cy=size/2, circ = 2*Math.PI*r;
    let offset = 0, segs='';
    data.forEach((d,i)=>{
      const frac = d.value/total;
      const dash = frac*circ;
      segs += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${this.colors[i%this.colors.length]}" stroke-width="18"
        stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
      offset += dash;
    });
    let legend = '<div class="chart-legend">' + data.map((d,i)=>`<div class="li"><span class="sw" style="background:${this.colors[i%this.colors.length]}"></span>${Util.escapeHtml(d.label)} (${d.value})</div>`).join('') + '</div>';
    return `<div style="display:flex;flex-direction:column;align-items:center;">
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#EEF1F5" stroke-width="18"/>
        ${segs}
        <text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="20" font-weight="800" fill="#152234">${total}</text>
        <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="9" fill="#66768C">TOTAL</text>
      </svg>${legend}</div>`;
  },
  bars(data, height){
    height = height||150;
    const max = Math.max(...data.map(d=>d.value), 1);
    const w = 100/data.length;
    let bars = data.map((d,i)=>{
      const h = Math.max((d.value/max)*(height-30), 2);
      const color = this.colors[i%this.colors.length];
      return `<div style="display:flex;flex-direction:column;align-items:center;flex:1;min-width:0;">
        <div style="font-size:11px;font-weight:700;color:#152234;margin-bottom:4px;">${d.value}</div>
        <div style="width:70%;height:${h}px;background:${color};border-radius:5px 5px 0 0;"></div>
        <div style="font-size:10px;color:#66768C;margin-top:6px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;" title="${Util.escapeHtml(d.label)}">${Util.escapeHtml(d.label)}</div>
      </div>`;
    }).join('');
    return `<div style="display:flex;align-items:flex-end;gap:10px;height:${height}px;padding-top:10px;">${bars}</div>`;
  }
};

/* =====================================================================
   CUSTOMERS  (+ Leads = filtered view)
===================================================================== */
const Customers = {
  filters: {q:'', status:'', district:'', assignedTo:''},
  filtered(list){
    const f = this.filters;
    return list.filter(x=>{
      if(f.q){
        const q=f.q.toLowerCase();
        if(!( (x.name||'').toLowerCase().includes(q) || (x.phone||'').includes(q) || (x.panchayath||'').toLowerCase().includes(q) )) return false;
      }
      if(f.status && x.status!==f.status) return false;
      if(f.district && x.district!==f.district) return false;
      if(f.assignedTo && x.assignedTo!==f.assignedTo) return false;
      return true;
    });
  },
  render(mode){ // mode: 'customers' | 'leads'
    const isLeads = mode==='leads';
    let base = Store.data.customers;
    if(isLeads) base = base.filter(x=>x.status==='New lead' || !x.status);
    const list = this.filtered(base);
    const districts = [...new Set(Store.data.customers.map(x=>x.district).filter(Boolean))].sort();

    document.getElementById('content').innerHTML = `
      <div class="toolbar">
        <div class="search"><span class="ic">&#128269;</span><input placeholder="Search name, phone, area..." value="${Util.escapeHtml(this.filters.q)}" oninput="Customers.filters.q=this.value; Customers.render('${mode}')"></div>
        ${!isLeads ? `<select onchange="Customers.filters.status=this.value; Customers.render('${mode}')">${selectOptions(DROPDOWNS.status, this.filters.status)}</select>` : ''}
        <select onchange="Customers.filters.district=this.value; Customers.render('${mode}')">${selectOptions(districts, this.filters.district)}</select>
        <select onchange="Customers.filters.assignedTo=this.value; Customers.render('${mode}')">${selectOptions(DROPDOWNS.assignedTo, this.filters.assignedTo)}</select>
        <div class="toolbar-spacer"></div>
        <span class="cell-mute" style="font-size:12px;">${list.length} of ${base.length}</span>
        <button class="btn btn-primary btn-sm" onclick="Customers.openForm(null,'${mode}')">&#65291; ${isLeads?'Add Lead':'Add Customer'}</button>
      </div>
      <div class="card">
        <div class="table-wrap">
          ${list.length ? `<table><thead><tr>
            <th>ID</th><th>Name</th><th>Phone</th><th>District / Area</th><th>Source</th><th>Assigned</th><th>Status</th><th>Last Contact</th><th></th>
          </tr></thead><tbody>
          ${list.map(x=>`<tr>
            <td class="mono cell-mute">${x.id}</td>
            <td class="cell-main" style="cursor:pointer;" onclick="Customers.openDetail('${x.id}')">${Util.escapeHtml(x.name)}</td>
            <td class="mono">${Util.escapeHtml(x.phone)}</td>
            <td class="cell-mute">${Util.escapeHtml(x.panchayath||'')}${x.district? ', '+Util.escapeHtml(x.district):''}</td>
            <td class="cell-mute">${Util.escapeHtml(x.source||'—')}</td>
            <td class="cell-mute">${Util.escapeHtml(x.assignedTo||'—')}</td>
            <td>${statusBadge(x.status||'New lead')}</td>
            <td class="cell-mute">${Util.fmtDate(x.lastContact)}</td>
            <td style="display:flex;gap:5px;">
              <a class="icon-btn btn-wa" style="text-decoration:none;" title="WhatsApp" href="${Util.waLink(x.phone,'Hi '+x.name+', this is Jays Trading and Business Solution.')}" target="_blank">&#128172;</a>
              <button class="icon-btn" title="Edit" onclick="Customers.openForm('${x.id}','${mode}')">&#9998;</button>
              <button class="icon-btn" title="Delete" onclick="Customers.remove('${x.id}')">&#128465;</button>
            </td>
          </tr>`).join('')}
          </tbody></table>` : `<div class="empty-state"><div class="ic">&#128101;</div><div class="t">No ${isLeads?'leads':'customers'} found</div><div class="d">Try clearing filters, or add a new ${isLeads?'lead':'customer'} to get started.</div>
          <button class="btn btn-primary btn-sm" onclick="Customers.openForm(null,'${mode}')">&#65291; ${isLeads?'Add Lead':'Add Customer'}</button></div>`}
        </div>
      </div>
    `;
  },
  openForm(id, mode){
    const rec = id ? Store.data.customers.find(x=>x.id===id) : null;
    const v = rec || {name:'',phone:'',email:'',district:'',panchayath:'',source:'',assignedTo:'',status: mode==='leads'?'New lead':'Called', lastContact: Util.todayISO()};
    UI.openModal(rec? 'Edit Customer' : (mode==='leads'?'Add Lead':'Add Customer'), `
      <div class="form-row">
        <div class="field"><label>Full Name *</label><input id="f_name" value="${Util.escapeHtml(v.name)}"></div>
        <div class="field"><label>Phone *</label><input id="f_phone" value="${Util.escapeHtml(v.phone)}"></div>
      </div>
      <div class="form-row">
        <div class="field"><label>Email</label><input id="f_email" value="${Util.escapeHtml(v.email)}"></div>
        <div class="field"><label>District</label><input id="f_district" list="dl_district" value="${Util.escapeHtml(v.district)}"></div>
      </div>
      <div class="form-row">
        <div class="field"><label>Area / Panchayath</label><input id="f_panchayath" value="${Util.escapeHtml(v.panchayath)}"></div>
        <div class="field"><label>Lead Source</label><select id="f_source">${selectOptions(DROPDOWNS.source, v.source)}</select></div>
      </div>
      <div class="form-row">
        <div class="field"><label>Assigned To</label><select id="f_assignedTo">${selectOptions(DROPDOWNS.assignedTo, v.assignedTo)}</select></div>
        <div class="field"><label>Status</label><select id="f_status">${DROPDOWNS.status.map(s=>`<option ${s===v.status?'selected':''}>${s}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label>Last Contact Date</label><input type="date" id="f_lastContact" value="${v.lastContact||''}"></div>
      <datalist id="dl_district">${DROPDOWNS.district.map(d=>`<option value="${d}">`).join('')}</datalist>
    `, `
      <button class="btn btn-outline" onclick="UI.closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="Customers.save('${id||''}')">Save</button>
    `);
  },
  async save(id){
    const name = document.getElementById('f_name').value.trim();
    const phone = document.getElementById('f_phone').value.trim();
    if(!name || !phone){ UI.toast('Name and phone are required'); return; }
    const rec = {
      id: id || Util.uid('C', Store.data.customers),
      name, phone,
      email: document.getElementById('f_email').value.trim(),
      district: document.getElementById('f_district').value.trim(),
      panchayath: document.getElementById('f_panchayath').value.trim(),
      source: document.getElementById('f_source').value,
      assignedTo: document.getElementById('f_assignedTo').value,
      status: document.getElementById('f_status').value,
      lastContact: document.getElementById('f_lastContact').value,
      closedDate: (id && Store.data.customers.find(x=>x.id===id).closedDate) || '',
      referralDate: (id && Store.data.customers.find(x=>x.id===id).referralDate) || ''
    };
    if(rec.status==='Closed' && !rec.closedDate) rec.closedDate = Util.todayISO();
    if(id){
      const idx = Store.data.customers.findIndex(x=>x.id===id);
      Store.data.customers[idx] = rec;
    } else {
      Store.data.customers.unshift(rec);
    }
    await Store.save('customers');
    UI.closeModal();
    UI.toast('Saved');
    Router.render(UI.currentView);
  },
  async remove(id){
    if(!confirm('Delete this record? This cannot be undone.')) return;
    Store.data.customers = Store.data.customers.filter(x=>x.id!==id);
    await Store.save('customers');
    UI.toast('Deleted');
    Router.render(UI.currentView);
  },
  openDetail(id){
    const x = Store.data.customers.find(c=>c.id===id);
    if(!x) return;
    const relatedPayments = Store.data.payments.filter(p=>p.customerId===id);
    const relatedFollowups = Store.data.followups.filter(f=>f.customerId===id);
    const relatedQuotes = Store.data.quotations.filter(q=>q.customerId===id);
    UI.openDrawer(`
      <div style="padding:22px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div>
            <div style="font-size:17px;font-weight:800;">${Util.escapeHtml(x.name)}</div>
            <div class="cell-mute mono" style="margin-top:2px;">${x.id}</div>
          </div>
          <button class="modal-close" onclick="UI.closeDrawer()">&times;</button>
        </div>
        <div style="margin:14px 0;">${statusBadge(x.status||'New lead')}</div>
        <div class="card card-pad" style="margin-bottom:14px;">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px;">
            <div><div class="cell-mute" style="font-size:11px;">PHONE</div><div class="mono">${Util.escapeHtml(x.phone)}</div></div>
            <div><div class="cell-mute" style="font-size:11px;">EMAIL</div><div>${Util.escapeHtml(x.email||'—')}</div></div>
            <div><div class="cell-mute" style="font-size:11px;">DISTRICT</div><div>${Util.escapeHtml(x.district||'—')}</div></div>
            <div><div class="cell-mute" style="font-size:11px;">AREA</div><div>${Util.escapeHtml(x.panchayath||'—')}</div></div>
            <div><div class="cell-mute" style="font-size:11px;">SOURCE</div><div>${Util.escapeHtml(x.source||'—')}</div></div>
            <div><div class="cell-mute" style="font-size:11px;">ASSIGNED TO</div><div>${Util.escapeHtml(x.assignedTo||'—')}</div></div>
          </div>
          <div style="display:flex;gap:8px;margin-top:14px;">
            <a class="btn btn-wa btn-sm" style="text-decoration:none;flex:1;" href="${Util.waLink(x.phone,'Hi '+x.name+', this is Jays Trading and Business Solution.')}" target="_blank">&#128172; WhatsApp</a>
            <a class="btn btn-outline btn-sm" style="text-decoration:none;flex:1;text-align:center;" href="tel:${x.phone}">&#128222; Call</a>
          </div>
        </div>

        <h4 style="font-size:12.5px;text-transform:uppercase;color:var(--text-mute);margin:16px 0 8px;">Quick Actions</h4>
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;">
          <button class="btn btn-outline btn-sm" onclick="Followups.openForm(null,'${x.id}')">&#128197; Schedule Follow-up</button>
          <button class="btn btn-outline btn-sm" onclick="Quotations.openForm(null,'${x.id}')">&#128196; New Quotation</button>
          <button class="btn btn-outline btn-sm" onclick="Payments.openForm(null,'${x.id}')">&#128179; Log Payment / Invoice</button>
        </div>

        <h4 style="font-size:12.5px;text-transform:uppercase;color:var(--text-mute);margin:16px 0 8px;">History</h4>
        <div style="font-size:12.5px;">
          <div class="cell-mute" style="margin-bottom:4px;">${relatedQuotes.length} quotation(s) &middot; ${relatedPayments.length} invoice(s) &middot; ${relatedFollowups.length} follow-up(s)</div>
        </div>
      </div>
    `);
  }
};

                <button class="icon-btn" onclick="Followups.toggleDone('${f.id}')" title="Mark done">&#10003;</button>

                <button class="icon-btn" onclick="Followups.remove('${f.id}')">&#128465;</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody></table>` : `<div class="empty-state"><div class="ic">&#128197;</div><div class="t">No follow-ups scheduled</div><div class="d">Schedule a call or visit to keep leads and customers warm.</div>
        <button class="btn btn-primary btn-sm" onclick="Followups.openForm(null,null)">&#65291; Schedule Follow-up</button></div>`}
        </div>
      </div>
    `;
  },
  openForm(id, presetCustomerId){
    const rec = id ? Store.data.followups.find(x=>x.id===id) : null;
    const v = rec || {customerId:presetCustomerId||'', date:Util.todayISO(), purpose:'', status:'Pending', notes:''};
    const custOptions = Store.data.customers.map(c=>`<option value="${c.id}" ${c.id===v.customerId?'selected':''}>${Util.escapeHtml(c.name)} — ${Util.escapeHtml(c.phone)}</option>`).join('');
    UI.openModal(rec?'Edit Follow-up':'Schedule Follow-up', `
      <div class="field"><label>Customer *</label><select id="f_cust"><option value="">Select customer...</option>${custOptions}</select></div>
      <div class="form-row">
        <div class="field"><label>Date *</label><input type="date" id="f_date" value="${v.date}"></div>
        <div class="field"><label>Status</label><select id="f_status"><option ${v.status==='Pending'?'selected':''}>Pending</option><option ${v.status==='Done'?'selected':''}>Done</option></select></div>
      </div>
      <div class="field"><label>Purpose</label><input id="f_purpose" placeholder="e.g. Price discussion, demo, payment reminder" value="${Util.escapeHtml(v.purpose)}"></div>
      <div class="field"><label>Notes</label><textarea id="f_notes">${Util.escapeHtml(v.notes)}</textarea></div>
    `, `

      <button class="btn btn-primary" onclick="Followups.save('${id||''}')">Save</button>
    `);

      customerId: custId, customerName: cust.name, phone: cust.phone,
      date: document.getElementById('f_date').value,
      status: document.getElementById('f_status').value,
      purpose: document.getElementById('f_purpose').value.trim(),
      notes: document.getElementById('f_notes').value.trim()

    Store.data.followups = Store.data.followups.filter(x=>x.id!==id);
    await Store.save('followups'); UI.toast('Deleted'); Router.render('followups');
  }
};

          <td style="display:flex;gap:5px;">
            <button class="icon-btn" title="Print" onclick="Quotations.print('${q.id}')">&#128424;</button>
            <a class="icon-btn btn-wa" style="text-decoration:none;" title="WhatsApp" href="${Util.waLink(q.phone, Quotations.waSummary(q))}" target="_blank">&#128172;</a>
            <button class="icon-btn" onclick="Quotations.openForm('${q.id}')">&#9998;</button>
            <button class="icon-btn" onclick="Quotations.remove('${q.id}')">&#128465;</button>

        </tr>`).join('')}
      </tbody></table>` : `<div class="empty-state"><div class="ic">&#128196;</div><div class="t">No quotations yet</div><div class="d">Create a quotation for a customer, print it, or send it straight to WhatsApp.</div>
      <button class="btn btn-primary btn-sm" onclick="Quotations.openForm(null)">&#65291; New Quotation</button></div>`}
      </div></div>
    `;
  },
  waSummary(q){
    let lines = [`Quotation ${q.id} from Jays Trading and Business Solution`, `Date: ${q.date}`, ''];
    q.items.forEach(it=> lines.push(`${it.name} x${it.qty} = ${Util.fmtMoney(it.qty*it.rate).replace('&#8377;','Rs.')}`));
    lines.push('', `Total: ${Util.fmtMoney(q.total).replace('&#8377;','Rs.')}`);
    return lines.join('\n');
  },
  openForm(id){
    const rec = id ? Store.data.quotations.find(x=>x.id===id) : null;
    this.draftItems = rec ? JSON.parse(JSON.stringify(rec.items)) : [{name:'',qty:1,rate:0}];
    const custOptions = Store.data.customers.map(c=>`<option value="${c.id}" ${rec&&rec.customerId===c.id?'selected':''}>${Util.escapeHtml(c.name)} — ${Util.escapeHtml(c.phone)}</option>`).join('');
    const gst = rec ? rec.gst : (Store.data.settings.gstPercent||0);
    UI.openModal(rec?'Edit Quotation':'New Quotation', `
      <div class="form-row">
        <div class="field"><label>Customer *</label><select id="q_cust"><option value="">Select customer...</option>${custOptions}</select></div>
        <div class="field"><label>Date</label><input type="date" id="q_date" value="${rec?rec.date:Util.todayISO()}"></div>
      </div>
      <div class="field"><label>Status</label><select id="q_status">${['Draft','Sent','Accepted','Rejected'].map(s=>`<option ${rec&&rec.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
      <h4 style="font-size:12px;text-transform:uppercase;color:var(--text-mute);margin:16px 0 8px;">Line Items</h4>
      <div id="q_items"></div>
      <button class="btn btn-outline btn-sm" onclick="Quotations.addLine()">&#65291; Add Line</button>
      <div class="form-row" style="margin-top:16px;">
        <div class="field"><label>GST / Tax %</label><input type="number" id="q_gst" value="${gst}"></div>
        <div class="field"><label>Total (auto)</label><input id="q_totalDisplay" disabled></div>
      </div>
    `, `
      <button class="btn btn-outline" onclick="UI.closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="Quotations.save('${id||''}')">Save Quotation</button>
    `, true);
    this.renderLines();
    document.getElementById('q_gst').addEventListener('input', ()=>Quotations.renderLines());
  },
  addLine(){ this.draftItems.push({name:'',qty:1,rate:0}); this.renderLines(); },
  removeLine(i){ this.draftItems.splice(i,1); this.renderLines(); },
  updateLine(i, field, val){
    this.draftItems[i][field] = (field==='qty'||field==='rate') ? Number(val)||0 : val;
    this.renderLines(true);
  },
  renderLines(skipInputs){
    const box = document.getElementById('q_items');
    if(!box) return;
    box.innerHTML = this.draftItems.map((it,i)=>`
      <div class="quo-line">
        <input placeholder="Item / product name" value="${Util.escapeHtml(it.name)}" onchange="Quotations.updateLine(${i},'name',this.value)">
        <input type="number" placeholder="Qty" value="${it.qty}" onchange="Quotations.updateLine(${i},'qty',this.value)">
        <input type="number" placeholder="Rate" value="${it.rate}" onchange="Quotations.updateLine(${i},'rate',this.value)">
        <div class="mono cell-mute" style="text-align:right;padding-right:4px;">${Util.fmtMoney(it.qty*it.rate)}</div>
        <button class="icon-btn" onclick="Quotations.removeLine(${i})">&times;</button>
      </div>
    `).join('');
    const subtotal = this.draftItems.reduce((s,it)=>s+(it.qty*it.rate),0);
    const gst = Number(document.getElementById('q_gst')?.value||0);
    const total = subtotal * (1+gst/100);
    const disp = document.getElementById('q_totalDisplay');
    if(disp) disp.value = 'Rs. ' + total.toLocaleString('en-IN',{maximumFractionDigits:0}) + (gst? ` (incl. ${gst}% tax)` : '');
  },
  async save(id){
    const custId = document.getElementById('q_cust').value;
    const cust = Store.data.customers.find(c=>c.id===custId);
    if(!cust){ UI.toast('Please select a customer'); return; }
    const items = this.draftItems.filter(it=>it.name.trim());
    if(!items.length){ UI.toast('Add at least one line item'); return; }
    const gst = Number(document.getElementById('q_gst').value||0);
    const subtotal = items.reduce((s,it)=>s+(it.qty*it.rate),0);
    const total = subtotal*(1+gst/100);
    const rec = {
      id: id || (Store.data.settings.quoPrefix||'Q-') + String(Store.data.settings.quoNext||1).padStart(4,'0'),
      customerId: custId, customerName: cust.name, phone: cust.phone,
      date: document.getElementById('q_date').value,
      status: document.getElementById('q_status').value,
      items, gst, subtotal, total
    };
    if(id){ const i=Store.data.quotations.findIndex(x=>x.id===id); Store.data.quotations[i]=rec; }
    else { Store.data.quotations.unshift(rec); Store.data.settings.quoNext = (Store.data.settings.quoNext||1)+1; await Store.save('settings'); }
    await Store.save('quotations');
    UI.closeModal(); UI.toast('Quotation saved'); Router.render('quotations');
  },
  async remove(id){
    if(!confirm('Delete this quotation?')) return;
    Store.data.quotations = Store.data.quotations.filter(x=>x.id!==id);
    await Store.save('quotations'); UI.toast('Deleted'); Router.render('quotations');
  },
  print(id){
    const q = Store.data.quotations.find(x=>x.id===id);
    const s = Store.data.settings;
    const rowsHtml = q.items.map(it=>`<tr><td style="padding:8px;border-bottom:1px solid #eee;">${Util.escapeHtml(it.name)}</td><td style="padding:8px;border-bottom:1px solid #eee;text-align:center;">${it.qty}</td><td style="padding:8px;border-bottom:1px solid #eee;text-align:right;">${Util.fmtMoney(it.rate)}</td><td style="padding:8px;border-bottom:1px solid #eee;text-align:right;">${Util.fmtMoney(it.qty*it.rate)}</td></tr>`).join('');
    document.getElementById('printArea').innerHTML = `
      <div style="font-family:Inter,sans-serif;max-width:700px;margin:0 auto;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #0E9F76;padding-bottom:16px;margin-bottom:20px;">
          <div><div style="font-size:20px;font-weight:800;">${Util.escapeHtml(s.companyName)}</div><div style="color:#666;font-size:12px;">${Util.escapeHtml(s.companyPhone||'')}</div></div>
          <div style="text-align:right;"><div style="font-size:16px;font-weight:800;">QUOTATION</div><div style="font-size:12px;color:#666;">${q.id}</div><div style="font-size:12px;color:#666;">${Util.fmtDate(q.date)}</div></div>
        </div>
        <div style="margin-bottom:16px;font-size:13px;"><b>To:</b> ${Util.escapeHtml(q.customerName)} &middot; ${Util.escapeHtml(q.phone)}</div>
        <table style="width:100%;border-collapse:collapse;font-size:13px;">
          <thead><tr style="background:#F5F7FA;"><th style="padding:8px;text-align:left;">Item</th><th style="padding:8px;">Qty</th><th style="padding:8px;text-align:right;">Rate</th><th style="padding:8px;text-align:right;">Amount</th></tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
        <div style="display:flex;justify-content:flex-end;margin-top:14px;">
          <table style="font-size:13px;"><tr><td style="padding:4px 16px;">Subtotal</td><td style="padding:4px 0;text-align:right;">${Util.fmtMoney(q.subtotal)}</td></tr>
          <tr><td style="padding:4px 16px;">Tax (${q.gst}%)</td><td style="padding:4px 0;text-align:right;">${Util.fmtMoney(q.total-q.subtotal)}</td></tr>
          <tr style="font-weight:800;border-top:2px solid #152234;"><td style="padding:6px 16px;">Total</td><td style="padding:6px 0;text-align:right;">${Util.fmtMoney(q.total)}</td></tr></table>
        </div>
        <div style="margin-top:40px;font-size:11px;color:#888;">Thank you for your business. This is a computer-generated quotation from ${Util.escapeHtml(s.companyName)}.</div>
      </div>
    `;
    setTimeout(()=>window.print(), 100);
  }
};
Views.quotations = ()=>Quotations.render();

    Store.data.payments = Store.data.payments.filter(x=>x.id!==id);
    await Store.save('payments'); UI.toast('Deleted'); Router.render('payments');
  }
};
Views.payments = ()=>Payments.render();

    `, `<button class="btn btn-outline" onclick="UI.closeModal()">Cancel</button><button class="btn btn-primary" onclick="Notes.save('${id||''}')">Save</button>`);
  },
  async save(id){
    const text = document.getElementById('n_text').value.trim();
    if(!text){ UI.toast('Note text is required'); return; }
    const rec = { id: id || Util.uid('N', Store.data.notes), date: document.getElementById('n_date').value, text, remark: document.getElementById('n_remark').value.trim() };
    if(id){ const i=Store.data.notes.findIndex(x=>x.id===id); Store.data.notes[i]=rec; }
    else Store.data.notes.unshift(rec);
    await Store.save('notes');
    UI.closeModal(); UI.toast('Saved'); Router.render('notes');
  },
  async remove(id){
    if(!confirm('Delete this note?')) return;
    Store.data.notes = Store.data.notes.filter(x=>x.id!==id);
    await Store.save('notes'); UI.toast('Deleted'); Router.render('notes');
  }
};
Views.notes = ()=>Notes.render();

/* =====================================================================
   REPORTS  (+ generic Excel export)
===================================================================== */
const Reports = {
  render(){
    const c = Store.data.customers;
    const agg = (field)=>{ const m={}; c.forEach(x=>{ const k=x[field]||'Unknown'; m[k]=(m[k]||0)+1; }); return m; };
    const byStatus = agg('status'), bySource = agg('source'), byAssigned = agg('assignedTo'), byDistrict = agg('district');
    const tableFromAgg = (m,title,key)=>`
      <div class="card">
        <div class="card-head"><h3>${title}</h3><button class="btn btn-outline btn-sm" onclick="Reports.exportAgg('${key}')">&#128228; Export</button></div>
        <div class="table-wrap"><table><thead><tr><th>${title}</th><th>Count</th></tr></thead><tbody>
        ${Object.keys(m).sort((a,b)=>m[b]-m[a]).map(k=>`<tr><td class="cell-main">${Util.escapeHtml(k)}</td><td class="mono">${m[k]}</td></tr>`).join('')}
        </tbody></table></div>
      </div>`;
    const totalPending = Store.data.payments.filter(p=>p.status!=='Paid').reduce((s,p)=>s+(Number(p.amount)||0),0);
    const totalPaid = Store.data.payments.filter(p=>p.status==='Paid').reduce((s,p)=>s+(Number(p.amount)||0),0);
    document.getElementById('content').innerHTML = `
      <div class="grid grid-4" style="margin-bottom:16px;">
        <div class="card stat-card"><div class="bar bar-blue"></div><div class="lbl">Total Customers</div><div class="val">${c.length}</div></div>
        <div class="card stat-card"><div class="bar bar-green"></div><div class="lbl">Quotations</div><div class="val">${Store.data.quotations.length}</div></div>
        <div class="card stat-card"><div class="bar bar-amber"></div><div class="lbl">Payments Pending</div><div class="val">${Util.fmtMoney(totalPending)}</div></div>
        <div class="card stat-card"><div class="bar bar-green"></div><div class="lbl">Payments Collected</div><div class="val">${Util.fmtMoney(totalPaid)}</div></div>
      </div>
      <div class="grid grid-2">
        ${tableFromAgg(byStatus,'Customers by Status','status')}
        ${tableFromAgg(bySource,'Customers by Source','source')}
        ${tableFromAgg(byAssigned,'Customers by Assigned To','assignedTo')}
        ${tableFromAgg(byDistrict,'Customers by District','district')}
      </div>
    `;
  },
  exportAgg(field){
    const m={}; Store.data.customers.forEach(x=>{ const k=x[field]||'Unknown'; m[k]=(m[k]||0)+1; });
    const rows = Object.keys(m).map(k=>({[field]:k, count:m[k]}));
    this.download(rows, 'report_'+field);
  },
  exportView(view){
    let rows = [];
    if(view==='customers'||view==='leads'||view==='dashboard'){
      let base = Store.data.customers;
      if(view==='leads') base = base.filter(x=>x.status==='New lead'||!x.status);
      rows = base.map(x=>({ID:x.id, Name:x.name, Phone:x.phone, Email:x.email, District:x.district, Area:x.panchayath, Source:x.source, AssignedTo:x.assignedTo, Status:x.status, LastContact:x.lastContact}));
    } else if(view==='products'){
      rows = Store.data.products.map(p=>({ID:p.id, Name:p.name, Category:p.category, Unit:p.unit, Price:p.price, Stock:p.stock}));
    } else if(view==='quotations'){
      rows = Store.data.quotations.map(q=>({ID:q.id, Date:q.date, Customer:q.customerName, Phone:q.phone, Subtotal:q.subtotal, GST:q.gst, Total:q.total, Status:q.status}));
    } else if(view==='payments'){
      rows = Store.data.payments.map(p=>({ID:p.id, InvoiceDate:p.invoiceDate, Party:p.party, Amount:p.amount, Contact:p.contact, Phone:p.phone, FollowupDate:p.followupDate, Response:p.response, Status:p.status}));
    } else if(view==='followups'){
      rows = Store.data.followups.map(f=>({ID:f.id, Date:f.date, Customer:f.customerName, Phone:f.phone, Purpose:f.purpose, Status:f.status, Notes:f.notes}));
    } else if(view==='tasks'){
      rows = Store.data.tasks.map(t=>({ID:t.id, Date:t.date, Type:t.type, AssignedTo:t.assignedTo, Customer:t.customer, Phone:t.phone, Notes:t.notes, Done:t.done}));
    } else if(view==='notes'){
      rows = Store.data.notes.map(n=>({ID:n.id, Date:n.date, Note:n.text, Remark:n.remark}));
    } else {
      rows = Store.data.customers.map(x=>({ID:x.id, Name:x.name, Phone:x.phone, Status:x.status}));
    }
    if(!rows.length){ UI.toast('Nothing to export in this view'); return; }
    this.download(rows, view||'export');
  },
  download(rows, filename){
    try{
      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Data');
      XLSX.writeFile(wb, filename+'.xlsx');
      UI.toast('Exported '+filename+'.xlsx');
    }catch(e){ UI.toast('Export failed'); console.error(e); }
  }
};
Views.reports = ()=>Reports.render();

/* =====================================================================
   USERS & ROLES (admin only)
===================================================================== */
const UsersMgmt = {
  render(){
    if(!Auth.isAdmin()){ document.getElementById('content').innerHTML = `<div class="empty-state"><div class="ic">&#128274;</div><div class="t">Admins only</div></div>`; return; }
    const list = Store.data.users;
    document.getElementById('content').innerHTML = `
      <div class="toolbar"><div class="toolbar-spacer"></div>
        <button class="btn btn-primary btn-sm" onclick="UsersMgmt.openForm(null)">&#65291; Add User</button>
      </div>
      <div class="card"><div class="table-wrap">
      <table><thead><tr><th>Username</th><th>Name</th><th>Role</th><th></th></tr></thead><tbody>
      ${list.map(u=>`<tr>
        <td class="mono cell-main">${Util.escapeHtml(u.username)}</td>
        <td>${Util.escapeHtml(u.name||'—')}</td>
        <td>${u.role==='Admin'?'<span class="badge badge-green">Admin</span>':'<span class="badge badge-blue">Sales</span>'}</td>
        <td style="display:flex;gap:5px;">
          <button class="icon-btn" onclick="UsersMgmt.openForm('${u.username}')">&#9998;</button>
          ${u.username!=='admin' ? `<button class="icon-btn" onclick="UsersMgmt.remove('${u.username}')">&#128465;</button>` : ''}
        </td>
      </tr>`).join('')}
      </tbody></table></div></div>
    `;
  },
  openForm(username){
    const rec = username ? Store.data.users.find(u=>u.username===username) : null;
    const v = rec || {username:'',password:'',role:'Sales',name:''};
    UI.openModal(rec?'Edit User':'Add User', `
      <div class="field"><label>Username *</label><input id="u_username" value="${Util.escapeHtml(v.username)}" ${rec?'disabled':''}></div>
      <div class="field"><label>Full Name</label><input id="u_name" value="${Util.escapeHtml(v.name)}"></div>
      <div class="field"><label>Password *</label><input id="u_password" value="${Util.escapeHtml(v.password)}"></div>
      <div class="field"><label>Role</label><select id="u_role"><option ${v.role==='Sales'?'selected':''}>Sales</option><option ${v.role==='Admin'?'selected':''}>Admin</option></select></div>
    `, `<button class="btn btn-outline" onclick="UI.closeModal()">Cancel</button><button class="btn btn-primary" onclick="UsersMgmt.save('${username||''}')">Save</button>`);
  },
  async save(oldUsername){
    const username = document.getElementById('u_username').value.trim();
    const password = document.getElementById('u_password').value;
    if(!username || !password){ UI.toast('Username and password are required'); return; }
    if(!oldUsername && Store.data.users.some(u=>u.username.toLowerCase()===username.toLowerCase())){ UI.toast('Username already exists'); return; }
    const rec = { username, password, name: document.getElementById('u_name').value.trim(), role: document.getElementById('u_role').value };
    if(oldUsername){ const i=Store.data.users.findIndex(u=>u.username===oldUsername); Store.data.users[i]=rec; }
    else Store.data.users.push(rec);
    await Store.save('users');
    UI.closeModal(); UI.toast('Saved'); Router.render('users');
  },
  async remove(username){
    if(!confirm('Remove this user?')) return;
    Store.data.users = Store.data.users.filter(u=>u.username!==username);
    await Store.save('users'); UI.toast('Removed'); Router.render('users');
  }
};
Views.users = ()=>UsersMgmt.render();

  const s = Store.data.settings;
  document.getElementById('content').innerHTML = `
    <div class="card card-pad" style="max-width:520px;">
      <h3 style="margin:0 0 16px;font-size:14px;">Company Details</h3>
      <div class="field"><label>Company Name</label><input id="s_companyName" value="${Util.escapeHtml(s.companyName)}"></div>
      <div class="field"><label>Company Phone</label><input id="s_companyPhone" value="${Util.escapeHtml(s.companyPhone)}"></div>
      <div class="form-row">
        <div class="field"><label>WhatsApp Country Code</label><input id="s_whatsappCC" value="${Util.escapeHtml(s.whatsappCC)}"></div>

      <button class="btn btn-primary" onclick="SettingsView.save()">Save Settings</button>

const SettingsView = {

    Store.data.settings.whatsappCC = document.getElementById('s_whatsappCC').value.trim();

    UI.toast('Settings saved');

};
