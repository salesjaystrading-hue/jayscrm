  useProduct(uid, pid){
    const p = Store.data.products.find(x=>x.id===pid);
    const it = this.draft.items.find(x=>x.uid===uid);
    if(!p || !it) return;
    it.itemName = p.name || '';            // copy into the draft item
    it.category = p.category || '';
    it.unit     = p.unit || 'Nos';
    if(p.price != null && p.price !== '') it.rate = Number(p.price)||'';
    if(p.description) it.specs = p.description;
    if(p.imageUrl) it.imageUrl = p.imageUrl;
    it.templateId = '';
    UI.closeModal();
    this.render();
  },
  _downscale(file, max, quality){
    return new Promise((resolve, reject)=>{
      const r = new FileReader();
      r.onload = ()=>{
        const img = new Image();
        img.onload = ()=>{
          let w = img.width, h = img.height;
          if(w>max||h>max){ const s = Math.min(max/w, max/h); w=Math.round(w*s); h=Math.round(h*s); }
          const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
          const ctx = cv.getContext('2d');
          // Fill white FIRST: a transparent PNG drawn straight onto an
          // untouched canvas renders its transparent areas as BLACK once
          // flattened to JPEG (no alpha channel), not white/transparent -
          // this is what actually keeps a transparent-background logo
          // looking correct instead of gaining a black box around it.
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img,0,0,w,h);
          resolve(cv.toDataURL('image/jpeg', quality));
        };
        img.onerror = ()=>reject(new Error('Not a readable image'));
        img.src = r.result;
      };
      r.onerror = ()=>reject(new Error('Could not read that file'));
      r.readAsDataURL(file);
    });
  },
  async onItemImage(uid, input){
    const f = input.files && input.files[0];
    if(!f) return;
    if(!/^image\/(jpe?g|png|webp)$/i.test(f.type)){ UI.toast('Use a JPG, PNG or WEBP image'); input.value=''; return; }
    if(f.size > 1024*1024){ UI.toast('Image must be 1 MB or smaller.'); input.value=''; return; }
    try{
      // Hard limit is checked above on the ORIGINAL file; downscaling below is
      // purely to keep the shared JSON store small, not a substitute for it.
      const url = await this._downscale(f, 420, 0.7);
      const it = this.draft.items.find(x=>x.uid===uid);
      if(it){ it.imageUrl = url; it.imageSize = f.size; }
      this.render();
    }catch(e){ console.error(e); UI.toast('Could not process that image'); }
    input.value = '';
  },
  removeItemImage(uid){
    const it = this.draft.items.find(x=>x.uid===uid);
    if(it){ it.imageUrl=''; it.imageSize=0; }
    this.render();
  },

  /* ---------------- PDF engine (jsPDF + AutoTable) ---------------- */
  libsReady(){
    return !!(window.jspdf && window.jspdf.jsPDF && typeof window.jspdf.jsPDF.API.autoTable === 'function');
  },
  buildPDF(){
    if(!this.libsReady()) throw new Error('PDF libraries are still loading. Check your connection and try again.');
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'mm', format:'a4'});
    const d = this.draft, s = Store.data.settings || {}, t = this.totals();
    const accent = RATE_THEME_COLORS[d.theme] || RATE_THEME_COLORS.Corporate;
    const PW = doc.internal.pageSize.getWidth();
    const PH = doc.internal.pageSize.getHeight();
    const M = 14;
    const minimal = d.theme === 'Minimal';

    /* --- header (drawn on page 1; repeated as a slim band on later pages) --- */
    let y = M;
    if(!minimal){
      doc.setFillColor(accent[0],accent[1],accent[2]);
      doc.rect(0,0,PW,3,'F');
      y = M + 2;
    }
    // Logo is drawn at its real aspect ratio (via jsPDF's own image-properties
    // lookup) instead of a fixed square, so a wide wordmark logo isn't stretched.
    // Sized generously so it reads clearly at the top of an A4 page.
    let logoW = 0, logoH = 0;
    if(s.companyLogo){
      try{
        const props = doc.getImageProperties(s.companyLogo);
        const maxW = 52, maxH = 26;
        const scale = Math.min(maxW/props.width, maxH/props.height);
        logoW = props.width*scale; logoH = props.height*scale;
        doc.addImage(s.companyLogo,'JPEG',M,y,logoW,logoH);
      }catch(e){ console.warn('logo skipped',e); }
    }
    const tx = logoW ? M + logoW + 6 : M;
    doc.setFont('helvetica','bold'); doc.setFontSize(15);
    doc.setTextColor(accent[0],accent[1],accent[2]);
    doc.text(String(s.companyName||'JAYS TRADING AND BUSINESS SOLUTION').toUpperCase(), tx, y + Math.max(6, logoH/2 + 2));
    let hy = y + Math.max(11, logoH + 3);
    if(s.companySlogan){
      doc.setFont('helvetica','italic'); doc.setFontSize(8.2); doc.setTextColor(120);
      doc.splitTextToSize(String(s.companySlogan), PW - tx - M).slice(0,2).forEach(l=>{ doc.text(l, tx, hy); hy += 3.8; });
      hy += 0.5;
    }
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(70);
    const cLines = [
      s.companyAddress || '',
      [s.companyPhone && ('Ph: '+s.companyPhone), s.companyEmail && ('Email: '+s.companyEmail)].filter(Boolean).join('   '),
      [s.companyGSTIN && ('GSTIN: '+s.companyGSTIN), s.companyUdyam && ('Udyam: '+s.companyUdyam), s.companyWebsite].filter(Boolean).join('   ')
    ].filter(x=>String(x).trim());
    cLines.forEach(l=>{ doc.text(String(l), tx, hy); hy += 4; });

    y = Math.max(hy + 3, y + Math.max(logoH, 28));
    if(!minimal){
      // Diagonal navy/accent stripe echoing the brand's angled motif,
      // in place of a plain horizontal rule.
      const navy = [11,20,36], stripeH = 3.4;
      doc.setFillColor(navy[0],navy[1],navy[2]);
      doc.triangle(M, y+stripeH, PW-M, y, M, y, 'F');
      doc.setFillColor(accent[0],accent[1],accent[2]);
      doc.triangle(M, y+stripeH, PW-M, y, PW-M, y+stripeH, 'F');
    } else {
      doc.setDrawColor(accent[0],accent[1],accent[2]); doc.setLineWidth(0.5);
      doc.line(M, y, PW-M, y);
    }
    y += 8;

    /* --- document title, on a soft accent banner for a more premium look --- */
    const titleH = 9;
    if(!minimal){
      doc.setFillColor(accent[0],accent[1],accent[2]);
      doc.roundedRect(PW/2-46, y, 92, titleH, 1.5, 1.5, 'F');
      doc.setTextColor(255);
    } else {
      doc.setTextColor(30);
    }
    doc.setFont('helvetica','bold'); doc.setFontSize(12);
    doc.text(String(d.docType||'Rate Offer').toUpperCase(), PW/2, y + titleH/2 + 3.2, {align:'center'});
    y += titleH + 6;

    /* --- meta + customer, side by side --- */
    doc.setFontSize(8.5);
    const meta = [
      ['Document No', d.docNumber || '(draft)'],
      ['Date', Util.fmtDate(d.docDate)],
      ['Valid Until', d.validUntil ? Util.fmtDate(d.validUntil) : '-'],
      ['Reference', d.reference || '-'],
      ['Your Ref', d.customerRef || '-']
    ].filter(r=>r[1] && r[1] !== '-' || ['Document No','Date'].includes(r[0]));
    const cust = [
      ['Customer', d.customerName || '-'],
      ['Contact', d.contactPerson || '-'],
      ['Phone', d.phone || '-'],
      ['Email', d.email || '-'],
      ['Address', d.address || '-'],
      ['GSTIN', d.gstin || '-']
    ].filter(r=>r[1] && r[1] !== '-' || r[0]==='Customer');

    const colW = (PW - M*2 - 6) / 2;
    const boxTop = y;
    doc.setFont('helvetica','bold'); doc.setTextColor(accent[0],accent[1],accent[2]);
    doc.text('TO', M+2, y+4);
    doc.text('DOCUMENT DETAILS', M+colW+8, y+4);
    doc.setFont('helvetica','normal'); doc.setTextColor(50);
    let ly = y + 9, ry = y + 9;
    cust.forEach(r=>{
      const wrapped = doc.splitTextToSize(String(r[0]) + ': ' + String(r[1]), colW - 4);
      wrapped.forEach(w=>{ doc.text(w, M+2, ly); ly += 4.2; });
    });
    meta.forEach(r=>{
      doc.text(String(r[0]) + ': ' + String(r[1]), M+colW+8, ry); ry += 4.2;
    });
    y = Math.max(ly, ry) + 2;
    if(!minimal){
      doc.setDrawColor(215); doc.setLineWidth(0.2);
      doc.rect(M, boxTop, colW, y-boxTop-1);
      doc.rect(M+colW+6, boxTop, colW, y-boxTop-1);
    }
    y += 4;

    if(d.subject){
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(30);
      const sub = doc.splitTextToSize('Subject: ' + d.subject, PW - M*2);
      sub.forEach(l=>{ doc.text(l, M, y); y += 4.5; });
      y += 2;
    }

    /* --- items table. GST columns exist ONLY when gstEnabled.
       A Photo column is present only when at least one item has an image;
       didDrawCell paints the actual image (AutoTable cells can't hold
       image data as cell text). Specifications print under their own
       "Description" column heading.

       FIX: column headers and column widths used to be built as two
       separate lists that had to stay in sync by hand - they didn't,
       and every combination overflowed the printable A4 width (182mm
       inside the 14mm margins), which is exactly what clipped the
       Amount column off the right edge. Both lists are now derived
       from ONE array below, so they can never drift apart again, and
       every width combination is pre-verified to total exactly 182mm
       or less. */
    const gst = d.gstEnabled;
    const hasAnyImage = d.items.some(it=>it.imageUrl);

    let columns;
    if(hasAnyImage && gst){
      columns = [
        {header:'S.No.', width:8, halign:'center'},
        {header:'Photo', width:14, minCellHeight:14},
        {header:'Item', width:38},
        {header:'Description', width:36},
        {header:'Qty', width:10, halign:'right'},
        {header:'Unit', width:12},
        {header:'Rate', width:18, halign:'right'},
        {header:'Discount', width:15, halign:'right'},
        {header:'GST', width:11, halign:'right'},
        {header:'Amount', width:20, halign:'right'}
      ];
    } else if(hasAnyImage && !gst){
      columns = [
        {header:'S.No.', width:9, halign:'center'},
        {header:'Photo', width:16, minCellHeight:16},
        {header:'Item', width:36},
        {header:'Description', width:36},
        {header:'Qty', width:11, halign:'right'},
        {header:'Unit', width:13},
        {header:'Rate', width:22, halign:'right'},
        {header:'Discount', width:18, halign:'right'},
        {header:'Amount', width:21, halign:'right'}
      ];
    } else if(!hasAnyImage && gst){
      columns = [
        {header:'S.No.', width:9, halign:'center'},
        {header:'Item', width:38},
        {header:'Description', width:38},
        {header:'Qty', width:11, halign:'right'},
        {header:'Unit', width:13},
        {header:'Rate', width:20, halign:'right'},
        {header:'Discount', width:16, halign:'right'},
        {header:'GST', width:12, halign:'right'},
        {header:'Amount', width:25, halign:'right'}
      ];
    } else {
      columns = [
        {header:'S.No.', width:9, halign:'center'},
        {header:'Item', width:44},
        {header:'Description', width:44},
        {header:'Qty', width:12, halign:'right'},
        {header:'Unit', width:14},
        {header:'Rate', width:24, halign:'right'},
        {header:'Discount', width:20, halign:'right'},
        {header:'Amount', width:15, halign:'right'}
      ];
    }
    const photoColIdx = columns.findIndex(c=>c.header==='Photo');
    const head = [columns.map(c=>c.header)];
    const colStyles = {};
    columns.forEach((c,i)=>{ colStyles[i] = {cellWidth:c.width, halign:c.halign, minCellHeight:c.minCellHeight}; });

    const body = d.items.map((it,i)=>{
      let desc = it.itemName || '-';
      const sub = [it.brand, it.model].filter(Boolean).join(' ');
      if(sub) desc += '\n' + sub;
      const specLines = String(it.specs||'').split('\n').map(x=>x.trim()).filter(Boolean);
      const specsText = specLines.length ? specLines.map(x=>'\u2022 ' + x).join('\n') : '-';
      const base = this.itemBase(it);
      const row = [String(i+1)];
      if(hasAnyImage) row.push('');        // photo cell stays blank; image is painted on top of it
      // Discount is always a fully-formatted figure (never a bare '-' for
      // zero) so the column reads consistently whether or not this
      // particular item has a discount.
      row.push(desc, specsText, String(this.num(it.qty)), it.unit||'Nos',
                this.money(it.rate), this.money(this.num(it.discount)));
      if(gst) row.push(String(this.itemGstRate(it)) + '%');
      row.push(this.money(base));
      return row;
    });

    doc.autoTable({
      head, body, startY:y, margin:{left:M,right:M,top:22,bottom:20},
      theme: minimal ? 'plain' : 'grid',
      styles:{fontSize:7.6, cellPadding:2, overflow:'linebreak', valign:'middle', lineColor:[210,210,210], lineWidth:0.15},
      headStyles:{fillColor: minimal ? [245,245,245] : accent, textColor: minimal ? 40 : 255,
                  fontStyle:'bold', fontSize:7.8, halign:'left'},
      alternateRowStyles: minimal ? {} : {fillColor:[250,250,250]},
      tableWidth: columns.reduce((s,c)=>s+c.width,0),
      columnStyles: colStyles,
      showHead:'everyPage',            // repeating header on every page
      rowPageBreak:'auto',
      didDrawCell: (data)=>{
        if(data.section !== 'body' || data.column.index !== photoColIdx) return;
        const it = d.items[data.row.index];
        if(!it || !it.imageUrl) return;
        const pad = 1.2;
        const size = Math.min(data.cell.width, data.cell.height) - pad*2;
        try{
          doc.addImage(it.imageUrl, 'JPEG',
            data.cell.x + (data.cell.width-size)/2,
            data.cell.y + (data.cell.height-size)/2,
            size, size);
        }catch(e){ console.warn('item image skipped', e); }
      }
    });
    y = doc.lastAutoTable.finalY + 6;

    /* --- summary, right aligned; tax rows only when GST is on --- */
    const sumRows = [['Subtotal', this.money(t.gross)]];
    if(t.discount > 0) sumRows.push(['Discount', '-' + this.money(t.discount)]);
    if(gst){
      sumRows.push(['Taxable Amount', this.money(t.taxable)]);
      if(d.gstScope === 'inter') sumRows.push(['IGST', this.money(t.igst)]);
      else { sumRows.push(['CGST', this.money(t.cgst)]); sumRows.push(['SGST', this.money(t.sgst)]); }
    }
    sumRows.push(['Grand Total', this.money(t.grand)]);

    if(y > PH - 55){ doc.addPage(); y = 24; }
    const summaryStartY = y;

    /* --- Additional Information: fully dynamic, one row per field that
       actually has a value - never a fixed/mandatory set of boxes. --- */
    const infoFields = [
      ['Payment Terms', d.paymentTerms], ['Delivery Time', d.deliveryTerms],
      ['Warranty', d.warranty], ['GST', d.gstNote]
    ].filter(([,v])=>String(v||'').trim());
    if(infoFields.length){
      const infoW = PW - M*2 - 82;
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(30);
      doc.text('ADDITIONAL INFORMATION', M, y+3);
      let iy = y + 9;
      const colHalf = infoW/2;
      infoFields.forEach(([label,val], idx)=>{
        const col = idx % 2, row = Math.floor(idx/2);
        const bx = M + col*(colHalf+4), by = iy + row*15;
        doc.setFillColor(accent[0],accent[1],accent[2]);
        doc.circle(bx+3, by+2.5, 2.6, 'F');
        doc.setFont('helvetica','bold'); doc.setFontSize(7.6); doc.setTextColor(30);
        doc.text(String(label), bx+8, by+1.5);
        doc.setFont('helvetica','normal'); doc.setFontSize(7.6); doc.setTextColor(80);
        doc.splitTextToSize(String(val), colHalf-10).slice(0,2).forEach((l,li)=>doc.text(l, bx+8, by+5.5+li*3.4));
      });
      y = iy + Math.ceil(infoFields.length/2)*15;
    }
    const infoBottomY = y;

    const sumW = 76;
    doc.autoTable({
      body: sumRows, startY: summaryStartY, margin:{left: PW - M - sumW, right: M},
      theme:'plain', tableWidth: sumW,
      styles:{fontSize:8.6, cellPadding:1.7},
      columnStyles:{0:{cellWidth:44}, 1:{cellWidth:32, halign:'right'}},
      didParseCell: hook => {
        if(hook.row.index === sumRows.length-1){
          hook.cell.styles.fontStyle = 'bold';
          hook.cell.styles.fontSize = 9.6;
          hook.cell.styles.textColor = accent;
        }
      }
    });
    y = Math.max(infoBottomY, doc.lastAutoTable.finalY) + 5;

    if(y > PH - 40){ doc.addPage(); y = 24; }
    doc.setFont('helvetica','bold'); doc.setFontSize(8.4); doc.setTextColor(40);
    const wWords = doc.splitTextToSize('Amount in Words: ' + this.words(t.grand), PW - M*2);
    wWords.forEach(l=>{ doc.text(l, M, y); y += 4.3; });
    doc.setFont('helvetica','normal');
    y += 4;

    /* --- terms --- */
    const terms = Store.data.rateTerms.filter(x=>d.termIds.includes(x.id) && x.isActive !== false);
    if(terms.length || d.extraNotes){
      if(y > PH - 45){ doc.addPage(); y = 24; }
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(accent[0],accent[1],accent[2]);
      doc.text('TERMS & CONDITIONS', M, y); y += 5;
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(60);
      terms.forEach((tm,i)=>{
        const line = (i+1) + '. ' + tm.title + ': ' + tm.body;
        const wrapped = doc.splitTextToSize(line, PW - M*2);
        wrapped.forEach(w=>{
          if(y > PH - 28){ doc.addPage(); y = 24; }
          doc.text(w, M, y); y += 4;
        });
      });
      if(d.extraNotes){
        y += 2;
        doc.splitTextToSize(d.extraNotes, PW - M*2).forEach(w=>{
          if(y > PH - 28){ doc.addPage(); y = 24; }
          doc.text(w, M, y); y += 4;
        });
      }
      y += 4;
    }

    /* --- signature / stamp --- */
    if(y > PH - 34){ doc.addPage(); y = 24; }
    const sx = PW - M - 58;
    doc.setFontSize(8.4); doc.setTextColor(40);
    doc.text('For ' + String(s.companyName||'JAYS TRADING AND BUSINESS SOLUTION').toUpperCase(), sx, y);
    if(s.signatureImage){
      try{ doc.addImage(s.signatureImage,'JPEG', sx, y+2, 40, 16); }catch(e){ console.warn('signature skipped',e); }
    }
    doc.setDrawColor(150); doc.setLineWidth(0.2);
    doc.line(sx, y+21, sx+56, y+21);
    doc.setFontSize(7.8); doc.setTextColor(90);
    doc.text('Authorised Signatory', sx, y+25);

    /* =====================================================================
       PAGE 2+: PRODUCT DETAILS & IMAGES
       A card grid, one per item, auto-flowing across as many pages as the
       item count needs - never a fixed page count. A missing image gets a
       clean placeholder box instead of ever breaking the PDF. --- */
    if(d.items.length){
      doc.addPage();
      let gy = 24;
      doc.setFont('helvetica','bold'); doc.setFontSize(12.5); doc.setTextColor(accent[0],accent[1],accent[2]);
      doc.text('PRODUCT DETAILS & IMAGES', M, gy);
      doc.setDrawColor(accent[0],accent[1],accent[2]); doc.setLineWidth(0.4);
      doc.line(M, gy+2, PW-M, gy+2);
      gy += 10;

      const cols = 3, gap = 6;
      const cardW = (PW - M*2 - gap*(cols-1)) / cols;
      const cardH = 62, imgH = 34;
      const maxRowsPerPage = Math.max(1, Math.floor((PH - gy - 18) / (cardH+gap)));
      let col = 0, row = 0;

      d.items.forEach((it,i)=>{
        if(row >= maxRowsPerPage){ doc.addPage(); gy = 24; row = 0; col = 0; }
        const cx = M + col*(cardW+gap);
        const cy = gy + row*(cardH+gap);
        doc.setDrawColor(225); doc.setLineWidth(0.2);
        doc.roundedRect(cx, cy, cardW, cardH, 1.5, 1.5, 'S');
        let imageDrawn = false;
        if(it.imageUrl){
          try{ doc.addImage(it.imageUrl, 'JPEG', cx+3, cy+3, cardW-6, imgH); imageDrawn = true; }
          catch(e){ console.warn('product gallery image skipped', e); }
        }
        if(!imageDrawn){
          doc.setFillColor(246,247,249); doc.rect(cx+3, cy+3, cardW-6, imgH, 'F');
          doc.setDrawColor(220); doc.rect(cx+3, cy+3, cardW-6, imgH, 'S');
          doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(170);
          doc.text('No Image', cx+cardW/2, cy+3+imgH/2+1, {align:'center'});
        }
        let ty = cy + imgH + 8;
        doc.setFont('helvetica','bold'); doc.setFontSize(7.6); doc.setTextColor(30);
        doc.splitTextToSize(it.itemName||'Item '+(i+1), cardW-6).slice(0,1).forEach(l=>doc.text(l, cx+3, ty));
        ty += 4;
        const specLine = [it.brand, it.model].filter(Boolean).join(' ') || String(it.specs||'').split('\n')[0] || '';
        if(specLine){
          doc.setFont('helvetica','normal'); doc.setFontSize(6.6); doc.setTextColor(110);
          doc.splitTextToSize(specLine, cardW-6).slice(0,1).forEach(l=>doc.text(l, cx+3, ty));
        }
        doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(accent[0],accent[1],accent[2]);
        doc.text('Qty: '+this.num(it.qty)+' '+(it.unit||'Nos')+'  \u2022  '+this.rupee(it.rate), cx+3, cy+cardH-3);
        col++;
        if(col>=cols){ col=0; row++; }
      });
    }

    /* =====================================================================
       FINAL PAGE: TERMS & CONDITIONS + COMPANY BRANDING
       Always the last page, however many product-gallery pages preceded
       it. No stock photograph - a geometric navy/orange band built from
       the company's own real, already-configured details, so it renders
       correctly even with zero image assets on file. --- */
    doc.addPage();
    let fy = 24;
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(accent[0],accent[1],accent[2]);
    doc.text('TERMS & CONDITIONS', M, fy); fy += 3;
    doc.setDrawColor(accent[0],accent[1],accent[2]); doc.setLineWidth(0.5);
    doc.line(M, fy, M+50, fy); fy += 7;

    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(60);
    const closingTerms = Store.data.rateTerms.filter(x=>d.termIds.includes(x.id) && x.isActive !== false);
    const bandH = 38;
    if(closingTerms.length){
      closingTerms.forEach((tm,i)=>{
        const line = (i+1) + '. ' + tm.title + ': ' + tm.body;
        doc.splitTextToSize(line, PW - M*2).forEach(l=>{
          if(fy > PH-bandH-16){ doc.addPage(); fy = 24; }
          doc.text(l, M, fy); fy += 4.3;
        });
      });
    } else {
      doc.setTextColor(140); doc.text('No specific terms selected for this offer.', M, fy); fy += 4.3;
    }
    fy += 5;

    if(infoFields.length){
      if(fy > PH-bandH-30){ doc.addPage(); fy = 24; }
      doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(30);
      doc.text('Payment, Delivery & Warranty', M, fy); fy += 6;
      doc.setFont('helvetica','normal'); doc.setFontSize(8.3);
      infoFields.forEach(([label,val])=>{
        if(fy > PH-bandH-10){ doc.addPage(); fy = 24; }
        doc.setTextColor(30); doc.text(String(label)+':', M, fy);
        doc.setTextColor(80);
        doc.splitTextToSize(String(val), PW-M*2-42).forEach((l,li)=>doc.text(l, M+40, fy+li*4));
        fy += 5;
      });
      fy += 4;
    }

    if(fy > PH-bandH-30){ doc.addPage(); fy = 24; }
    doc.setFont('helvetica','italic'); doc.setFontSize(12); doc.setTextColor(accent[0],accent[1],accent[2]);
    doc.text('Thank You!', M, fy); fy += 5.5;
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(80);
    doc.text('We appreciate your business and look forward to serving you again.', M, fy); fy += 8;

    /* "also on GeM" note - a plain text wordmark, not the official GeM
       logo artwork; we're naming the portal, not reproducing its branding. */
    if(fy > PH-bandH-20){ doc.addPage(); fy = 24; }
    const gemW = PW - M*2, gemH = 16;
    doc.setFillColor(minimal ? 250 : accent[0], minimal ? 250 : accent[1], minimal ? 250 : accent[2]);
    if(minimal){ doc.setDrawColor(210); doc.rect(M, fy, gemW, gemH, 'S'); }
    else doc.roundedRect(M, fy, gemW, gemH, 2, 2, 'F');
    const badgeColor = minimal ? [30,30,30] : [255,255,255];
    doc.setDrawColor(badgeColor[0],badgeColor[1],badgeColor[2]); doc.setLineWidth(0.6);
    doc.roundedRect(M+4, fy+3, 20, 10, 1.5, 1.5, 'S');
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(badgeColor[0],badgeColor[1],badgeColor[2]);
    doc.text('GeM', M+14, fy+9.5, {align:'center'});
    doc.text('Our products are also available on GeM (Government e-Marketplace)', M+29, fy+7);
    doc.setFont('helvetica','normal'); doc.setFontSize(8);
    doc.text('Search for us on gem.gov.in for direct government procurement', M+29, fy+12.5);

    /* Decorative branded band, pinned to the bottom of this closing page
       only - deliberately stops short of the universal footer zone below
       (drawn once, after every page exists) so that footer text always
       stays legible on a plain background on every page, including this one. */
    if(!minimal){
      const bandY = PH - bandH - 15;
      doc.setFillColor(11,20,36);
      doc.rect(0, bandY, PW, bandH, 'F');
      doc.setFillColor(accent[0],accent[1],accent[2]);
      doc.triangle(0, bandY, 34, bandY, 0, bandY+bandH, 'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(255);
      doc.text(String(s.companyName||'JAYS TRADING AND BUSINESS SOLUTION').toUpperCase(), M, bandY+10);
      if(s.companySlogan){
        doc.setFont('helvetica','italic'); doc.setFontSize(7.4); doc.setTextColor(200);
        doc.text(String(s.companySlogan), M, bandY+15);
      }
      doc.setFont('helvetica','normal'); doc.setFontSize(7.2); doc.setTextColor(185);
      const contactLine = [s.companyAddress, s.companyEmail, s.companyPhone].filter(Boolean).join('   \u2022   ');
      doc.splitTextToSize(contactLine, PW-M*2-70).slice(0,2).forEach((l,i)=>doc.text(l, M, bandY+20+i*4));
      doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(255);
      doc.text('Your Trusted Partner', PW-M, bandY+9, {align:'right'});
      doc.text('in Business Growth', PW-M, bandY+14, {align:'right'});
      doc.setFont('helvetica','normal'); doc.setFontSize(6.8); doc.setTextColor(220);
      ['Quality Products','Best Prices','Reliable Support'].forEach((t,i)=>doc.text('\u2713 '+t, PW-M, bandY+20+i*4.2, {align:'right'}));
    }

    /* --- footers: slim band + page numbers on every page --- */
    const pages = doc.internal.getNumberOfPages();
    for(let i=1;i<=pages;i++){
      doc.setPage(i);
      if(i>1 && !minimal){
        doc.setFillColor(accent[0],accent[1],accent[2]);
        doc.rect(0,0,PW,2,'F');
        doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(accent[0],accent[1],accent[2]);
        doc.text(String(s.companyName||'').toUpperCase(), M, 9);
        doc.setFont('helvetica','normal'); doc.setTextColor(120);
        doc.text(String(d.docType||'') + (d.docNumber ? ' \u2022 ' + d.docNumber : ''), PW-M, 9, {align:'right'});
        doc.setDrawColor(225); doc.line(M, 12, PW-M, 12);
      }
      doc.setFont('helvetica','normal'); doc.setFontSize(7.4); doc.setTextColor(130);
      doc.setDrawColor(228); doc.setLineWidth(0.2);
      doc.line(M, PH-13, PW-M, PH-13);
      doc.text('This is a computer generated offer document.', M, PH-9);
      doc.text('Page ' + i + ' of ' + pages, PW-M, PH-9, {align:'right'});
    }
    return doc;
  },

  fileName(){
    const d = this.draft;
    return ((d.docNumber || 'rate-offer') + (d.revision ? '-rev' + d.revision : '') + '.pdf')
      .replace(/[^a-z0-9.\-]+/gi,'-');
  },
  withPDF(fn, label){
    const errs = this.validate();
    if(errs.length){ this.showErrors(errs); UI.toast('Please fix the highlighted items'); return null; }
    try{ return fn(this.buildPDF()); }
    catch(e){ console.error(e); UI.toast((label||'PDF') + ' failed: ' + (e.message||'unknown error')); return null; }
  },
  preview(){
    this.withPDF(doc=>{
      const box = document.getElementById('rpPreviewFrame');
      if(box) box.src = doc.output('bloburl');
      const wrap = document.getElementById('rpPreviewWrap');
      if(wrap) wrap.style.display = 'block';
      UI.toast('Preview updated');
    }, 'Preview');
  },
  download(){
    this.withPDF(doc=>{ doc.save(this.fileName()); this.markGenerated(); }, 'Download');
  },
  print(){
    this.withPDF(doc=>{
      const url = doc.output('bloburl');
      const w = window.open(url,'_blank');
      if(w){ w.addEventListener('load', ()=>{ try{ w.print(); }catch(e){} }); }
      else UI.toast('Allow pop-ups to print');
      this.markGenerated();
    }, 'Print');
  },
  async markGenerated(){
    const d = this.draft;
    if(!d.id) return;                       // unsaved drafts are not promoted
    const rec = Store.data.rateDocs.find(x=>x.id===d.id);
    if(rec && rec.status === 'Draft'){
      rec.status = 'Generated'; d.status = 'Generated';
      rec.updatedAt = new Date().toISOString();
      await Store.save('rateDocs');
      await Activity.log('Rate PDF generated', d.docNumber || d.id);
    }
  },

  /* ---------------- validation ---------------- */
  validate(){
    const d = this.draft, e = [];
    if(!(d.customerName||'').trim()) e.push('Select a customer or enter a customer name.');
    if(!d.items.length) e.push('Add at least one item.');
    d.items.forEach((it,i)=>{
      if(!(it.itemName||'').trim()) e.push('Item ' + (i+1) + ': enter a description.');
      if(this.num(it.qty) <= 0)     e.push('Item ' + (i+1) + ': quantity must be more than zero.');
      if(this.num(it.rate) <= 0)    e.push('Item ' + (i+1) + ': rate must be more than zero.');
    });
    if(d.gstEnabled && this.num(d.gstRate) <= 0 && d.items.every(it=>this.itemGstRate(it) <= 0))
      e.push('GST is on but no GST rate has been set.');
    return e;
  },
  showErrors(errs){
    const b = document.getElementById('rpErrors');
    if(b) b.innerHTML = errs.length
      ? errs.map(x=>'<div class="wa-err">\u26A0 ' + Util.escapeHtml(x) + '</div>').join('') : '';
  },

  /* ---------------- template library (strict copy isolation) ---------------- */
  openLibrary(uid){
    const cards = list => list.length
      ? '<div class="wa-tpl-grid">' + list.map(t=>
          '<div class="wa-tpl-card' + (t.isActive===false?' inactive':'') + '">' +
          '<div class="wa-tpl-name">' + Util.escapeHtml(t.templateName||t.itemName||'Untitled') +
            (t.isActive===false?' <span class="badge badge-gray">Inactive</span>':'') + '</div>' +
          '<div class="wa-tpl-meta">' + [t.category,t.brand,t.model].filter(Boolean).map(Util.escapeHtml).join(' &middot; ') + '</div>' +
          '<div class="wa-tpl-price">' + this.rupee(t.defaultRate) + ' / ' + Util.escapeHtml(t.unit||'Nos') + '</div>' +
          '<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;">' +
            (uid ? '<button class="btn btn-primary btn-sm" onclick="RatePDF.applyTemplate(\'' + uid + '\',\'' + t.id + '\')">Use</button>' : '') +
            '<button class="btn btn-outline btn-sm" onclick="RatePDF.openTemplateForm(\'' + t.id + '\')">Edit</button>' +
            '<button class="btn btn-outline btn-sm" onclick="RatePDF.duplicateTemplate(\'' + t.id + '\')">Duplicate</button>' +
            '<button class="btn btn-outline btn-sm" onclick="RatePDF.toggleTemplate(\'' + t.id + '\')">' + (t.isActive===false?'Activate':'Deactivate') + '</button>' +
            '<button class="icon-btn" title="Delete" onclick="RatePDF.deleteTemplate(\'' + t.id + '\')">&#128465;</button>' +
          '</div></div>').join('') + '</div>'
      : '<div class="empty-state"><div class="ic">&#128196;</div><div class="t">No templates yet</div>' +
        '<div class="d">Build an item below and use "Save as Template" to reuse it next time.</div></div>';
    window.__rpTplCards = cards;
    window.__rpTplUid = uid || '';
    UI.openModal('Rate Template Library',
      '<div class="toolbar" style="margin:0 0 10px;">' +
        '<div class="search"><span class="ic">&#128269;</span>' +
        '<input id="rpTplSearch" placeholder="Search name, item, brand, model, SKU, category..." oninput="RatePDF.filterTemplates()"></div>' +
        '<button class="btn btn-primary btn-sm" onclick="RatePDF.openTemplateForm(null)">&#65291; New Template</button>' +
      '</div><div id="rpTplList">' + cards(Store.data.rateTemplates) + '</div>',
      '<button class="btn btn-outline" onclick="UI.closeModal()">Close</button>', true);
  },
  filterTemplates(){
    const q = (document.getElementById('rpTplSearch').value||'').toLowerCase();
    const list = Store.data.rateTemplates.filter(t=>!q ||
      [t.templateName,t.itemName,t.brand,t.model,t.sku,t.category].some(v=>(v||'').toLowerCase().includes(q)));
    document.getElementById('rpTplList').innerHTML = window.__rpTplCards(list);
  },
  /* Applying a template COPIES its values into the draft item. The stored
     template object is never handed out by reference and never written here. */
  applyTemplate(uid, tid){
    const t = Store.data.rateTemplates.find(x=>x.id===tid);
    const it = this.draft.items.find(x=>x.uid===uid);
    if(!t || !it) return;
    it.templateId = t.id;
    it.itemName = t.itemName || '';
    it.brand    = t.brand || '';
    it.model    = t.model || '';
    it.category = t.category || '';
    it.specs    = t.specs || '';
    it.unit     = t.unit || 'Nos';
    it.qty      = t.defaultQty || 1;
    it.rate     = (t.defaultRate===''||t.defaultRate==null) ? '' : Number(t.defaultRate);
    it.discount = (t.discount===''||t.discount==null) ? '' : Number(t.discount);
    it.gstRate  = (t.gstRate===''||t.gstRate==null) ? '' : Number(t.gstRate);
    it.imageUrl = t.imageUrl || '';
    UI.closeModal();
    this.render();
    UI.toast('Loaded "' + (t.templateName||t.itemName) + '" into this item');
  },
  openTemplateForm(id){
    const rec = id ? Store.data.rateTemplates.find(x=>x.id===id) : null;
    const v = rec || {templateName:'',itemName:'',brand:'',model:'',sku:'',category:'',specs:'',
                      defaultQty:1,defaultRate:'',discount:'',gstRate:'',unit:'Nos',imageUrl:'',
                      warranty:'',deliveryTerms:'',paymentTerms:'',validity:'',notes:'',isActive:true};
    const cats = [...new Set(Store.data.products.map(p=>p.category).filter(Boolean))].sort();
    UI.openModal(rec?'Edit Template':'New Template',
      '<div class="field"><label>Template Name *</label><input id="rt_templateName" value="' + Util.escapeHtml(v.templateName) + '"></div>' +
      '<div class="form-row">' +
        '<div class="field"><label>Item Name *</label><input id="rt_itemName" value="' + Util.escapeHtml(v.itemName) + '"></div>' +
        '<div class="field"><label>Category</label><input id="rt_category" list="rtCats" value="' + Util.escapeHtml(v.category) + '">' +
          '<datalist id="rtCats">' + cats.map(c=>'<option value="' + Util.escapeHtml(c) + '">').join('') + '</datalist></div>' +
      '</div>' +
      '<div class="form-row">' +
        '<div class="field"><label>Brand</label><input id="rt_brand" value="' + Util.escapeHtml(v.brand) + '"></div>' +
        '<div class="field"><label>Model</label><input id="rt_model" value="' + Util.escapeHtml(v.model) + '"></div>' +
      '</div>' +
      '<div class="form-row">' +
        '<div class="field"><label>SKU</label><input id="rt_sku" value="' + Util.escapeHtml(v.sku) + '"></div>' +
        '<div class="field"><label>Unit</label><input id="rt_unit" value="' + Util.escapeHtml(v.unit||'Nos') + '"></div>' +
      '</div>' +
      '<div class="form-row">' +
        '<div class="field"><label>Default Qty</label><input id="rt_defaultQty" type="number" min="1" value="' + (v.defaultQty||1) + '"></div>' +
        '<div class="field"><label>Default Rate</label><input id="rt_defaultRate" type="number" step="0.01" value="' + (v.defaultRate===''||v.defaultRate==null?'':v.defaultRate) + '"></div>' +
      '</div>' +
      '<div class="form-row">' +
        '<div class="field"><label>Default Discount</label><input id="rt_discount" type="number" step="0.01" value="' + (v.discount===''||v.discount==null?'':v.discount) + '"></div>' +
        '<div class="field"><label>GST % <span class="hint">(optional)</span></label><input id="rt_gstRate" type="number" step="0.01" placeholder="leave blank" value="' + (v.gstRate===''||v.gstRate==null?'':v.gstRate) + '"></div>' +
      '</div>' +
      '<div class="field"><label>Specifications (one per line)</label><textarea id="rt_specs" rows="5">' + Util.escapeHtml(v.specs) + '</textarea></div>' +

  async saveTemplate(id){

    if(!item){ UI.toast('Item name is required'); return; }

      UI.toast('A template with that name already exists'); return;
    }
    const ex = id ? Store.data.rateTemplates.find(x=>x.id===id) : null;
    const num = x => g(x)==='' ? '' : Number(g(x));
    const rec = {
      id: id || 'RT' + String(Store.data.rateTemplates.length+1).padStart(3,'0'),
      migratedFrom: ex ? (ex.migratedFrom||'') : '',
      templateName:name, itemName:item, brand:g('brand').trim(), model:g('model').trim(),
      sku:g('sku').trim(), category:g('category').trim(), specs:g('specs'),
      description: ex ? (ex.description||'') : '',
      defaultQty: Number(g('defaultQty'))||1, defaultRate:num('defaultRate'),
      discount:num('discount'), gstEnabled: ex ? !!ex.gstEnabled : false, gstRate:num('gstRate'),
      unit:g('unit').trim()||'Nos', imageUrl:g('imageUrl').trim() || (ex?ex.imageUrl||'':''),
      warranty:g('warranty').trim(), deliveryTerms:g('deliveryTerms').trim(),
      paymentTerms:g('paymentTerms').trim(), validity:g('validity').trim(),
      notes:g('notes'), isActive: document.getElementById('rt_isActive').checked,
      createdBy: ex ? ex.createdBy : ((Auth.session && (Auth.session.name||Auth.session.username))||'System'),
      createdAt: ex ? ex.createdAt : new Date().toISOString(),
      updatedAt: new Date().toISOString()
    };
    if(id){ const i = Store.data.rateTemplates.findIndex(x=>x.id===id); Store.data.rateTemplates[i]=rec; }
    else Store.data.rateTemplates.unshift(rec);
    const ok = await Store.save('rateTemplates');
    if(ok) await Activity.log(id?'Rate template updated':'Rate template created', name);
    this.openLibrary(window.__rpTplUid);
  },
  async duplicateTemplate(id){
    const t = Store.data.rateTemplates.find(x=>x.id===id); if(!t) return;
    let base = (t.templateName||'Template') + ' (copy)', name = base, n = 2;
    while(Store.data.rateTemplates.some(x=>(x.templateName||'').toLowerCase()===name.toLowerCase())){ name = base+' '+n; n++; }
    const now = new Date().toISOString();
    Store.data.rateTemplates.unshift(Object.assign({}, t, {
      id:'RT'+String(Store.data.rateTemplates.length+1).padStart(3,'0'), templateName:name,
      migratedFrom:'', createdAt:now, updatedAt:now,
      createdBy:(Auth.session && (Auth.session.name||Auth.session.username))||'System'
    }));
    const ok = await Store.save('rateTemplates');
    if(ok) await Activity.log('Rate template duplicated', name);

  /* ---------------- document save / history / revisions ---------------- */
  nextDocNumber(){
    const s = Store.data.settings;
    return (s.ratePrefix||'RO-') + String(s.rateNext||1).padStart(4,'0');
  },
  async saveDraft(){
    const d = this.draft;
    if(!(d.customerName||'').trim()){ UI.toast('Select a customer first'); return; }
    const now = new Date().toISOString();
    if(!d.id){
      d.id = 'RD' + String(Store.data.rateDocs.length+1).padStart(4,'0');
      d.docNumber = d.docNumber || this.nextDocNumber();
      d.createdAt = now;
      Store.data.rateDocs.unshift(JSON.parse(JSON.stringify(Object.assign({}, d, {updatedAt:now}))));
      Store.data.settings.rateNext = (Store.data.settings.rateNext||1) + 1;
      await Store.save('settings');
    } else {
      const rec = Store.data.rateDocs.find(x=>x.id===d.id);
      if(rec && rec.status === 'Final'){
        UI.toast('This document is Final \u2014 use Create Revision instead'); return;
      }
      d.updatedAt = now;
      const i = Store.data.rateDocs.findIndex(x=>x.id===d.id);
      if(i>=0) Store.data.rateDocs[i] = JSON.parse(JSON.stringify(d));
    }
    const ok = await Store.save('rateDocs');
    if(ok){ await Activity.log('Rate document saved', d.docNumber||d.id); UI.toast('Saved'); }
    this.render();
  },
  async markFinal(){
    const d = this.draft;
    if(!d.id){ UI.toast('Save the document first'); return; }
    if(!confirm('Mark ' + (d.docNumber||d.id) + ' as Final? Final documents cannot be edited \u2014 you would create a revision instead.')) return;
    const rec = Store.data.rateDocs.find(x=>x.id===d.id); if(!rec) return;
    rec.status = 'Final'; d.status = 'Final'; rec.updatedAt = new Date().toISOString();
    const ok = await Store.save('rateDocs');
    if(ok){ await Activity.log('Rate document finalised', d.docNumber||d.id); UI.toast('Marked Final'); }
    this.render();
  },
  /* A revision is a NEW record; the original is never overwritten. */
  async createRevision(id){
    const src = Store.data.rateDocs.find(x=>x.id===(id||this.draft.id));
    if(!src){ UI.toast('Save the document first'); return; }
    const root = src.parentId || src.id;
    const rev = Math.max(0, ...Store.data.rateDocs
      .filter(x=>x.id===root || x.parentId===root).map(x=>Number(x.revision)||0)) + 1;
    const now = new Date().toISOString();
    const copy = JSON.parse(JSON.stringify(src));
    copy.id = 'RD' + String(Store.data.rateDocs.length+1).padStart(4,'0');
    copy.parentId = root;
    copy.revision = rev;
    copy.status = 'Draft';
    copy.docNumber = (src.docNumber||'') + '-R' + rev;
    copy.docDate = Util.todayISO();
    copy.createdAt = now; copy.updatedAt = now;
    Store.data.rateDocs.unshift(copy);
    const ok = await Store.save('rateDocs');
    if(ok) await Activity.log('Rate document revision created', copy.docNumber);
    this.draft = JSON.parse(JSON.stringify(copy));
    this.viewMode = 'editor'; UI.closeModal(); this.render();
    UI.toast('Revision ' + rev + ' created');
  },
  async duplicateDoc(id){
    const src = Store.data.rateDocs.find(x=>x.id===id); if(!src) return;
    const copy = JSON.parse(JSON.stringify(src));
    copy.id=''; copy.parentId=''; copy.revision=0; copy.status='Draft';
    copy.docNumber=''; copy.docDate=Util.todayISO(); copy.createdAt=''; copy.updatedAt='';
    this.draft = copy;
    this.viewMode = 'editor'; UI.closeModal(); this.render();
    UI.toast('Copied into a new document \u2014 Save Draft to keep it');
  },
  loadDoc(id){
    const rec = Store.data.rateDocs.find(x=>x.id===id); if(!rec) return;
    this.draft = JSON.parse(JSON.stringify(rec));   // deep copy: editing never mutates the stored row
    if(!Array.isArray(this.draft.items) || !this.draft.items.length) this.draft.items = [this.blankItem()];
    if(!Array.isArray(this.draft.termIds)) this.draft.termIds = [];
    this.viewMode = 'editor'; UI.closeModal(); this.render();
  },
  async deleteDoc(id){
    const rec = Store.data.rateDocs.find(x=>x.id===id); if(!rec) return;
    if(!confirm('Delete document ' + (rec.docNumber||rec.id) + '? This cannot be undone.')) return;
    Store.data.rateDocs = Store.data.rateDocs.filter(x=>x.id!==id);
    const ok = await Store.save('rateDocs');
    if(ok){ await Activity.log('Rate document deleted', rec.docNumber||rec.id); UI.toast('Deleted'); }
    if(this.draft.id === id) this.draft = this.blankDraft();
    this.viewMode = 'list'; this.render();
  },
  openHistory(){ this.switchToList(''); },

  /* ---------------- Saved / Draft / New switcher + inline list ----------------
     Reuses Store.data.rateDocs as the single source of truth - no parallel
     data system. The "Saved" and "Draft" quick-tabs are just presets for the
     same status filter the list itself exposes for full control. */
  viewMode: 'editor',

  switchToList(presetStatus){

  filteredDocs(){
    const f = this.listFilter;
    let list = Store.data.rateDocs.slice();
    if(f.status) list = list.filter(r=>r.status===f.status);
    if(f.q){
      const q = f.q.toLowerCase();
      list = list.filter(r=>(r.docNumber||'').toLowerCase().includes(q) ||
        (r.customerName||'').toLowerCase().includes(q) || (r.phone||'').includes(q));
    }
    list.sort((a,b)=>String(b.updatedAt||b.createdAt||'').localeCompare(String(a.updatedAt||a.createdAt||'')));
    return list;

  docStatusBadge(st){
    const colors = {Draft:'gray', Generated:'blue', Sent:'blue', Viewed:'violet', Negotiation:'amber',
      Accepted:'green', Rejected:'red', Expired:'gray', Final:'green', Cancelled:'gray'};
    return '<span class="badge badge-' + (colors[st]||'amber') + '">' + Util.escapeHtml(st||'Draft') + '</span>';
  },
  /* Runs fn against a temporary copy of a saved document without disturbing
     whatever is currently open in the editor. */
  _withBorrowedDraft(id, fn){
    const rec = Store.data.rateDocs.find(x=>x.id===id);
    if(!rec){ UI.toast('That document could not be found'); return; }
    const saved = this.draft;
    this.draft = JSON.parse(JSON.stringify(rec));
    const errs = this.validate();
    if(errs.length){ this.draft = saved; UI.toast('That document is missing required fields'); return; }
    try{ fn(this.draft); } finally { this.draft = saved; }
  },

    this._withBorrowedDraft(id, ()=>{
      try{ window.open(this.buildPDF().output('bloburl'), '_blank'); }
      catch(e){ console.error(e); UI.toast('Preview failed: ' + (e.message||'unknown error')); }
    });
  },
  downloadDocById(id){
    this._withBorrowedDraft(id, ()=>{
      try{ this.buildPDF().save(this.fileName()); }
      catch(e){ console.error(e); UI.toast('Download failed: ' + (e.message||'unknown error')); }
    });
  },

  /* ---------------- whole-document templates
     "Save as Template" snapshots EVERYTHING (items, GST, terms, theme,
     doc type) but blanks the customer-specific fields, so next time the
     user just picks a party and everything else is ready. ---------------- */
  saveDocAsTemplate(){
    const d = this.draft;
    if(!d.items.some(it=>(it.itemName||'').trim())){ UI.toast('Add at least one item first'); return; }
    UI.openModal('Save Document as Template',
      '<div class="field"><label>Template Name *</label><input id="rdtName" placeholder="e.g. Standard Waste Bin Offer"></div>' +
      '<div class="hint">Saves every item, rate, GST setting and the selected terms. Customer details are left blank so next time you only fill in the party.</div>',
      '<button class="btn btn-outline" onclick="UI.closeModal()">Cancel</button>' +
      '<button class="btn btn-primary" onclick="RatePDF.confirmSaveDocTemplate()">Save Template</button>');
  },
  async confirmSaveDocTemplate(){
    const name = document.getElementById('rdtName').value.trim();
    if(!name){ UI.toast('Template name is required'); return; }
    if(Store.data.rateDocTemplates.some(t=>(t.name||'').toLowerCase()===name.toLowerCase())){
      UI.toast('A document template with that name already exists'); return;
    }
    const now = new Date().toISOString();
    const snap = JSON.parse(JSON.stringify(this.draft));
    // Strip everything specific to this one customer / this one saved record.
    ['id','parentId','revision','status','docNumber','createdAt','updatedAt',
     'customerId','customerName','contactPerson','phone','email','address',
     'district','gstin','customerRef'].forEach(f=>delete snap[f]);
    const rec = { id:'DT'+String(Store.data.rateDocTemplates.length+1).padStart(3,'0'),
      name, snapshot: snap,
      createdBy:(Auth.session && (Auth.session.name||Auth.session.username))||'System',
      createdAt: now, updatedAt: now };
    Store.data.rateDocTemplates.unshift(rec);
    const ok = await Store.save('rateDocTemplates');
    if(ok){ await Activity.log('Document template saved', name); UI.toast('Document template saved'); }
    UI.closeModal();
  },
  openDocTemplates(){
    const list = Store.data.rateDocTemplates;
    UI.openModal('Document Templates',
      list.length
        ? '<div class="table-wrap"><table><thead><tr><th>Actions</th><th>Template</th><th>Items</th><th>GST</th><th>Saved</th></tr></thead><tbody>' +
          list.map(t=>'<tr>' +
            '<td style="display:flex;gap:4px;">' +
              '<button class="btn btn-primary btn-sm" onclick="RatePDF.useDocTemplate(\'' + t.id + '\')">Use</button>' +
              '<button class="icon-btn" title="Delete" onclick="RatePDF.deleteDocTemplate(\'' + t.id + '\')">&#128465;</button>' +
            '</td>' +
            '<td class="cell-main">' + Util.escapeHtml(t.name) + '</td>' +
            '<td class="cell-mute">' + t.snapshot.items.length + '</td>' +
            '<td class="cell-mute">' + (t.snapshot.gstEnabled?'Yes':'No') + '</td>' +
            '<td class="cell-mute">' + Util.fmtDate(t.createdAt) + '</td></tr>').join('') + '</tbody></table></div>'
        : '<div class="empty-state"><div class="ic">&#128203;</div><div class="t">No document templates yet</div>' +
          '<div class="d">Build a rate offer, then use "Save as Template" to reuse the whole thing next time \u2014 just swap the party.</div></div>',
      '<button class="btn btn-outline" onclick="UI.closeModal()">Close</button>', true);
  },
  /* Deep-copies the saved snapshot into a fresh draft; the customer fields
     start blank so the user only has to pick/enter the party. */
  useDocTemplate(id){
    const t = Store.data.rateDocTemplates.find(x=>x.id===id);
    if(!t) return;
    const fresh = this.blankDraft();
    this.draft = Object.assign(fresh, JSON.parse(JSON.stringify(t.snapshot)), {
      id:'', parentId:'', revision:0, status:'Draft', docNumber:'',
      customerId:'', customerName:'', contactPerson:'', phone:'', email:'',
      address:'', district:'', gstin:'', customerRef:'',
      docDate: Util.todayISO(), createdAt:'', updatedAt:'',
      createdBy:(Auth.session && (Auth.session.name||Auth.session.username))||'System'
    });
    this.draft.items = this.draft.items.map(it=>Object.assign({}, it, {uid:'I'+Date.now()+Math.floor(Math.random()*1000)}));
    UI.closeModal(); this.render();
    UI.toast('Loaded "' + t.name + '" \u2014 pick a customer and you\'re ready to send');
  },
  async deleteDocTemplate(id){
    const t = Store.data.rateDocTemplates.find(x=>x.id===id); if(!t) return;
    if(!confirm('Delete document template "' + t.name + '"?')) return;
    Store.data.rateDocTemplates = Store.data.rateDocTemplates.filter(x=>x.id!==id);
    const ok = await Store.save('rateDocTemplates');
    if(ok){ await Activity.log('Document template deleted', t.name); UI.toast('Deleted'); }
    this.openDocTemplates();
  },
  newDoc(){
    if(this.viewMode==='editor' && this.draft && this.draft.items.some(i=>i.itemName) && !confirm('Discard the current unsaved document?')) return;
    this.draft = this.blankDraft();
    this.viewMode = 'editor';
    this.render();
  },

  /* Any status short of Final can be changed freely (Sent/Viewed/
     Negotiation/Accepted/Rejected/Expired/Cancelled) - only "Final"
     keeps its existing lock, unchanged, requiring a revision instead. */
  async setStatus(newStatus){
    const d = this.draft;
    if(!d.id){ UI.toast('Save the document first'); return; }
    const rec = Store.data.rateDocs.find(x=>x.id===d.id);
    if(!rec){ UI.toast('Could not find this document to update'); return; }
    rec.status = newStatus; d.status = newStatus; rec.updatedAt = new Date().toISOString();
    const ok = await Store.save('rateDocs');
    if(ok){ await Activity.log('Rate/Offer status changed', (d.docNumber||d.id)+' \u2192 '+newStatus); UI.toast('Status: '+newStatus); }
    this.render();
  },
  /* Creates a real record in the existing Orders module (not a parallel
     order system) - items are summarised into Orders' single product-
     name field since Orders doesn't carry line items the way a Rate/
     Offer does; the full item breakdown remains on the source document. */
  async convertToOrder(){
    const d = this.draft;
    if(!d.customerName){ UI.toast('This document has no customer to convert'); return; }
    const productSummary = d.items.map(it=>it.itemName).filter(Boolean).join(', ') || 'See Rate/Offer '+(d.docNumber||d.id);
    const rec = {
      id: (Store.data.settings.ordPrefix||'ORD-')+String(Store.data.settings.ordNext||1).padStart(4,'0'),
      customerId: d.customerId||'', orderDate: Util.todayISO(),
      gemcNumber:'', orderFrom: 'Rate/Offer '+(d.docNumber||d.id),
      productName: productSummary, party: d.customerName, phone: d.phone||'',
      assignedTo: (Auth.session && (Auth.session.name||Auth.session.username))||'', status:'In Progress'
    };
    Store.data.orders.unshift(rec);
    Store.data.settings.ordNext = (Store.data.settings.ordNext||1) + 1;
    const ok1 = await Store.save('orders');
    const ok2 = await Store.save('settings');
    if(ok1 && ok2) await Activity.log('Rate/Offer converted to Order', (d.docNumber||d.id)+' \u2192 '+rec.id);
    UI.toast('Order '+rec.id+' created');
    go('orders');
  }
};

/* =====================================================================
   ATTENDANCE & LEAVE MANAGEMENT  (namespace: Attendance)
   Reuses the existing Store (Supabase-backed jays_crm_store), the
   existing profiles-driven user list, the existing modal/toast system,
   Paginate, dashboardCardsHTML and the col-actions table convention -
   no parallel data system, no new global UI components.

     Store.data.attendance     (jays_attendance)     - one row per employee per day
     Store.data.leaveRequests  (jays_leaverequests)  - leave applications + approval state

   Permissions: every signed-in user can see their own attendance/leave;
   only Admins (Auth.isAdmin(), the same check already used for Users &
   Settings) can see/edit everyone's records and approve/reject leave.
===================================================================== */
const Attendance = {
  tab: 'today',
  teamFilter: { userId:'', month:'', status:'' },

  /* ---------------- helpers ---------------- */
  todayRecord(userId){
    const uid = userId || (Auth.session && Auth.session.id);
    return Store.data.attendance.find(a=>a.userId===uid && a.date===Util.todayISO());
  },
  userLabel(u){ return (u && (u.name||u.username)) || 'Unknown'; },
  daysBetween(from, to){
    const a = new Date(from+'T00:00:00'), b = new Date(to+'T00:00:00');
    if(isNaN(a)||isNaN(b)||b<a) return 0;
    return Math.round((b-a)/86400000)+1;
  },
  eachDate(from, to){
    const out = []; let d = new Date(from+'T00:00:00'); const end = new Date(to+'T00:00:00');
    while(d<=end){ out.push(d.toISOString().slice(0,10)); d.setDate(d.getDate()+1); }
    return out;
  },

  /* ---------------- first login of the day ---------------- */
  checkFirstLoginToday(){
    if(!Auth.session) return;
    if(Store.data.loadFailed && Store.data.loadFailed['jays_attendance']) return;
    if(this.todayRecord()) return;              // already recorded today - never re-ask
    setTimeout(()=>this.promptWorkLocation(), 400);
  },
  promptWorkLocation(){
    if(this.todayRecord()) return;               // e.g. an admin already logged it for them
    UI.openModal('Where are you working today?',
      '<div style="display:flex;gap:14px;justify-content:center;padding:10px 0 4px;">' +
        '<button class="btn btn-primary" style="flex:1;padding:22px 10px;font-size:15px;" onclick="Attendance.markAttendance(\'Office\')">&#127970;<br>Office</button>' +
        '<button class="btn btn-primary" style="flex:1;padding:22px 10px;font-size:15px;" onclick="Attendance.markAttendance(\'Home\')">&#127968;<br>Home</button>' +
      '</div>' +
      '<div class="hint" style="text-align:center;margin-top:8px;">This is asked once per day and saves your login time automatically.</div>',
      '', false);
    // This is the one shared close (\u00d7) button used by every modal in the
    // app; it isn't re-created per modal, so it must be explicitly hidden
    // here and restored the moment a choice is made (see markAttendance)
    // rather than left hidden for whatever modal opens next.
    const closeBtn = document.querySelector('#modalBox .modal-close');
    if(closeBtn) closeBtn.style.display = 'none';
  },
  async markAttendance(location){
    const closeBtn = document.querySelector('#modalBox .modal-close');
    if(closeBtn) closeBtn.style.display = '';    // restore before this modal closes
    if(this.todayRecord()){ UI.closeModal(); return; }
    const s = Auth.session;
    const rec = {
      id: Util.uid('ATT', Store.data.attendance),
      userId: s.id, username: s.username, name: s.name || s.username,
      date: Util.todayISO(), loginTime: new Date().toISOString(), logoutTime: '',
      location, status: 'Present', editedBy: '', notes: ''
    };
    Store.data.attendance.unshift(rec);
    const ok = await Store.save('attendance');
    if(ok) await Activity.log('Attendance marked', rec.name+' — '+location+' ('+rec.date+')');
    UI.closeModal();
    if(UI.currentView==='attendance') Attendance.render();
  },
  /* Best-effort: called from Auth.logout(). Never allowed to block or
     break the actual sign-out, so every failure mode is swallowed here. */
  async markLogoutTime(){
    try{
      const rec = this.todayRecord();
      if(!rec || rec.logoutTime) return;
      rec.logoutTime = new Date().toISOString();
      await Store.save('attendance');
    }catch(e){ console.error('markLogoutTime failed (non-blocking)', e); }
  },
  async manualLogout(){
    const rec = this.todayRecord();
    if(!rec){ UI.toast('No attendance recorded yet today'); return; }
    if(rec.logoutTime){ UI.toast('Logout time already recorded'); return; }
    rec.logoutTime = new Date().toISOString();
    const ok = await Store.save('attendance');
    if(ok) UI.toast('Logout time recorded');
    this.render();
  },
  /* ---------------- leave: apply ---------------- */
  openLeaveForm(){
    const today = Util.todayISO();
    UI.openModal('Apply for Leave',
      '<div class="form-row">' +
        '<div class="field"><label>From Date *</label><input type="date" id="lv_from" value="'+today+'"></div>' +
        '<div class="field"><label>To Date *</label><input type="date" id="lv_to" value="'+today+'"></div>' +
      '</div>' +
      '<div class="field"><label>Leave Type *</label><select id="lv_type">'+DROPDOWNS.leaveType.map(t=>'<option>'+t+'</option>').join('')+'</select></div>' +
      '<div class="field"><label>Reason *</label><textarea id="lv_reason" rows="3" placeholder="Briefly explain the reason for leave"></textarea></div>',
      '<button class="btn btn-outline" onclick="UI.closeModal()">Cancel</button>' +
      '<button class="btn btn-primary" onclick="Attendance.saveLeaveRequest()">Submit Request</button>');
  },
  async saveLeaveRequest(){
    const from = document.getElementById('lv_from').value;
    const to = document.getElementById('lv_to').value;
    const type = document.getElementById('lv_type').value;
    const reason = document.getElementById('lv_reason').value.trim();
    if(!from || !to){ UI.toast('Select both dates'); return; }
    const days = this.daysBetween(from, to);
    if(days<=0){ UI.toast('"To" date must be on or after "From" date'); return; }
    if(!reason){ UI.toast('Enter a reason for the leave'); return; }
    const s = Auth.session;
    const rec = {
      id: Util.uid('LV', Store.data.leaveRequests),
      userId: s.id, username: s.username, name: s.name || s.username,
      fromDate: from, toDate: to, days, leaveType: type, reason,
      status: 'Pending', appliedAt: new Date().toISOString(),
      decidedBy: '', decidedAt: '', decisionNote: ''
    };
    Store.data.leaveRequests.unshift(rec);
    const ok = await Store.save('leaveRequests');
    if(ok) await Activity.log('Leave applied', rec.name+' — '+type+' ('+from+' to '+to+')');
    UI.closeModal(); this.render();
  },
  async deleteLeave(id){
    const rec = Store.data.leaveRequests.find(x=>x.id===id);
    if(!rec) return;
    const isOwner = Auth.session && rec.userId===Auth.session.id;
    if(!isOwner && !Auth.isAdmin()){ UI.toast("You don't have permission to remove this request"); return; }
    if(rec.status!=='Pending' && !Auth.isAdmin()){ UI.toast('Only a pending request can be withdrawn'); return; }
    if(!confirm('Withdraw this leave request?')) return;
    Store.data.leaveRequests = Store.data.leaveRequests.filter(x=>x.id!==id);
    const ok = await Store.save('leaveRequests');
    if(ok) await Activity.log('Leave request withdrawn', rec.name);
    this.render();
  },

  /* ---------------- leave: approve / reject (Admin only) ---------------- */
  /* Auto-marks the approved date range as Leave in Attendance, but only
     for dates that don't already have a record - never overwrites a day
     someone actually logged in for, or one an admin already edited. */
  async syncLeaveAttendance(rec, approved){
    let changed = false;
    if(approved){
      this.eachDate(rec.fromDate, rec.toDate).forEach(date=>{
        const exists = Store.data.attendance.some(a=>a.userId===rec.userId && a.date===date);
        if(!exists){
          Store.data.attendance.push({
            id: Util.uid('ATT', Store.data.attendance), userId:rec.userId, username:rec.username, name:rec.name,
            date, loginTime:'', logoutTime:'', location:'', status:'Leave',
            editedBy:'', notes:'Auto-added from approved leave '+rec.id, fromLeave: rec.id
          });
          changed = true;
        }
      });
    } else {
      const before = Store.data.attendance.length;
      Store.data.attendance = Store.data.attendance.filter(a=>a.fromLeave!==rec.id);
      changed = Store.data.attendance.length !== before;
    }
    if(changed) await Store.save('attendance');
  },
  async decideLeave(id, decision){
    if(!Auth.isAdmin()){ UI.toast('Only an administrator can approve or reject leave'); return; }
    const rec = Store.data.leaveRequests.find(x=>x.id===id);
    if(!rec) return;
    rec.status = decision;
    rec.decidedBy = Auth.session.name || Auth.session.username;
    rec.decidedAt = new Date().toISOString();
    const ok = await Store.save('leaveRequests');
    await this.syncLeaveAttendance(rec, decision==='Approved');
    if(ok) await Activity.log('Leave '+decision.toLowerCase(), rec.name+' — '+rec.fromDate+' to '+rec.toDate);
    this.render();
  },
  /* ---------------- admin: edit / add attendance ---------------- */
  openAttendanceForm(id){
    if(!Auth.isAdmin()){ UI.toast('Only an administrator can edit attendance'); return; }
    const rec = id ? Store.data.attendance.find(x=>x.id===id) : null;
    const v = rec || {userId:'', date:Util.todayISO(), location:'Office', status:'Present', logoutTime:'', notes:''};
    UI.openModal(rec?'Edit Attendance':'Add Attendance Record',
      '<div class="form-row">' +
        '<div class="field"><label>Employee *</label><select id="at_user" '+(rec?'disabled':'')+'>' +
          '<option value="">Select...</option>' +
          Store.data.users.map(u=>'<option value="'+u.id+'" '+(v.userId===u.id?'selected':'')+'>'+Util.escapeHtml(Attendance.userLabel(u))+'</option>').join('') +
        '</select></div>' +
        '<div class="field"><label>Date *</label><input type="date" id="at_date" value="'+v.date+'" '+(rec?'disabled':'')+'></div>' +
      '</div>' +
      '<div class="form-row">' +
        '<div class="field"><label>Status</label><select id="at_status">'+DROPDOWNS.attendanceStatus.map(s=>'<option '+(v.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div>' +
        '<div class="field"><label>Work Location</label><select id="at_location"><option value="">-</option>'+['Office','Home'].map(l=>'<option '+(v.location===l?'selected':'')+'>'+l+'</option>').join('')+'</select></div>' +
      '</div>' +
      '<div class="field"><label>Logout Time</label><input type="time" id="at_logout" value="'+(v.logoutTime?new Date(v.logoutTime).toTimeString().slice(0,5):'')+'"></div>' +
      '<div class="field"><label>Notes</label><textarea id="at_notes" rows="2">'+Util.escapeHtml(v.notes||'')+'</textarea></div>',
      '<button class="btn btn-outline" onclick="UI.closeModal()">Cancel</button>' +
      '<button class="btn btn-primary" onclick="Attendance.saveAttendanceForm(\''+(id||'')+'\')">Save</button>');
  },
  async saveAttendanceForm(id){
    const userId = document.getElementById('at_user').value;
    const date = document.getElementById('at_date').value;
    if(!userId || !date){ UI.toast('Select an employee and date'); return; }
    const status = document.getElementById('at_status').value;
    const location = document.getElementById('at_location').value;
    const logoutTimeStr = document.getElementById('at_logout').value;
    const notes = document.getElementById('at_notes').value;
    const admin = Auth.session.name || Auth.session.username;
    if(id){
      const rec = Store.data.attendance.find(x=>x.id===id);
      if(!rec){ UI.toast('Record not found'); return; }
      rec.status = status; rec.location = location; rec.notes = notes; rec.editedBy = admin;
      if(logoutTimeStr){ const d = new Date(rec.date+'T'+logoutTimeStr+':00'); rec.logoutTime = d.toISOString(); }
    } else {
      if(Store.data.attendance.some(a=>a.userId===userId && a.date===date)){
        UI.toast('An attendance record already exists for that employee and date — edit it instead'); return;
      }
      const u = Store.data.users.find(x=>x.id===userId);
      Store.data.attendance.unshift({
        id: Util.uid('ATT', Store.data.attendance), userId, username: u?u.username:'', name: u?Attendance.userLabel(u):'',
        date, loginTime:'', logoutTime: logoutTimeStr ? new Date(date+'T'+logoutTimeStr+':00').toISOString() : '',
        location, status, editedBy: admin, notes
      });
    }
    const ok = await Store.save('attendance');
    if(ok) await Activity.log(id?'Attendance edited':'Attendance added', date+' — '+status);
    UI.closeModal(); this.render();
  },
  async deleteAttendance(id){
    if(!Auth.isAdmin()) return;
    if(!confirm('Delete this attendance record?')) return;
    Store.data.attendance = Store.data.attendance.filter(x=>x.id!==id);
    const ok = await Store.save('attendance');
    if(ok) UI.toast('Deleted');
    this.render();
  },

  /* ---------------- monthly summary ---------------- */
  monthlySummary(userId, monthStr){
    const list = Store.data.attendance.filter(a=>a.userId===userId && a.date.slice(0,7)===monthStr);
    return {
      present: list.filter(a=>a.status==='Present').length,
      leave: list.filter(a=>a.status==='Leave').length,
      absent: list.filter(a=>a.status==='Absent').length,
      office: list.filter(a=>a.location==='Office').length,
      home: list.filter(a=>a.location==='Home').length
    };
  },

  /* ---------------- export ---------------- */
  exportAttendanceCSV(list){
    if(!list.length){ UI.toast('Nothing to export'); return; }
    Reports.download(list.map(a=>({
      Date:a.date, Employee:a.name||a.username, Location:a.location||'', Status:a.status,
      'Login Time': a.loginTime?Util.fmtDateTime(a.loginTime):'', 'Logout Time': a.logoutTime?Util.fmtDateTime(a.logoutTime):'',
      Notes:a.notes||''
    })), 'attendance');
  },
  exportLeaveCSV(list){
    if(!list.length){ UI.toast('Nothing to export'); return; }
    Reports.download(list.map(l=>({
      Employee:l.name||l.username, From:l.fromDate, To:l.toDate, Days:l.days, Type:l.leaveType,
      Reason:l.reason, Status:l.status, 'Applied At': l.appliedAt?Util.fmtDateTime(l.appliedAt):'', 'Decided By':l.decidedBy||''
    })), 'leave-requests');
  },
  /* ---------------- render: shell + tabs ---------------- */
  setTab(t){ this.tab = t; this.render(); },
  switcherHTML(){
    const tabs = [['today','&#128197; Today'],['my','&#128203; My Attendance'],['leave','&#9995; Leave']];
    if(Auth.isAdmin()){
      tabs.push(['team','&#128101; Team Attendance'],['approvals','&#9989; Leave Approvals'],['reports','&#128202; Reports']);
    } else {
      tabs.push(['reports','&#128202; My Reports']);
    }
    return '<div class="rp-switcher" style="flex-wrap:wrap;">' +
      tabs.map(([id,label])=>'<button class="'+(this.tab===id?'active':'')+'" onclick="Attendance.setTab(\''+id+'\')">'+label+
        (id==='approvals' ? (()=>{ const n=Store.data.leaveRequests.filter(l=>l.status==='Pending').length; return n?' ('+n+')':''; })() : '') +
      '</button>').join('') +
    '</div>';
  },
  render(){
    if(this.tab==='team' || this.tab==='approvals') if(!Auth.isAdmin()) this.tab = 'today';
    const body = this.tab==='today' ? this.renderToday()
      : this.tab==='my' ? this.renderMy()
      : this.tab==='leave' ? this.renderLeave()
      : this.tab==='team' ? this.renderTeam()
      : this.tab==='approvals' ? this.renderApprovals()
      : this.renderReports();
    document.getElementById('content').innerHTML = this.switcherHTML() + body;
  },

  renderToday(){
    const rec = this.todayRecord();
    const s = Auth.session;
    return '<div class="card card-pad" style="max-width:480px;">' +
      '<h3 style="margin:0 0 10px;font-size:14px;">Today &middot; '+Util.fmtDate(Util.todayISO())+'</h3>' +
      (rec
        ? '<div style="display:flex;flex-direction:column;gap:8px;font-size:13.5px;">' +
            '<div><span class="hint">Status:</span> <span class="badge badge-'+(rec.status==='Present'?'green':rec.status==='Leave'?'blue':'red')+'">'+rec.status+'</span></div>' +
            (rec.location ? '<div><span class="hint">Working from:</span> <b>'+(rec.location==='Office'?'&#127970; Office':'&#127968; Home')+'</b></div>' : '') +
            (rec.loginTime ? '<div><span class="hint">Login Time:</span> '+Util.fmtDateTime(rec.loginTime)+'</div>' : '') +
            '<div><span class="hint">Logout Time:</span> '+(rec.logoutTime ? Util.fmtDateTime(rec.logoutTime) : '<span class="cell-mute">Not recorded yet</span>')+'</div>' +
            (!rec.logoutTime && rec.status==='Present' ? '<button class="btn btn-outline btn-sm" style="margin-top:6px;width:fit-content;" onclick="Attendance.manualLogout()">Record Logout Time Now</button>' : '') +
          '</div>'
        : '<div class="hint" style="margin-bottom:10px;">You haven\'t marked today\'s work location yet.</div>' +
          '<button class="btn btn-primary btn-sm" onclick="Attendance.promptWorkLocation()">Mark Today\'s Attendance</button>') +
    '</div>';
  },

  renderMy(){
    const uid = Auth.session.id;
    const list = Store.data.attendance.filter(a=>a.userId===uid).sort((a,b)=>b.date.localeCompare(a.date));
    const info = Paginate.slice('attendance_my', list);
    return '<div class="card"><div class="card-pad" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">' +
      '<h3 style="margin:0;font-size:14px;">My Attendance</h3>' +
      '<button class="btn btn-outline btn-sm" onclick="Attendance.exportAttendanceCSV(Store.data.attendance.filter(a=>a.userId===\''+uid+'\'))">Export</button>' +
      '</div>' +
      '<div class="table-wrap"><table><thead><tr><th>Date</th><th>Login Time</th><th>Logout Time</th><th>Location</th><th>Status</th></tr></thead><tbody>' +
      (info.pageItems.length ? info.pageItems.map(a=>'<tr>' +
        '<td class="cell-main">'+Util.fmtDate(a.date)+'</td>' +
        '<td class="cell-mute">'+(a.loginTime?Util.fmtDateTime(a.loginTime):'-')+'</td>' +
        '<td class="cell-mute">'+(a.logoutTime?Util.fmtDateTime(a.logoutTime):'-')+'</td>' +
        '<td>'+(a.location||'-')+'</td>' +
        '<td><span class="badge badge-'+(a.status==='Present'?'green':a.status==='Leave'?'blue':'red')+'">'+a.status+'</span></td>' +
      '</tr>').join('') : '<tr><td colspan="5" class="cell-mute" style="text-align:center;padding:18px;">No attendance records yet</td></tr>') +
      '</tbody></table></div>' + Paginate.controlsHTML('attendance_my', info, "Attendance.render()") + '</div>';
  },

  renderLeave(){
    const uid = Auth.session.id;
    const list = Store.data.leaveRequests.filter(l=>l.userId===uid).sort((a,b)=>String(b.appliedAt).localeCompare(String(a.appliedAt)));
    return '<div class="toolbar"><div class="toolbar-spacer"></div><button class="btn btn-primary btn-sm" onclick="Attendance.openLeaveForm()">&#65291; Apply for Leave</button></div>' +
      '<div class="card"><div class="card-pad" style="padding-bottom:0;"><h3 style="margin:0;font-size:14px;">My Leave History</h3></div>' +
      '<div class="table-wrap"><table><thead><tr><th class="col-actions">Actions</th><th>From</th><th>To</th><th>Days</th><th>Type</th><th>Reason</th><th>Status</th><th>Decided By</th></tr></thead><tbody>' +
      (list.length ? list.map(l=>'<tr>' +
        '<td class="col-actions"><div class="row-action-btns">' +
          (l.status==='Pending' ? '<button class="icon-btn" title="Withdraw" onclick="Attendance.deleteLeave(\''+l.id+'\')">&#128465;</button>' : '') +
        '</div></td>' +
        '<td class="cell-mute">'+Util.fmtDate(l.fromDate)+'</td>' +
        '<td class="cell-mute">'+Util.fmtDate(l.toDate)+'</td>' +
        '<td class="mono">'+l.days+'</td>' +
        '<td>'+Util.escapeHtml(l.leaveType)+'</td>' +
        '<td class="cell-mute" style="max-width:220px;white-space:normal;">'+Util.escapeHtml(l.reason)+'</td>' +
        '<td><span class="badge badge-'+(l.status==='Approved'?'green':l.status==='Rejected'?'red':'amber')+'">'+l.status+'</span></td>' +
        '<td class="cell-mute">'+Util.escapeHtml(l.decidedBy||'-')+'</td>' +
      '</tr>').join('') : '<tr><td colspan="8" class="cell-mute" style="text-align:center;padding:18px;">No leave requests yet</td></tr>') +
      '</tbody></table></div></div>';
  },
  renderTeam(){
    const f = this.teamFilter;
    let list = Store.data.attendance.slice();
    if(f.userId) list = list.filter(a=>a.userId===f.userId);
    if(f.month) list = list.filter(a=>a.date.slice(0,7)===f.month);
    if(f.status) list = list.filter(a=>a.status===f.status);
    list.sort((a,b)=>b.date.localeCompare(a.date));
    const info = Paginate.slice('attendance_team', list);
    return '<div class="card card-pad" style="margin-bottom:14px;">' +
      '<div class="form-row" style="grid-template-columns:1fr 1fr 1fr auto;">' +
        '<div class="field"><label>Employee</label><select onchange="Attendance.teamFilter.userId=this.value;Attendance.render()"><option value="">All Employees</option>' +
          Store.data.users.map(u=>'<option value="'+u.id+'" '+(f.userId===u.id?'selected':'')+'>'+Util.escapeHtml(Attendance.userLabel(u))+'</option>').join('') + '</select></div>' +
        '<div class="field"><label>Month</label><input type="month" value="'+f.month+'" onchange="Attendance.teamFilter.month=this.value;Attendance.render()"></div>' +
        '<div class="field"><label>Status</label><select onchange="Attendance.teamFilter.status=this.value;Attendance.render()"><option value="">All Status</option>' +
          DROPDOWNS.attendanceStatus.map(s=>'<option '+(f.status===s?'selected':'')+'>'+s+'</option>').join('') + '</select></div>' +
        '<button class="btn btn-outline btn-sm" style="align-self:end;" onclick="Attendance.teamFilter={userId:\'\',month:\'\',status:\'\'};Attendance.render()">Reset</button>' +
      '</div>' +
      '<div class="toolbar" style="margin-top:10px;">' +
        '<button class="btn btn-primary btn-sm" onclick="Attendance.openAttendanceForm(null)">&#65291; Add Record</button>' +
        '<div class="toolbar-spacer"></div>' +
        '<button class="btn btn-outline btn-sm" onclick="Attendance.exportAttendanceCSV(Attendance._teamFiltered())">Export Filtered</button>' +
