  async save(id){
    const party = document.getElementById('p_party').value.trim();
    const amount = document.getElementById('p_amount').value;
    if(!party || amount===''){ UI.toast('Party name and amount are required'); return; }
    const custId = document.getElementById('p_customerId').value;
    let status = document.getElementById('p_status').value;
    const amountPaid = Number(document.getElementById('p_amountPaid').value)||0;
    if(amountPaid >= Number(amount) && Number(amount)>0) status = 'Paid';
    const rec = {
      id: id || (Store.data.settings.payPrefix||'INV-')+String(Store.data.settings.payNext||1).padStart(4,'0'),
      customerId: custId,
      companyName: document.getElementById('p_companyName').value,
      product: document.getElementById('p_product').value,
      invoiceNumber: document.getElementById('p_invoiceNumber').value.trim(),
      invoiceDate: document.getElementById('p_invoiceDate').value,
      party,
      taxableValue: Number(document.getElementById('p_taxableValue').value)||0,
      cgst: Number(document.getElementById('p_cgst').value)||0,
      sgst: Number(document.getElementById('p_sgst').value)||0,
      igst: Number(document.getElementById('p_igst').value)||0,
      roundOff: Number(document.getElementById('p_roundOff').value)||0,
      amount: Number(amount), amountPaid,
      dueAmount: Math.max(Number(amount)-amountPaid,0),

      phone: document.getElementById('p_phone').value.trim(),
      followupDate: document.getElementById('p_followupDate').value,
      response: document.getElementById('p_response').value.trim(),
      status
    };
    if(id){ const i=Store.data.payments.findIndex(x=>x.id===id); Store.data.payments[i]=rec; }
    else { Store.data.payments.unshift(rec); Store.data.settings.payNext=(Store.data.settings.payNext||1)+1; await Store.save('settings'); }
    await Store.save('payments');
    if(custId) await Customers.logTimeline(custId, 'Payment Status', rec.id+' — '+status+' ('+Util.fmtMoney(rec.amount).replace('&#8377;','Rs.')+')', {silent:true});

  async markPaid(id){
    const p = Store.data.payments.find(x=>x.id===id); p.status='Paid'; p.amountPaid = Number(p.amount)||0;
    await Store.save('payments');
    if(p.customerId) await Customers.logTimeline(p.customerId, 'Payment Status', p.id+' marked Paid', {silent:true});

  downloadSampleTemplate(){

        {'Party Name':'ABC Enterprises','Company Name':'LLP','Product':'','Invoice Number':'INV104','Invoice Date':'01-04-2026','Taxable Value':21186.44,'CGST':1906.78,'SGST':1906.78,'IGST':0,'Round Off':0,'Invoice Amount':25000,'Due Amount':0,'Payment Status':'Paid'}
      ];
      const ws = XLSX.utils.json_to_sheet(sample);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Payments');
      XLSX.writeFile(wb, 'jays-crm-payments-sample-template.xlsx');
      UI.toast('Sample template downloaded');
    }catch(e){ console.error(e); UI.toast('Could not generate template'); }
  },
  _num(v){
    if(v===undefined||v===null||v==='') return 0;
    if(typeof v==='number') return v;
    return Number(String(v).replace(/[₹,\s]/g,''))||0;
  },
  _date(v){
    if(!v) return '';
    if(v instanceof Date) return v.toISOString().slice(0,10);
    const s = String(v).trim();
    if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
    const m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
    if(m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
    return s;
  },
  async importExcel(file){
    if(!file) return;
    try{
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws);
      if(!rows.length){ UI.toast('No rows found in file'); return; }
      let count = 0;
      rows.forEach(r=>{
        const party = r['Party Name']||r.Party||r.party; if(!party) return;
        const invoiceNumber = String(r['Invoice Number']||r.InvoiceNumber||r.invoiceNumber||'').trim();
        const taxableValue = this._num(r['Taxable Value']||r.TaxableValue);
        const cgst = this._num(r.CGST||r.cgst);
        const sgst = this._num(r.SGST||r.sgst);
        const igst = this._num(r.IGST||r.igst);
        const roundOff = this._num(r['Round Off']||r.RoundOff);
        const amount = this._num(r['Invoice Amount']||r.Amount||r.amount);
        const dueAmount = this._num(r['Due Amount']||r.DueAmount||r.dueAmount);
        const amountPaid = Math.max(amount-dueAmount,0);
        let statusRaw = String(r['Payment Status']||r.Status||r.status||'Pending').trim().toLowerCase();
        let status = statusRaw==='paid' ? 'Paid' : 'Pending';
        if(dueAmount<=0 && amount>0) status='Paid';
        let companyName = String(r['Company Name']||r.CompanyName||r.companyName||r.Company||'').trim().toUpperCase();
        if(!DROPDOWNS.companyName.includes(companyName)){
          const match = DROPDOWNS.companyName.find(c=>companyName.includes(c) || c.includes(companyName));
          companyName = match || DROPDOWNS.companyName[0];
        }
        Store.data.payments.unshift({
          id: (Store.data.settings.payPrefix||'INV-')+String(Store.data.settings.payNext||1).padStart(4,'0'),
          customerId: '',
          companyName,
          product: String(r['Product']||r.Product||r.product||'').trim(),
          invoiceNumber,
          invoiceDate: this._date(r['Invoice Date']||r.InvoiceDate||r.invoiceDate)||Util.todayISO(),
          party: String(party),
          taxableValue, cgst, sgst, igst, roundOff,
          amount, amountPaid, dueAmount,
          contact: r.Contact||r.contact||'',
          phone: String(r.Phone||r.phone||''),
          followupDate: r.FollowupDate||r.followupDate||r['Follow-up Date']||'',
          response: r.Response||r.response||'',
          status
        });
        Store.data.settings.payNext=(Store.data.settings.payNext||1)+1;
        count++;
      });
      await Store.save('payments');
      await Store.save('settings');
      await Activity.log('Excel import', count+' invoice(s) imported from '+file.name);
      UI.toast(count+' invoice(s) imported');
      document.getElementById('payImportFile').value = '';
      Router.render('payments');
    }catch(e){ console.error(e); UI.toast('Import failed — check the file format'); }
  }
};

  _date(v){
    if(!v) return '';
    if(v instanceof Date) return v.toISOString().slice(0,10);
    const s = String(v).trim();
    if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
    const m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
    if(m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
    return s;
  },
  async importExcel(file){
    if(!file) return;
    try{
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array', cellDates:true});
      let count = 0;
      wb.SheetNames.forEach(sheetName=>{
        const ws = wb.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(ws);
        const sheetCompanyDefault = /llp/i.test(sheetName) ? 'LLP' : 'JAYS';
        rows.forEach(r=>{
          const gemcNumber = String(r['Order ID']||r.OrderID||r['GEM Number']||'').trim();
          const party = String(r['PANCHAYATH NAME']||r['Buyer Organization']||r.Party||'').trim();
          if(!gemcNumber && !party) return;
          let companyName = String(r['COMPANY NAME']||r.CompanyName||'').trim().toUpperCase();
          if(!DROPDOWNS.companyName.includes(companyName)) companyName = sheetCompanyDefault;
          const needUpdateRaw = String(r['NEED TO UPDATE']||'').trim().toLowerCase();
          const status = needUpdateRaw==='yes' ? 'Needs Update' : 'Updated';
          Store.data.gemcrac.unshift({
            id: Util.uid('GC', Store.data.gemcrac),
            customerId: '',
            companyName,
            party,
            gemcNumber,
            buyingMode: String(r['Buying Mode']||'DIRECT').trim().toUpperCase(),
            productName: String(r['Product Name']||'').trim(),
            orderDate: this._date(r['Order Date']),
            amount: Number(r['Order Value(Rs.)']||r['Order Value']||0)||0,
            qty: Number(r['Product Quantity']||0)||0,
            status,
            contact: '', phone: '', contactedDate: '',
            remark: String(r['REMARK']||'').trim()
          });
          count++;
        });
      });
      if(!count){ UI.toast('No rows found in file'); return; }
      await Store.save('gemcrac');
      await Activity.log('Excel import', count+' GEM CRAC row(s) imported from '+file.name);
      UI.toast(count+' row(s) imported');
      const inp = document.getElementById('gcImportFile'); if(inp) inp.value = '';
      Router.render('gemcrac');
    }catch(e){ console.error(e); UI.toast('Import failed — check the file format'); }
  },

  copyMessage(){

const Outstanding = {
  render(){
    const pays = Store.data.payments;
    const byParty = {};
    pays.forEach(p=>{
      const due = Math.max((Number(p.amount)||0)-(Number(p.amountPaid)||0), 0);
      if(due<=0) return;
      const key = p.party || '—';
      if(!byParty[key]) byParty[key] = {party:key, due:0, overdue:0, invoices:0, phone:p.phone||p.contact||''};

      byParty[key].invoices += 1;
      if(p.followupDate && p.followupDate < Util.todayISO()) byParty[key].overdue += due;

    const rows = Object.values(byParty).sort((a,b)=>b.due-a.due);

/* =====================================================================
   GEM BID SEARCH & PARTICIPATION MANAGEMENT
   A workspace for finding, evaluating and tracking government
   procurement (GeM) bid opportunities through to Won/Lost. Bid data is
   entered manually or imported (no scraping/auth-bypass of GeM); each
   record supports a document checklist, notes/timeline, linked tasks,
   and — once Won — converting straight into an Order.
===================================================================== */
function bidMatch(bid){
  const text = ((bid.title||'')+' '+(bid.description||'')+' '+(bid.category||'')+' '+(bid.boqTitle||'')).toLowerCase();
  const excluded = (Store.data.settings.excludedBidKeywords||'').split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
  if(excluded.some(x=>x && text.includes(x))) return {score:0, matched:[]};
  const prodCats = [...new Set(Store.data.products.map(p=>p.category))].filter(Boolean).map(c=>c.toLowerCase());
  const prefKeywords = (Store.data.settings.preferredBidKeywords||'').split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
  const terms = [...new Set([...prodCats, ...prefKeywords])];
  if(!terms.length || !text.trim()) return {score:0, matched:[]};
  const matched = terms.filter(t=>t && text.includes(t));
  const score = Math.min(100, Math.round((matched.length / Math.min(terms.length,6)) * 100));
  return {score, matched};
}
function matchBadgeHTML(score){
  const cls = score>=80?'match-high':score>=50?'match-medium':'match-low';
  const label = score>=80?'High':score>=50?'Medium':'Low';
  return `<span class="match-badge ${cls}">${score}% ${label}</span>`;
}
function bidDeadlineInfo(endDate){
  if(!endDate) return {label:'No date', cls:'dl-ok', days:null};
  const diffDays = Math.ceil((new Date(endDate) - new Date(Util.todayISO())) / 86400000);
  if(diffDays < 0) return {label:'Closed', cls:'dl-over', days:diffDays};
  if(diffDays === 0) return {label:'Closes Today', cls:'dl-critical', days:diffDays};
  if(diffDays === 1) return {label:'Closes Tomorrow', cls:'dl-critical', days:diffDays};
  if(diffDays <= 3) return {label:`Closes in ${diffDays}d`, cls:'dl-soon', days:diffDays};
  return {label:`Closes in ${diffDays}d`, cls:'dl-ok', days:diffDays};
}
function bidDeadlineBadgeHTML(endDate){
  const d = bidDeadlineInfo(endDate);
  return `<span class="deadline-badge ${d.cls}">${d.label}</span>`;
}
function bidStatusColor(status){
  if(status==='Won') return 'var(--green,#16a34a)';
  if(status==='Lost'||status==='Cancelled') return 'var(--red,#dc2626)';
  if(['Submitted','Technical Evaluation','Financial Evaluation'].includes(status)) return 'var(--blue,#2563eb)';
  if(status==='Not Participating') return 'var(--text-mute,#6b7280)';
  return 'var(--amber,#d97706)';
}

    `, `<button class="btn btn-outline" onclick="UI.closeModal()">Cancel</button><button class="btn btn-primary" onclick="BidSearch.save('${id||''}')">Save Bid</button>`, true);
  },
  async save(id){
    const title = document.getElementById('b_title').value.trim();
    if(!title){ UI.toast('Bid Title is required'); return; }
    const g = (elId)=>document.getElementById(elId).value;
    const rec = id ? {...Store.data.bids.find(x=>x.id===id)} : {
      id: (Store.data.settings.bidPrefix||'BID-')+String(Store.data.settings.bidNext||1).padStart(4,'0'),
      checklist: DEFAULT_BID_CHECKLIST.map(name=>({name, done:false})),
      timeline: [], createdDate: Util.todayISO()
    };
    Object.assign(rec, {
      bidNumber:g('b_bidNumber').trim(), raNumber:g('b_raNumber').trim(), title, bidType:g('b_bidType'),
      category:g('b_category').trim(), boqTitle:g('b_boqTitle').trim(), description:g('b_description').trim(),
      ministry:g('b_ministry').trim(), department:g('b_department').trim(), organisation:g('b_organisation').trim(),
      buyerName:g('b_buyerName').trim(), consignee:g('b_consignee').trim(), state:g('b_state'), district:g('b_district').trim(), location:g('b_location').trim(),
      estimatedValue:Number(g('b_estimatedValue'))||0, emdAmount:Number(g('b_emdAmount'))||0, tenderFee:Number(g('b_tenderFee'))||0,
      securityDeposit:Number(g('b_securityDeposit'))||0, expectedMargin:Number(g('b_expectedMargin'))||0, ourQuote:Number(g('b_ourQuote'))||0,
      publishedDate:g('b_publishedDate'), startDate:g('b_startDate'), endDate:g('b_endDate'), openingDate:g('b_openingDate'),
      status:g('b_status'), assignedTo:g('b_assignedTo'), sourceUrl:g('b_sourceUrl').trim()
    });
    const isNew = !id;
    if(id){ const i=Store.data.bids.findIndex(x=>x.id===id); Store.data.bids[i]=rec; }
    else{
      rec.timeline.push({date:new Date().toISOString(), text:'Bid created', by:(Auth.session&&Auth.session.name)||'System'});
      Store.data.bids.unshift(rec);
      Store.data.settings.bidNext = (Store.data.settings.bidNext||1)+1;
      await Store.save('settings');
    }
    await Store.save('bids');
    await Activity.log(isNew?'Bid saved':'Bid updated', rec.bidNumber||rec.title);
    UI.closeModal(); UI.toast('Saved'); Router.render('bidsearch');
  },
  async remove(id){
    if(!confirm('Delete this bid record?')) return;
    const b = Store.data.bids.find(x=>x.id===id);
    Store.data.bids = Store.data.bids.filter(x=>x.id!==id);
    await Store.save('bids');
    await Activity.log('Bid deleted', b? (b.bidNumber||b.title) : id);
    UI.toast('Deleted'); Router.render('bidsearch');
  },
  async setStatus(id, status){
    const b = Store.data.bids.find(x=>x.id===id); if(!b) return;
    b.status = status;
    b.timeline = b.timeline||[];
    b.timeline.push({date:new Date().toISOString(), text:'Status changed to '+status, by:(Auth.session&&Auth.session.name)||'System'});
    await Store.save('bids');
    await Activity.log('Bid status changed', (b.bidNumber||b.title)+' — '+status);
    BidSearch.openDetail(id);
  },
  async toggleChecklist(id, idx){
    const b = Store.data.bids.find(x=>x.id===id); if(!b) return;
    b.checklist = b.checklist||[];
    if(b.checklist[idx]) b.checklist[idx].done = !b.checklist[idx].done;
    await Store.save('bids');
    BidSearch.openDetail(id);
  },
  async addChecklistItem(id){
    const name = (document.getElementById('bd_newChecklistItem').value||'').trim();
    if(!name) return;
    const b = Store.data.bids.find(x=>x.id===id); if(!b) return;
    b.checklist = b.checklist||[];
    b.checklist.push({name, done:false});
    await Store.save('bids');
    BidSearch.openDetail(id);
  },
  async addNote(id){
    const text = (document.getElementById('bd_newNote').value||'').trim();
    if(!text) return;
    const b = Store.data.bids.find(x=>x.id===id); if(!b) return;
    b.timeline = b.timeline||[];
    b.timeline.push({date:new Date().toISOString(), text, by:(Auth.session&&Auth.session.name)||'System'});
    await Store.save('bids');
    await Activity.log('Bid note added', b.bidNumber||b.title);
    BidSearch.openDetail(id);
  },
  async addTask(id){
    const b = Store.data.bids.find(x=>x.id===id); if(!b) return;
    const task = {
      id: Util.uid('T', Store.data.tasks), date: Util.todayISO(), todo: 'Bid: '+(b.title||b.bidNumber),
      customerId:'', customerName: b.organisation||'', phone:'', taskEntry: 'Follow up on bid '+(b.bidNumber||b.id),
      remarks:'', assignedTo: b.assignedTo||'', status:'Not Started', bidId: b.id
    };
    Store.data.tasks.unshift(task);
    await Store.save('tasks');
    await Activity.log('Bid task created', b.bidNumber||b.title);
    UI.toast('Task added — see Tasks & To-Do');
    BidSearch.openDetail(id);
  },
  convertToOrder(id){
    const b = Store.data.bids.find(x=>x.id===id); if(!b) return;
    UI.closeModal();
    go('orders');
    setTimeout(()=>{
      OrdersMgmt.openForm(null);
      setTimeout(()=>{
        const partyEl = document.getElementById('o_party'); if(partyEl) partyEl.value = b.organisation||b.buyerName||'';
        const gemEl = document.getElementById('o_gemcNumber'); if(gemEl) gemEl.value = b.bidNumber||'';
        const custom = document.getElementById('o_productCustom'); const sel = document.getElementById('o_productName');
        if(sel && custom){ sel.value='__custom__'; custom.value = b.category||b.title||''; OrdersMgmt.toggleCustomProduct(); }
      }, 80);
    }, 80);
  },
  openDetail(id){
    const b = Store.data.bids.find(x=>x.id===id); if(!b) return;
    const m = bidMatch(b);
    b.checklist = b.checklist||[]; b.timeline = b.timeline||[];
    const doneCount = b.checklist.filter(c=>c.done).length;
    const pct = b.checklist.length? Math.round(doneCount/b.checklist.length*100) : 0;
    const linkedTasks = Store.data.tasks.filter(t=>t.bidId===id);
    UI.openModal(`${b.bidNumber||b.id} — ${Util.escapeHtml(b.title||'')}`, `
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;">
        ${matchBadgeHTML(m.score)}
        ${bidDeadlineBadgeHTML(b.endDate)}
        <span class="badge" style="background:${bidStatusColor(b.status)};color:#fff;">${Util.escapeHtml(b.status||'New')}</span>
        ${b.sourceUrl? `<a class="btn btn-outline btn-sm" href="${Util.escapeHtml(b.sourceUrl)}" target="_blank">&#128279; Open Source</a>` : ''}
        ${b.status==='Won'? `<button class="btn btn-primary btn-sm" onclick="BidSearch.convertToOrder('${id}')">&#8594; Convert to Order</button>` : ''}
      </div>
      <div class="field"><label>Update Status</label><select onchange="BidSearch.setStatus('${id}', this.value)">${DROPDOWNS.bidStatus.map(s=>`<option ${s===b.status?'selected':''}>${s}</option>`).join('')}</select></div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0;">
        <div>
          <h4 style="font-size:12px;text-transform:uppercase;color:var(--text-mute);margin:0 0 6px;">Organisation</h4>
          <p style="margin:0;font-size:13px;">${Util.escapeHtml(b.organisation||'—')}${b.department?' · '+Util.escapeHtml(b.department):''}${b.location?' · '+Util.escapeHtml(b.location):''}</p>
        </div>
        <div>
          <h4 style="font-size:12px;text-transform:uppercase;color:var(--text-mute);margin:0 0 6px;">Financials</h4>
          <p style="margin:0;font-size:13px;">Value: ${b.estimatedValue?Util.fmtMoney(b.estimatedValue):'—'} &middot; EMD: ${b.emdAmount?Util.fmtMoney(b.emdAmount):'—'}</p>
        </div>
      </div>

      <h4 style="font-size:12px;text-transform:uppercase;color:var(--text-mute);margin:16px 0 6px;">Document Checklist — ${doneCount}/${b.checklist.length}</h4>
      <div class="doc-progress"><div style="width:${pct}%;"></div></div>
      <div style="margin:10px 0;">
        ${b.checklist.map((c,i)=>`<label class="chk" style="display:flex;align-items:center;gap:7px;margin-bottom:6px;"><input type="checkbox" ${c.done?'checked':''} onchange="BidSearch.toggleChecklist('${id}',${i})"> ${Util.escapeHtml(c.name)}</label>`).join('')}
      </div>
      <div style="display:flex;gap:8px;">
        <input id="bd_newChecklistItem" placeholder="Add checklist item..." style="flex:1;">
        <button class="btn btn-outline btn-sm" onclick="BidSearch.addChecklistItem('${id}')">&#65291; Add</button>
      </div>

      <h4 style="font-size:12px;text-transform:uppercase;color:var(--text-mute);margin:20px 0 6px;">Tasks (${linkedTasks.length})</h4>
      ${linkedTasks.length? linkedTasks.map(t=>`<div style="font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--border);">${Util.escapeHtml(t.todo)} — <span class="cell-mute">${Util.escapeHtml(t.status)}</span></div>`).join('') : `<p class="cell-mute" style="font-size:12.5px;">No tasks linked yet.</p>`}
      <button class="btn btn-outline btn-sm" style="margin-top:6px;" onclick="BidSearch.addTask('${id}')">&#65291; Add Task</button>

      <h4 style="font-size:12px;text-transform:uppercase;color:var(--text-mute);margin:20px 0 6px;">Notes &amp; Activity Timeline</h4>
      <div style="max-height:180px;overflow:auto;margin-bottom:8px;">
        ${b.timeline.slice().reverse().map(t=>`<div style="font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--border);"><span class="cell-mute">${Util.fmtDateTime(t.date)} &middot; ${Util.escapeHtml(t.by||'')}</span><br>${Util.escapeHtml(t.text)}</div>`).join('') || `<p class="cell-mute" style="font-size:12.5px;">No activity yet.</p>`}
      </div>
      <div style="display:flex;gap:8px;">
        <input id="bd_newNote" placeholder="Add a note..." style="flex:1;">
        <button class="btn btn-outline btn-sm" onclick="BidSearch.addNote('${id}')">&#65291; Add</button>
      </div>
    `, `<button class="btn btn-outline" onclick="UI.closeModal()">Close</button><button class="btn btn-primary" onclick="BidSearch.openForm('${id}')">Edit Full Details</button>`, true);
  },
  exportExcel(){
    try{
      const rows = Store.data.bids.map(b=>({
        'Bid Number':b.bidNumber||'', Title:b.title||'', Category:b.category||'', Organisation:b.organisation||'',
        'Bid Value':b.estimatedValue||0, 'End Date':b.endDate||'', Status:b.status||'', 'Assigned To':b.assignedTo||'',
        Decision: BID_TERMINAL_STATUSES.includes(b.status)?b.status:'Pending', Result: b.status==='Won'?'Won':b.status==='Lost'?'Lost':'', Notes: b.description||''
      }));
      const ws = XLSX.utils.json_to_sheet(rows.length?rows:[{Info:'No bids yet'}]);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Bid Register');
      XLSX.writeFile(wb, 'jays-bid-register-'+Util.todayISO()+'.xlsx');
      Activity.log('Bid register exported', rows.length+' bid(s)');
      UI.toast('Bid register exported');
    }catch(e){ console.error(e); UI.toast('Export failed'); }
  }
};

const Reports = {
  render(){
    const c = Store.data.customers;
    const agg = (field)=>{ const m={}; c.forEach(x=>{ const k=x[field]||'Unknown'; m[k]=(m[k]||0)+1; }); return m; };

      <div class="grid grid-4" style="margin-bottom:16px;">
        <div class="card stat-card"><div class="bar bar-blue"></div><div class="lbl">Total Leads &amp; Customers</div><div class="val">${c.length}</div></div>

        <div class="card stat-card"><div class="bar bar-amber"></div><div class="lbl">Payments Pending</div><div class="val">${Util.fmtMoney(totalPending)}</div></div>

        ${this.followupFunnel()}
      </div>
    `;
  },
  followupFunnel(){

    const f = Store.data.followups;
    const m = {
      'Today': f.filter(x=>x.status!=='Done'&&x.date===today).length,
      'Overdue': f.filter(x=>x.status!=='Done'&&x.date<today).length,
      'Upcoming': f.filter(x=>x.status!=='Done'&&x.date>today).length,
      'Completed': f.filter(x=>x.status==='Done').length
    };
    return `<div class="card">
      <div class="card-head"><h3>Follow-up Centre Snapshot</h3><span class="hint" style="cursor:pointer;" onclick="go('followupcentre')">Open &rarr;</span></div>
      <div class="table-wrap"><table><thead><tr><th>Bucket</th><th>Count</th></tr></thead><tbody>
      ${Object.keys(m).map(k=>`<tr><td class="cell-main">${k}</td><td class="mono">${m[k]}</td></tr>`).join('')}
      </tbody></table></div>
    </div>`;
  },
  exportAgg(field){
    const m={}; Store.data.customers.forEach(x=>{ const k=x[field]||'Unknown'; m[k]=(m[k]||0)+1; });
    const rows = Object.keys(m).map(k=>({[field]:k, count:m[k]}));
    this.download(rows, 'report_'+field);

      rows = Store.data.customers.map(x=>({ID:x.id, Name:x.name, Phone:x.phone, Email:x.email, District:x.district, Area:x.panchayath, AssignedTo:x.assignedTo, Status:x.status, LastContact:x.lastContact, CreatedDate:x.createdDate}));
    } else if(view==='products'){
      rows = Store.data.products.map(p=>({Code:p.code, Category:p.category, Name:p.name, Unit:p.unit, Price:p.price, Stock:p.stock}));
    } else if(view==='quotations'){
      rows = Store.data.quotations.map(q=>({ID:q.id, Date:q.date, Customer:q.customerName, Phone:q.phone, Subtotal:q.subtotal, GST:q.gst, Total:q.total, Status:q.status}));
    } else if(view==='payments'){
      rows = Store.data.payments.map(p=>({'Party Name':p.party, 'Company Name':p.companyName||'', 'Product':p.product||'', 'Invoice Number':p.invoiceNumber||p.id, 'Invoice Date':p.invoiceDate, 'Taxable Value':p.taxableValue||0, 'CGST':p.cgst||0, 'SGST':p.sgst||0, 'IGST':p.igst||0, 'Round Off':p.roundOff||0, 'Invoice Amount':p.amount, 'Due Amount':p.dueAmount!==undefined?p.dueAmount:Math.max((Number(p.amount)||0)-(Number(p.amountPaid)||0),0), 'Payment Status':p.status==='Paid'?'Paid':'Unpaid', Contact:p.contact, Phone:p.phone, FollowupDate:p.followupDate, Response:p.response}));
    } else if(view==='followupcentre'){
      rows = Store.data.followups.map(f=>({ID:f.id, Date:f.date, Customer:f.customerName, Phone:f.phone, Purpose:f.purpose, Status:f.status, Notes:f.notes}));
    } else if(view==='tasks'){
      rows = Store.data.tasks.map(t=>({ID:t.id, Date:t.date, 'To Do':t.todo, AssignedTo:t.assignedTo, Customer:t.customerName, 'Area/Panchayath':custArea(t.customerId), Phone:t.phone, 'Task Entry':t.taskEntry, Remarks:t.remarks, Status:t.status}));
    } else if(view==='notes'){
      rows = Store.data.notes.map(n=>({ID:n.id, Date:n.date, Note:n.text, Remark:n.remark}));
    } else if(view==='gemcrac'){
      rows = Store.data.gemcrac.map(g=>({'Party/Panchayath':g.party, 'Company Name':g.companyName||'', 'GEM Order Number':g.gemcNumber, 'Product Name':g.productName||'', 'Buying Mode':g.buyingMode||'', 'Order Date':g.orderDate, 'Order Value':g.amount||0, 'Quantity':g.qty||0, 'Status':g.status, Contact:g.contact||'', Phone:g.phone||'', Remark:g.remark||''}));
    } else if(view==='orders'){
      rows = Store.data.orders.map(o=>({ID:o.id, 'Order Date':o.orderDate, 'GEM Order Number':o.gemcNumber||'', 'Order From':o.orderFrom||'', 'Product Name':o.productName||'', 'Party Name':o.party, 'Party Phone':o.phone||'', 'Assigned To':o.assignedTo||'', 'Status':o.status}));
    } else if(view==='complaints'){
      rows = Store.data.complaints.map(c=>({ID:c.id, 'Complaint Date':c.complaintDate, 'Complaint From':c.complaintFrom, 'Product Name':c.productName||'', 'Complaint Note':c.note||'', 'Assigned To':c.assignedTo||'', 'Status':c.status, 'Updated Date':c.updatedDate}));
    } else {
      rows = Store.data.customers.map(x=>({ID:x.id, Name:x.name, Phone:x.phone, Status:x.status}));
    }
    if(!rows.length){ UI.toast('Nothing to export in this view'); return; }
    this.download(rows, view||'export');
  },
  download(rows, filename){
    try{
      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Data');
      XLSX.writeFile(wb, filename+'.xlsx');
      UI.toast('Exported '+filename+'.xlsx');
    }catch(e){ UI.toast('Export failed'); console.error(e); }
  }

  async restoreFromFile(file){

    if(!confirm('Restoring will replace ALL current data with the contents of this backup file. Team accounts (Users & Roles) are not affected — those are managed via Supabase Auth. Continue?')) return;
    try{

      ['customers','products','quotations','payments','followups','tasks','notes','settings','gemcrac','orders','complaints','bids'].forEach(k=>{
        if(data[k]!==undefined) Store.data[k] = data[k];
      });

        Orders: Store.data.orders.map(o=>({ID:o.id,'Order Date':o.orderDate,'GEM Order Number':o.gemcNumber||'','Order From':o.orderFrom||'','Product Name':o.productName||'','Party Name':o.party,'Party Phone':o.phone||'','Assigned To':o.assignedTo||'','Status':o.status})),
        Complaints: Store.data.complaints.map(c=>({ID:c.id,'Complaint Date':c.complaintDate,'Complaint From':c.complaintFrom,'Product Name':c.productName||'','Complaint Note':c.note||'','Assigned To':c.assignedTo||'','Status':c.status,'Updated Date':c.updatedDate})),

        ActivityLog: Store.data.activityLog.map(a=>({Time:a.ts,User:a.user,Action:a.action,Details:a.details}))

      Object.keys(sheets).forEach(name=>{
        const rows = sheets[name].length? sheets[name] : [{Info:'No data'}];
        const ws = XLSX.utils.json_to_sheet(rows);

  async importExcel(file){
    if(!file) return;
    const target = document.getElementById('importTarget').value;
    try{
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws);
      if(!rows.length){ UI.toast('No rows found in file'); return; }
      let count = 0;
      if(target==='customers'){
        rows.forEach(r=>{
          const name = r.Name||r.name; const phone = r.Phone||r.phone;
          if(!name || !phone) return;
          Store.data.customers.unshift({
            id: Util.uid('C', Store.data.customers), name: String(name), phone: String(phone),
            email: r.Email||r.email||'', district: r.District||r.district||'', panchayath: r.Area||r.panchayath||'',
            assignedTo: r.AssignedTo||r.assignedTo||'', status: r.Status||r.status||'New Lead',
            lastContact: Util.todayISO(), createdDate: Util.todayISO(),
            timeline:[{id:'T'+Date.now()+count, date:Util.todayISO(), stage:'First Contact', note:'Imported from Excel', by:(Auth.session&&Auth.session.name)||'System'}]
          });
          count++;
        });
        await Store.save('customers');
      } else if(target==='bids'){
        rows.forEach(r=>{
          const title = r.Title||r.title||r['Bid Title']; if(!title) return;
          Store.data.bids.unshift({
            id: Util.uid('BID', Store.data.bids),
            bidNumber: r['Bid No']||r.BidNumber||r['Bid Number']||r.bidNumber||'',
            title: String(title), category: r.Category||r.category||'',
            organisation: r.Department||r.Organisation||r.organisation||'',
            endDate: r['Closing Date']||r.EndDate||r['End Date']||'',
            estimatedValue: Number(r['Bid Value']||r.Value||r.estimatedValue)||0,
            status: 'New', decision:'', description:'', checklist: DEFAULT_BID_CHECKLIST.map(t=>({text:t, done:false})),
            activity:[{ts:new Date().toISOString(), text:'Imported from Excel', by:(Auth.session&&Auth.session.name)||'System'}]
          });
          count++;
        });
        await Store.save('bids');
      } else {
        rows.forEach(r=>{
          const name = r.Name||r.name; if(!name) return;
          Store.data.products.unshift({
            id: Util.uid('P', Store.data.products), code: Number(r.Code||r.code)||(Store.data.products.length+1),
            category: r.Category||r.category||'Uncategorized', name: String(name), unit: r.Unit||r.unit||'Nos',
            price: Number(r.Price||r.price)||0, stock: Number(r.Stock||r.stock)||0, description: r.Description||''
          });
          count++;
        });
        await Store.save('products');
      }
      await Activity.log('Excel import', count+' row(s) imported into '+target+' from '+file.name);
      UI.toast(count+' row(s) imported');
      Router.render('backup');
    }catch(e){ console.error(e); UI.toast('Import failed — check the file format'); }
  },
  renderLog(){
    const list = Store.data.activityLog;
    document.getElementById('backupBody').innerHTML = `
      <div class="toolbar">
        <div class="toolbar-spacer"></div>
        ${Auth.isAdmin()? `<button class="btn btn-outline btn-sm" onclick="Backup.clearLog()">&#128465; Clear Log</button>`:''}
      </div>
      <div class="card"><div class="table-wrap">
      ${list.length? `<table><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Details</th></tr></thead><tbody>
        ${list.map(a=>`<tr>
          <td class="cell-mute">${Util.fmtDateTime(a.ts)}</td>
          <td class="cell-main">${Util.escapeHtml(a.user)}</td>
          <td>${Util.escapeHtml(a.action)}</td>

      </tbody></table>` : `<div class="empty-state"><div class="ic">&#128220;</div><div class="t">No activity recorded yet</div></div>`}
      </div></div>
    `;
  },
  async clearLog(){
    if(!confirm('Clear the entire activity log?')) return;
    Store.data.activityLog = [];
    await Store.save('activityLog');
    UI.toast('Activity log cleared');
    Router.render('backup');
  }

const TEAM_USER_FN_URL = SUPABASE_URL + '/functions/v1/manage-team-user';
async function callTeamUserFn(payload){
  const { data } = await sb.auth.getSession();
  const token = data && data.session && data.session.access_token;
  if(!token){ UI.toast('Your session expired — please log in again.'); return {error:'Not authenticated'}; }
  try{
    const res = await fetch(TEAM_USER_FN_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer '+token, 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify(payload)
    });
    const out = await res.json();
    if(!res.ok || out.error) return { error: (out && out.error) || ('Request failed ('+res.status+')') };
    return out;
  }catch(e){ console.error('manage-team-user call failed', e); return { error: 'Network error contacting the server' }; }
}

      <table><thead><tr><th>Username</th><th>Name</th><th>Role</th><th>Menu Access</th><th></th></tr></thead><tbody>

        <td>${Util.escapeHtml(u.name||'—')}</td>

  openForm(id){
    const rec = id ? Store.data.users.find(u=>u.id===id) : null;
    const v = rec || {id:'',username:'',role:'Sales',name:'',permissions:null};
    const menus = assignableMenus();
    const checkedIds = v.permissions ? v.permissions : menus.map(m=>m.id);
    UI.openModal(rec?'Edit User':'Add User', `
      <div class="field"><label>Username *</label><input id="u_username" value="${Util.escapeHtml(v.username)}" ${rec?'disabled':''}></div>

      <div class="field"><label>Role</label><select id="u_role" onchange="UsersMgmt.toggleRoleUI()"><option ${v.role==='Sales'?'selected':''}>Sales</option><option ${v.role==='Admin'?'selected':''}>Admin</option></select></div>
      <div class="field" id="u_permsWrap" style="display:${v.role==='Admin'?'none':'block'};">
        <label>Menu Access</label>
        <div style="display:flex;gap:6px;margin-bottom:6px;">
          <button type="button" class="btn btn-outline btn-sm" onclick="UsersMgmt.setAllPerms(true)">Select all</button>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;max-height:220px;overflow:auto;border:1px solid var(--border,#e5e7eb);border-radius:8px;padding:10px;">
          ${menus.map(m=>`<label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;"><input type="checkbox" class="u_perm" value="${m.id}" ${checkedIds.includes(m.id)?'checked':''}> ${m.label.replace(/&amp;/g,'&')}</label>`).join('')}
        </div>
        <div class="hint" style="margin-top:6px;">Admins always have access to every menu.</div>
      </div>
    `, `<button class="btn btn-outline" onclick="UI.closeModal()">Cancel</button><button class="btn btn-primary" onclick="UsersMgmt.save('${id||''}')">Save</button>`);

    const role = document.getElementById('u_role').value;
    const wrap = document.getElementById('u_permsWrap');
    if(wrap) wrap.style.display = role==='Admin' ? 'none' : 'block';
  },

    document.querySelectorAll('.u_perm').forEach(cb=>{ cb.checked = state; });

  async save(id){
    const username = document.getElementById('u_username').value.trim();
    const password = document.getElementById('u_password').value;
    if(!username){ UI.toast('Username is required'); return; }
    if(!id && !password){ UI.toast('Password is required for a new user'); return; }
    if(!id && Store.data.users.some(u=>u.username.toLowerCase()===username.toLowerCase())){ UI.toast('Username already exists'); return; }
    const role = document.getElementById('u_role').value;
    const permissions = role==='Admin' ? null : Array.from(document.querySelectorAll('.u_perm:checked')).map(cb=>cb.value);
    const name = document.getElementById('u_name').value.trim();

    const payload = id
      ? { action:'update', id, password: password||undefined, name, role, permissions }
      : { action:'create', username, password, name, role, permissions };
    const out = await callTeamUserFn(payload);
    if(out.error){ UI.toast(out.error); return; }

    await Store.loadUsers();
    await Activity.log(id?'Updated user':'Added user', username);

    if(!confirm('Remove '+username+'? This deletes their login entirely.')) return;
    const out = await callTeamUserFn({ action:'delete', id });
    if(out.error){ UI.toast(out.error); return; }
    await Store.loadUsers();
    await Activity.log('Removed user', username);
    UI.toast('Removed'); Router.render('users');
  }
};

    Store.data.settings.companyPhone = document.getElementById('s_companyPhone').value.trim();
    Store.data.settings.companyEmail = document.getElementById('s_companyEmail').value.trim();
    Store.data.settings.whatsappCC = document.getElementById('s_whatsappCC').value.trim();
    Store.data.settings.gstPercent = Number(document.getElementById('s_gstPercent').value||0);
    await Store.save('settings');
    await Activity.log('Settings updated', 'Company details changed');
    UI.toast('Settings saved');
  },
  async saveBidPrefs(){
    Store.data.settings.preferredBidKeywords = document.getElementById('s_preferredBidKeywords').value.trim();
    Store.data.settings.excludedBidKeywords = document.getElementById('s_excludedBidKeywords').value.trim();
    Store.data.settings.preferredBidStates = document.getElementById('s_preferredBidStates').value.trim();
    Store.data.settings.preferredBidDepts = document.getElementById('s_preferredBidDepts').value.trim();
    Store.data.settings.minBidValue = document.getElementById('s_minBidValue').value?Number(document.getElementById('s_minBidValue').value):null;
    Store.data.settings.maxBidValue = document.getElementById('s_maxBidValue').value?Number(document.getElementById('s_maxBidValue').value):null;
    await Store.save('settings');
    await Activity.log('Settings updated', 'Bid search preferences changed');
    UI.toast('Bid preferences saved');
  }
};

</script>
<script>
App.init();
</script>
